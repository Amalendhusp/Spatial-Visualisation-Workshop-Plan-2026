  // studioCompletedAt timestamp (the stage's actual studio work was
  // finished), or a manually-attached file — some stages are
  // physical-construction based and never touch Panel Studio at all, so
  // their only possible evidence is an upload. Either satisfies this check;
  // neither is required to also produce the other.
  return !!st.studioCompletedAt || (((st.response&&st.response.uploads)||[]).length) > 0;
}
function stagePhase(stageKey){
  if((PKG.progress.completedStages||[]).includes(stageKey)) return 'stage_complete';
  if(!studioIsComplete(stageKey)) return 'studio_pending';
  if(!surveyIsComplete(stageKey)) return 'studio_complete';
  return 'survey_complete';
}
// Brief's finite-state workflow, presented as two large side-by-side
// action cards (Studio / Survey) plus a single banner for the final
// "Complete stage" action — same phase derivation as before (stagePhase(),
// studioIsComplete(), surveyIsComplete()), only the markup changed from a
// vertical numbered stepper to this integrated-dashboard layout.
function renderWorkflowStepper(stageKey){
  const st = PKG.stages[stageKey];
  const phase = stagePhase(stageKey);
  const hasSurvey = !!SURVEYDEF[stageKey] && PKG.share.survey;
  const nextStage = getNextAssignedStage(PKG, [stageKey]);

  // Studio card
  const studioDone = phase!=='studio_pending';
  const n = ((st.response&&st.response.uploads)||[]).length;
  const studioStatus = studioDone
    ? (n>0 ? `Studio work completed — ${n} file${n===1?'':'s'} attached` : 'Studio work completed')
    : (STAGE_BRIEF[stageKey] && STAGE_BRIEF[stageKey].intro);
  const studioCard = `<div class="wf-card ${studioDone?'done':'current'}">
    <div class="wf-card-head">
      <div class="wf-card-icon">${studioDone?'✓':'1'}</div>
      <div class="wf-card-title">Studio</div>
    </div>
    <div class="wf-card-status">${studioStatus}</div>
    ${(stageKey==='s2' && studioDone) ? `<div class="faint" style="font-size:11px;margin-top:2px">Stage 2 completed in ${fmtStudioDuration('s2')} · time budget: ${STAGE_TIME_BUDGET.s2}</div>` : ''}
    <div class="wf-card-action">
      ${studioDone
        ? `<button class="btn ghost sm" onclick="openInPanelStudio('${stageKey}')">Review Submission</button>
           <p class="faint" style="font-size:11px;margin-top:8px">Opens your finished work for viewing — you can still export a PDF/PNG or print it, but it can no longer be edited.</p>`
        : `<button class="btn blue block" onclick="openInPanelStudio('${stageKey}')">${psLoadedForStage===stageKey?'← Continue working':esc(STAGE_VERB[stageKey])} → Studio</button>
           <p class="faint" style="font-size:11px;margin-top:8px">Your time there is captured automatically. <a href="javascript:void(0)" onclick="downloadTaskFileForPanelStudio('${stageKey}')" style="color:inherit">Download task file instead</a> if it doesn't load.</p>`}
    </div>
    ${uploadsHTML(stageKey)}
  </div>`;

  // Survey card (omitted entirely if this stage has no survey). Once done,
  // this is a passive confirmation only — no "Start Survey"/"Review" action
  // — it should not invite the participant to reopen a finished survey.
  let surveyCard = '';
  if(hasSurvey){
    const surveyDone = phase==='survey_complete' || phase==='stage_complete';
    const locked = phase==='studio_pending';
    surveyCard = `<div class="wf-card ${surveyDone?'done':(locked?'locked':'current')}">
      <div class="wf-card-head">
        <div class="wf-card-icon">${surveyDone?'✓':'2'}</div>
        <div class="wf-card-title">Survey</div>
      </div>
      <div class="wf-card-status">${surveyDone?'Survey responses have been recorded.':locked?'Finish the studio task to unlock.':'A short survey about this stage.'}</div>
      <div class="wf-card-action">
        ${surveyDone?'':`<button class="btn blue block" ${locked?'disabled':''} onclick="openSurveyTab('${stageKey}')">Start Survey</button>`}
      </div>
      ${surveyDone?surveyRecordHTML(stageKey):''}
    </div>`;
  }

  // Final state — once both cards above are done the stage has already
  // completed itself automatically (see surveyFinish()/completeStage());
  // this is a passive confirmation, never another button to press.
  const stageDone = phase==='stage_complete';
  const completeLocked = hasSurvey ? phase!=='survey_complete' && !stageDone : phase!=='studio_complete' && !stageDone;
  let completeBanner;
  if(stageDone){
    // A Final Reflection is required before export whenever the researcher
    // included one (PKG.share.finalReflection) — it's a workshop-level
    // instrument, not tied to this or any stage, so it's gated here rather
    // than as a 6th stage card. Once submitted (or if it was never
    // required), the Export button appears exactly as before.
    const needsFinalReflection = !!PKG.share.finalReflection && !isFinalReflectionDone();
    completeBanner = nextStage
      ? `<div class="wf-complete-banner done">
           <div class="wf-complete-text"><b>All activities for this stage have been completed.</b><br><span class="faint" style="font-size:12.5px">Select <b>${esc(STAGE_NAME[nextStage].split(' · ')[0])}</b> from the left to continue.</span></div>
         </div>`
      : needsFinalReflection
      ? `<div class="wf-complete-banner done">
           <div class="wf-complete-text"><b>One last thing</b><br><span class="faint" style="font-size:12.5px">You've completed every activity assigned to you. Please answer a short final reflection before exporting your workshop file.</span></div>
           <button class="btn blue" onclick="openFinalReflection()">Start Final Reflection →</button>
         </div>`
      : `<div class="wf-complete-banner done">
           <div class="wf-complete-text"><b>End of workshop</b><br><span class="faint" style="font-size:12.5px">You've completed every activity assigned to you. Export your final workshop file below, then send it to your researcher along with any other files they asked for.</span></div>
           <button class="btn green" onclick="exportFinalPackage()">⬇ Export Final Workshop Package</button>
         </div>`;
  } else if(completeLocked){
    completeBanner = `<div class="wf-complete-banner locked">
      <div class="wf-complete-text faint">Complete the ${hasSurvey?'studio task and survey':'studio task'} to finish this stage.</div>
    </div>`;
  } else {
    // Only reachable for a stage with no survey (hasSurvey===false) — a
    // survey-bearing stage completes itself the instant Finish is clicked
    // (surveyFinish() calls completeStage() directly), so this manual path
    // never fires for any stage defined in SURVEYDEF today.
    completeBanner = `<div class="wf-complete-banner ready">
      <div class="wf-complete-text"><b>Everything for this stage is done.</b></div>
      <button class="btn green" onclick="completeStage('${stageKey}')">Mark stage complete${nextStage?' → '+esc(STAGE_NAME[nextStage].split(' · ')[0]):''}</button>
    </div>`;
  }

  return `<div class="wf-row">${studioCard}${surveyCard}</div>${completeBanner}`;
}

// Short (1-2 sentence) participant-friendly narrative at the top of the
// Brief page — why the activity exists, not what to do (that's
// briefStepsHTML below).
function briefIntroHTML(text){
  if(!text) return '';
  return `<p class="brief-intro">${esc(text)}</p>`;
}
// Exactly 3 numbered, action-oriented steps — what to do, never how to
// solve it. Same structure on every stage (see STAGE_BRIEF).
function briefStepsHTML(steps){
  if(!steps || !steps.length) return '';
  return `<ol class="brief-steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
}
// Small standing callout panel used identically across every introductory
// screen (Brief pages, Welcome, Final Reflection) — same visual treatment
// everywhere; defaults to REMEMBER_NOTE (Brief pages' and Welcome's usage),
// but Final Reflection passes its own closing/thank-you text through the
// same box so the whole sequence reads as one coherent design.
function briefReminderHTML(text){
  return `<div class="brief-reminder">${esc(text||REMEMBER_NOTE)}</div>`;
}
// Just the Task Image — the Front&Back/Flat-sketch/Panel-arrangement
// scaffold set is intentionally Studio-only now (see the left-panel image
// tabs there); Brief shows only the one primary reference image.
function briefTaskImageHTML(g){
  if(!g || !g.fullImg) return '<p class="faint" style="font-size:12px">No image attached.</p>';
  return `<img class="brief-task-img" src="${g.fullImg}" alt="Task image">`;
}
function renderStageBrief(stageKey){
  const st=PKG.stages[stageKey];
  const isDone=(PKG.progress.completedStages||[]).includes(stageKey);
  // Integrated dashboard: task brief + task image up top, then the
  // Studio/Survey workflow cards and the single Complete-stage action below
  // — no more stacked sections separated by <hr>. "Compare with the
  // researcher's solution" is intentionally not shown here for now
  // (solutionCompareHTML still exists, just unused) — see Section 4 of the
  // brief this redesign came from.
  // Stage 2 (25-Minute Timed Construction Activity) — the Full Panel
  // Arrangement is task input here, not a post-task solution, so it must be
  // visible and downloadable BEFORE the construction activity starts, not
  // gated on studioIsComplete() like every other stage's stageDocumentsHTML
  // call below. Positioned before renderWorkflowStepper() (which holds the
  // "→ Studio" button) so the participant naturally sees it before starting.
  const s2FullArrangementHTML = (stageKey==='s2' && st.garment && st.garment.fullArrangementPdf) ? `
    <div class="card" style="margin-top:16px">
      <h2>Full Panel Arrangement</h2>
      <p class="sub">Download this panel arrangement before beginning the construction activity. You can access it again anytime during Stage 2.</p>
      ${stageDocumentsHTML(st.garment)}
    </div>` : '';
  return `<div class="ff-main">${renderTabStrip()}<div class="screen">
    <div class="eyebrow accent">Assigned by researcher</div>
    <div class="row" style="align-items:baseline;gap:10px;flex-wrap:wrap">
      <h1 style="margin-bottom:0">${STAGE_NAME[stageKey].split(' · ')[0]}</h1>
      ${STAGE_TIME_BUDGET[stageKey]?`<span class="badge">${STAGE_TIME_BUDGET[stageKey]} budget</span>`:''}
      ${isDone?'<span class="faint" style="font-size:12px">recorded</span>':''}
    </div>
    ${!st.assigned?'<div class="stepnote" style="margin-top:14px">Your researcher hasn\'t assigned a garment for this stage yet — check back once they have, or open an updated package file.</div>':`
    <div class="brief-top card">
      <div class="brief-top-grid">
        <div class="brief-top-text">
          ${briefIntroHTML(STAGE_BRIEF[stageKey] && STAGE_BRIEF[stageKey].intro)}
          ${briefStepsHTML(STAGE_BRIEF[stageKey] && STAGE_BRIEF[stageKey].steps)}
          ${st.styleLine?`<p style="margin-top:10px;font-size:13px"><b>Style line:</b> ${esc(st.styleLine)}</p>`:''}
        </div>
        <div class="brief-top-image">${briefTaskImageHTML(st.garment)}</div>
      </div>
      ${stageKey==='s3'?markedSetsHTML(st.garment):''}
      ${briefReminderHTML()}
    </div>
    ${s2FullArrangementHTML}
    ${renderWorkflowStepper(stageKey)}
    ${stageKey!=='s2' && studioIsComplete(stageKey)?stageDocumentsHTML(st.garment):''}
    ${isDone?solutionImageHTML(stageKey):''}`}
  </div></div>`;
}

// Full-bleed, dashboard-free screen (mirrors the land-hero treatment used
// for import/welcome/completion) — a guided questionnaire, not a form
// embedded in the rest of the app's chrome. See render()'s dispatch: this
// is the one screen that deliberately skips renderDashboard().
function renderStageReflect(stageKey){
  const def = SURVEYDEF[stageKey];
  const hasSurvey = !!(PKG.share.survey && def);
  let progressPct = 0;
  if(hasSurvey){
    const st = PKG.stages[stageKey];
    if(!st.response) st.response = emptyResponse();
    if(!st.response.survey) st.response.survey = def.qs.map(()=>null);
    const ui = surveyInitUI(stageKey, def, st.response.survey);
    progressPct = ui.done ? 100 : Math.round(((ui.idx+1)/def.qs.length)*100);
  }
  return `<div class="sv-shell">
    <div class="sv-toprogress"><i style="width:${progressPct}%"></i></div>
    <div class="sv-topbar">
      <span class="sv-exit-link" onclick="PKG.progress.currentScreen='brief';render();">← Brief</span>
      <span class="brand">Flat ⇄ Form</span>
    </div>
    <div class="sv-body">
      ${hasSurvey?surveyFormHTML(stageKey):'<div class="card sv-card sv-complete"><p class="faint">No survey is part of this stage.</p></div>'}
    </div>
  </div>`;
}

// Always null now — completeStage() no longer sets it (see below), so the
// "stage complete" interstitial screen it used to trigger never shows.
// Left in place, unused, rather than torn out — same "hide, don't delete"
// treatment as SURVEY_JUST_COMPLETED/renderSurveyCompleteScreen below.
let STAGE_JUST_COMPLETED = null;
// Marks a stage complete and stays right there showing it (checkmarks and
// all) — it no longer jumps the viewed stage to whatever comes next or
// shows a "continue" interstitial. Only the *availability* pointer
// (progress.currentStage) advances, which is what unlocks the next stage's
// row in the left rail; the participant chooses when to click into it.
async function completeStage(stageKey){
  const st=PKG.stages[stageKey];
  if(!st.assigned){ if(!confirm('This stage has no garment assigned yet — mark it complete anyway?')) return; }
  if(!st.response) st.response=emptyResponse();
  if(!st.response.submittedAt) st.response.submittedAt = new Date().toISOString();
  st.completed=true; st.completedAt=new Date().toISOString();
  if(!PKG.progress.completedStages.includes(stageKey)) PKG.progress.completedStages.push(stageKey);
  const next=getNextAssignedStage(PKG);
  if(next){
    PKG.progress.currentStage=next;
    if(!(PKG.lifecycleLog||[]).some(e=>e && e.type==='stage_entered' && e.stage===next)){
      logLifecycle('stage_entered', next);
    }
  }
  else { endCurrentSession('completed'); }
  PKG.progress.currentScreen='brief';
  VIEW_STAGE=stageKey;
  render();
  // Deliberately no saveProgress() here — same reasoning as
  // PanelStudio.onComplete above: this can fire outside a real user
  // gesture (from surveyFinish()), where showSaveFilePicker() always
  // throws and falls back to forcing a real file download.
}
// Final, deliberate export shown once every assigned stage is complete —
// distinct from the ongoing checkpoint saves throughout the workshop.
// Downloads the same package (same "-Solution" filename convention) through
// the existing saveProgress() mechanism, then locks the application via
// PKG.progress.workshopFinalized — but only once saveProgress() confirms a
// real write/download happened, never on a cancelled dialog or read failure
// (that would strand the participant with a locked app and no file).
async function exportFinalPackage(){
  if(!PKG) return;
  if(!confirm('This exports your final workshop file and locks this application — no further changes will be possible afterwards. Continue?')) return;
  PKG.progress.workshopFinalized = true;
  PKG.progress.finalizedAt = new Date().toISOString();
  const ok = await saveProgress();
  if(!ok){
    PKG.progress.workshopFinalized = false;
    PKG.progress.finalizedAt = null;
    toast('Export was cancelled — nothing was locked. Try again when ready.');
    render();
    return;
  }
  render();
}
// Priority 5 — if the participant dismissed/cancelled the save dialog that
// exportFinalPackage() triggered (or just wants a second copy), this lets
// them get the exact same finalized file again without re-running the
// export flow. Deliberately a plain forced download, not saveProgress()'s
// File System Access API path — that path can silently reuse an existing
// file handle with no visible dialog at all, which would be a confusing
// "nothing happened" experience for a button whose whole point is "give me
// the file again." Reads PKG as it already exists in memory — finalized
// content never changes after exportFinalPackage() ran, so this reproduces
// byte-for-byte the same package under byte-for-byte the same filename;
// nothing is regenerated.
async function redownloadFinalPackage(){
  if(!PKG) return;
  let json;
  try{ json = JSON.stringify(PKG, null, 2); }
  catch(e){ alert('Could not prepare the file: '+e.message); return; }
  const name = currentPkgFileName || 'workshop-package.json';
  const blob = new Blob([json], {type:'application/json'});
  try{
    const dataUrl = await new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result);
      reader.onerror = ()=>rej(reader.error||new Error('File could not be read'));
      reader.readAsDataURL(blob);
    });
    const a=document.createElement('a'); a.href=dataUrl; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded "'+name+'" again');
  }catch(err){
    alert('Could not download (file read failed).');
  }
}
// The filename is deliberately not shown by default — it's an internal
// naming convention (participant id, stages, timestamp, export id), not
// something a participant needs to see or act on. One clear action
// (download) instead. Kept available, but tucked behind a collapsed
// "Show technical details" section, for the rare case someone needs it
// (e.g. to confirm which file they're looking at when troubleshooting).
function renderWorkshopFinalized(){
  return `<div class="land-hero screen">
    <div class="brand">Flat ⇄ Form</div>
    <h1>Workshop complete</h1>
    <p class="sub">Thank you for taking part. Please send the downloaded file to your researcher, along with any other files they asked for, if you haven't already.</p>
    <div class="land-card" style="text-align:center">
      <div class="ico" style="font-size:40px;margin-bottom:16px">🔒</div>
      <button class="btn blue" onclick="redownloadFinalPackage()">⬇ Download Workshop File</button>
      <details style="margin-top:16px;text-align:left">
        <summary class="faint" style="font-size:11px;cursor:pointer">Show technical details</summary>
        <p class="faint mono" style="font-size:11px;margin-top:6px">Filename: ${esc(currentPkgFileName||'')}</p>
      </details>
    </div>
  </div>`;
}
function continueFromCompletion(){
  STAGE_JUST_COMPLETED = null;
  render();
}
function renderStageCompleteScreen(stageKey, nextKey){
  const name = esc(STAGE_NAME[stageKey].split(' · ')[0]);
  return `<div class="land-hero screen">
    <div class="brand">Flat ⇄ Form</div>
    <h1>${name} complete</h1>
    <p class="sub">${nextKey
      ? `Nice work. Your next activity is <b>${esc(STAGE_NAME[nextKey].split(' · ')[0])}</b>.`
      : `You've completed every activity assigned to you. Thank you for taking part in the workshop.`}</p>
    <div class="land-card" style="text-align:center">
      <div class="ico" style="font-size:40px;margin-bottom:16px">✓</div>
      ${nextKey
        ? `<button class="btn blue block" onclick="continueFromCompletion()">Continue to ${esc(STAGE_NAME[nextKey].split(' · ')[0])} →</button>`
        : `<button class="btn blue block" onclick="continueFromCompletion()">← Back to Task Flow</button>`}
    </div>
  </div>`;
}

// Transient — set when the participant finishes the last survey question.
// Distinct from STAGE_JUST_COMPLETED: finishing the survey does not, by
// itself, mark the whole stage complete (that's now a deliberate action on
// Brief) — it just returns navigation there. Never persisted, same
// reasoning as STAGE_JUST_COMPLETED above.
let SURVEY_JUST_COMPLETED = null;
function continueFromSurveyCompletion(){
  SURVEY_JUST_COMPLETED = null;
  PKG.progress.currentScreen = 'brief';
  render();
}
function renderSurveyCompleteScreen(stageKey){
  return `<div class="land-hero screen">
    <div class="brand">Flat ⇄ Form</div>
    <h1>Survey complete</h1>
    <p class="sub">Thanks — your responses for <b>${esc(STAGE_NAME[stageKey].split(' · ')[0])}</b> have been recorded.</p>
    <div class="land-card" style="text-align:center">
      <div class="ico" style="font-size:40px;margin-bottom:16px">✓</div>
      <button class="btn blue block" onclick="continueFromSurveyCompletion()">← Back to Task Flow</button>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
