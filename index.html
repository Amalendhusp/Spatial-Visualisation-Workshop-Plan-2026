<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat⇄Form · Participant</title>
<!-- Panel Studio's own CDN deps, now loaded here since it's a native module
     instead of a separate document (see panel-studio-module.js/.css). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="panel-studio-module.css?v=8">
<style>
  /* ── Presentation-layer restyle only (Claude Design "Task Flow" reference).
     No render() dispatch logic, schema, or Panel Studio protocol changes —
     see the render*() functions below for what moved/stayed and why. ── */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#171512; --ink-faint:#8a8578; --line:#e6e2d8; --bg:#faf9f6; --card:#fff;
    --accent:#d6473c; --green:#1a7f37; --physical:#f2d9d9; --physical-ink:#a33;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  #root{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
  @media (max-width:820px){ #root{grid-template-columns:1fr;} }
  .ff-solo{grid-column:1/-1;max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .ff-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;}
  .ff-pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid var(--ink);flex-wrap:wrap;}
  .ff-pagehead-title{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .ff-pagehead-trail{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ff-rail{grid-column:1;padding:28px 24px;border-right:1px solid var(--line);background:var(--card);}
  .ff-main{grid-column:2;padding:28px 40px;min-width:0;}
  /* Landing / welcome screens (import + verify) */
  .land-hero{grid-column:1/-1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
  .land-hero .brand{font-size:22px;margin-bottom:28px;}
  .land-hero h1{font-size:40px;margin-bottom:14px;}
  .land-hero p.sub{max-width:480px;margin:0 auto 32px;font-size:15px;}
  .land-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(23,21,18,.06);}
  .land-dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
  .land-dropzone:hover{border-color:var(--accent);background:#fdf6f5;}
  .land-dropzone .ico{font-size:28px;margin-bottom:10px;}
  .land-identity{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg);border-radius:10px;margin-bottom:20px;}
  .land-identity .avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.01em;margin-bottom:20px;}
  .brand .sep{color:var(--ink-faint);font-weight:400;}
  /* App name and participant name given equal typographic weight — two
     independently important pieces of information, not a title+caption. */
  .ff-header-brand{display:flex;align-items:baseline;gap:16px;}
  .ff-header-app{font-weight:800;font-size:18px;letter-spacing:-.01em;}
  .ff-header-participant{font-weight:800;font-size:18px;letter-spacing:-.01em;padding-left:16px;border-left:2px solid var(--line);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .eyebrow.accent{color:var(--accent);}
  .big-frac{font-size:38px;font-weight:800;line-height:1;}
  .big-frac .of{color:var(--ink-faint);font-weight:400;}
  .progressbar{height:4px;background:var(--line);border-radius:2px;margin:14px 0 20px;overflow:hidden;}
  .progressbar>i{display:block;height:100%;background:var(--ink);}
  .rail-note{font-size:12px;color:var(--ink-faint);margin-top:18px;line-height:1.5;}
  .rail-foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  /* Training Task — deliberately styled apart from .stage-list (dashed
     border, no numbering, no progress accent) so it reads as optional
     interface practice, never as one of the assigned research stages. */
  .training-block{margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:10px;}
  .training-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
  .training-desc{font-size:12px;color:var(--ink-faint);margin-top:2px;margin-bottom:10px;}
  .training-done{font-size:12px;color:var(--green);font-weight:600;margin-bottom:8px;}
  h1{font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em;}
  h2{font-size:15px;font-weight:700;margin-bottom:8px;}
  p.sub{color:var(--ink-faint);font-size:14px;margin-bottom:16px;line-height:1.6;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  hr.rule{border:none;border-top:1px solid var(--line);margin:20px 0;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);}
  .btn:hover{border-color:#bbb;}
  .btn.blue{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.green{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn.ghost{background:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.block{width:100%;justify-content:center;}
  .row{display:flex;align-items:center;gap:10px;}
  .spacer{flex:1;}
  .faint{color:var(--ink-faint);}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  input[type=file]{font-size:13px;}
  textarea,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fdfdfc;}
  textarea{min-height:90px;resize:vertical;}
  .stage-list{display:flex;flex-direction:column;}
  .stage-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-left:2px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;}
  .stage-row:last-child{border-bottom:none;}
  .stage-row.current{border-left-color:var(--accent);}
  .stage-row.locked{opacity:.45;cursor:default;}
  .stagenum{font-size:11px;font-weight:700;color:var(--ink-faint);width:20px;flex-shrink:0;}
  .stage-row.done .stagenum{color:var(--ink);}
  .stage-row-name{flex:1;font-size:14px;font-weight:600;}
  .stage-row.done .stage-row-name::after{content:' ✓';color:var(--green);}
  .stage-row-time{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .scaffold-imgs{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .scaffold-imgs figure{text-align:center;}
  .scaffold-imgs img{height:150px;max-width:230px;object-fit:contain;border:1px dashed var(--line);border-radius:8px;background:#fafaf8;padding:8px;}
  .scaffold-imgs figcaption{font-size:11px;color:var(--ink-faint);margin-top:4px;text-transform:uppercase;letter-spacing:.03em;}
  .qgroup{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .qgroup:first-child{border-top:none;padding-top:0;margin-top:0;}
  .qtitle{font-weight:800;font-size:clamp(24px,2.6vw,34px);line-height:1.3;margin-bottom:40px;letter-spacing:-.015em;}
  .likert{display:flex;align-items:center;gap:28px;margin-top:8px;}
  .likert .end{font-size:13px;color:var(--ink-faint);width:110px;line-height:1.45;}
  .likert .opts{display:flex;gap:26px;flex:1;justify-content:center;}
  .likert label{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-faint);cursor:pointer;}
  .likert .sv-likert-circle{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--ink-faint);background:#fff;transition:border-color .15s,background .15s,color .15s,transform .1s;}
  .likert label:hover .sv-likert-circle{border-color:var(--accent);transform:translateY(-2px);}
  .likert label:has(input:checked) .sv-likert-circle{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.04);}
  .likert input{position:absolute;opacity:0;width:1px;height:1px;}
  .optlist{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .optlist label{display:flex;align-items:center;gap:14px;font-size:16px;cursor:pointer;padding:20px 24px;border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,background .15s,transform .1s;}
  .optlist label:hover{border-color:#ccc;transform:translateY(-1px);}
  .optlist label:has(input:checked){border-color:var(--accent);background:#fdf1f0;font-weight:600;}
  .optlist input[type=radio],.optlist input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;}
  .likert-labeled .sv-likert-label{font-size:11px;color:var(--ink-faint);text-align:center;max-width:80px;line-height:1.25;}
  .likert-labeled label:has(input:checked) .sv-likert-label{color:var(--accent);font-weight:600;}
  .opt-other{flex-wrap:wrap;}
  .opt-other .other-input{display:none;flex-basis:100%;margin-left:34px;width:calc(100% - 34px);max-width:400px;font-size:14px;font-weight:400;padding:10px 13px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .opt-other:has(input:checked) .other-input{display:block;}
  .refq{font-size:13px;padding:6px 0;color:#333;}
  .refq b{color:var(--ink-faint);font-weight:600;}
  .badge{display:inline-block;padding:4px 12px;border-radius:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#f2f0ea;color:var(--ink);border:1px solid var(--line);}
  .trail{display:flex;align-items:center;gap:0;margin-bottom:14px;}
  .trail.compact{margin-bottom:0;}
  .trail-node{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .trail-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;background:var(--bg);color:var(--ink-faint);border:1px solid var(--line);}
  .trail-circle.done{background:var(--ink);color:#fff;border-color:var(--ink);}
  .trail-circle.current{background:var(--accent);border-color:var(--accent);color:#fff;}
  .trail.compact .trail-circle{width:18px;height:18px;font-size:9px;}
  .trail-node-label{font-size:10px;color:var(--ink-faint);white-space:nowrap;}
  .trail-node-label.on{color:var(--ink);font-weight:700;}
  .trail-connector{flex:1;height:1px;background:var(--line);margin:0 4px;align-self:center;transform:translateY(-8px);}
  .trail.compact .trail-connector{transform:translateY(-5px);margin:0 3px;}
  .microstep{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);margin-bottom:16px;}
  .microstep .on{color:var(--accent);font-weight:700;}
  .microstep .sep{color:var(--line);}
  .screen{animation:screenFade .22s ease;}
  @keyframes screenFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .dropzone{border:1.5px dashed #ccc;border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink-faint);cursor:pointer;}
  .dropzone:hover{border-color:var(--accent);color:var(--accent);}
  .filelist{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .filerow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;background:var(--bg);border-radius:8px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .stepnote{background:#fdf6e3;border:1px solid #f0e4a0;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;}
  /* One-question-at-a-time survey flow — a full-bleed, immersive screen of
     its own (like the landing/welcome screens), deliberately decoupled from
     the dashboard/tab-strip chrome that wraps the rest of the app. */
  /* height:100vh + overflow:hidden (not min-height) is deliberate — the
     whole shell must never scroll (that's the bug being fixed). Any
     question whose content is taller than the fixed-height card scrolls
     internally within .sv-qbody instead; .sv-nav sits outside that
     scrolling region so it never moves. */
  .sv-shell{grid-column:1/-1;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);}
  .sv-toprogress{height:4px;background:var(--line);width:100%;flex-shrink:0;}
  .sv-toprogress>i{display:block;height:100%;background:var(--accent);transition:width .35s ease;}
  .sv-topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;flex-shrink:0;}
  .sv-topbar .brand{margin-bottom:0;font-size:15px;color:var(--ink-faint);font-weight:700;}
  .sv-exit-link{font-size:13px;font-weight:600;color:var(--ink-faint);cursor:pointer;padding:6px 4px;}
  .sv-exit-link:hover{color:var(--accent);}
  .sv-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 24px 32px;}
  .sv-card{position:relative;width:100%;max-width:760px;height:min(780px,100%);display:flex;flex-direction:column;padding:44px 64px 24px;animation:svIn .4s cubic-bezier(.2,.8,.2,1);}
  /* Question 7's rank UI can hold up to 7 bucket rows plus its chip row —
     denser than any other question type — so it gets a tighter title/
     eyebrow margin to leave it more room, keeping "all ranked items visible
     without scrolling" true in the worst case (every option selected). */
  .sv-card:has(.rank-q) .qtitle{margin-bottom:18px;}
  .sv-card:has(.rank-q) .sv-eyebrow-row{margin-bottom:10px;}
  .sv-card.leaving{animation:svOut .18s ease forwards;}
  @keyframes svIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes svOut{to{opacity:0;transform:translateY(-10px) scale(.98)}}
  .sv-qbody{flex:1;min-height:0;overflow-y:auto;}
  .sv-eyebrow-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .sv-stage-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);}
  .sv-qcount{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);}
  /* Anchored footer, always the same height and screen position regardless
     of question content — never part of the scrolling .sv-qbody above. */
  .sv-nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:24px;border-top:1px solid var(--line);}
  .sv-nav .btn{padding:14px 26px;font-size:15.5px;}
  .sv-card.sv-complete{align-items:center;justify-content:center;text-align:center;padding:32px 64px;}
  .sv-complete .ico{font-size:46px;margin-bottom:6px;}
  .sv-complete-title{font-size:27px;font-weight:800;letter-spacing:-.01em;}
  /* Question 7 (pretest/post-test) — select difficult panels, then drag
     within the bucket to rank them most→least difficult. Answer storage is
     the same ordered-array shape as a plain multi-select. */
  .rank-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
  .rank-chip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;transition:border-color .15s,background .15s;}
  .rank-chip:hover{border-color:#ccc;}
  .rank-chip.on{border-color:var(--accent);background:#fdf1f0;font-weight:600;}
  .rank-chip input{width:14px;height:14px;accent-color:var(--accent);}
  .rank-bucket-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:12px 0 6px;}
  .rank-empty{font-size:13px;margin-top:14px;}
  .rank-bucket{display:flex;flex-direction:column;gap:5px;}
  .rank-item{display:flex;align-items:center;gap:10px;padding:6px 14px;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:grab;}
  .rank-item:active{cursor:grabbing;}
  .rank-num{width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-label{flex:1;font-size:13.5px;font-weight:600;}
  .rank-handle{color:var(--ink-faint);font-size:14px;cursor:grab;}
  /* Brief page's finite-state workflow, as an integrated dashboard — two
     side-by-side action cards (Studio/Survey) plus one banner for the
     final Complete-stage action, instead of a stacked vertical list. */
  .brief-top{margin-bottom:20px;}
  .brief-top-grid{display:grid;grid-template-columns:1fr 220px;gap:28px;align-items:center;}
  .brief-intro{font-size:15.5px;line-height:1.6;font-weight:500;color:var(--ink);margin:0 0 16px;}
  .brief-steps{margin:0;padding:0;list-style:none;counter-reset:briefstep;}
  .brief-steps li{counter-increment:briefstep;position:relative;padding-left:34px;font-size:14.5px;line-height:1.5;color:var(--ink);margin-bottom:10px;}
  .brief-steps li:last-child{margin-bottom:0;}
  .brief-steps li::before{content:counter(briefstep);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .brief-reminder{margin-top:18px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;font-style:italic;color:var(--ink-faint);line-height:1.5;}
  .brief-task-img{width:100%;max-height:190px;object-fit:contain;display:block;border:1px solid var(--line);border-radius:8px;background:#fafaf8;padding:10px;}
  @media (max-width:720px){ .brief-top-grid{grid-template-columns:1fr;} }
  .wf-row{display:flex;gap:20px;align-items:stretch;margin-bottom:16px;}
  .wf-card{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;}
  .wf-card.current{border-color:var(--accent);box-shadow:0 2px 14px rgba(214,71,60,.08);}
  .wf-card.locked{opacity:.55;}
  .wf-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .wf-card-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;border:2px solid var(--line);color:var(--ink-faint);background:#fff;}
  .wf-card.done .wf-card-icon{background:var(--ink);border-color:var(--ink);color:#fff;}
  .wf-card.current .wf-card-icon{background:var(--accent);border-color:var(--accent);color:#fff;}
  .wf-card-title{font-weight:700;font-size:16px;}
  .wf-card-status{font-size:13px;color:var(--ink-faint);line-height:1.55;margin-bottom:14px;}
  .wf-card-action{margin-top:auto;}
  .wf-card-action .btn.block{width:100%;justify-content:center;}
  .wf-uploads{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .wf-uploads-head{display:flex;align-items:center;justify-content:space-between;}
  .wf-uploads-label{font-size:11.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .wf-uploads-add{font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;}
  .wf-uploads .filelist{margin-top:8px;}
  .wf-complete-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);}
  .wf-complete-banner.ready{border-color:var(--green);background:#f2f9f2;}
  .wf-complete-banner.locked{opacity:.6;}
  .wf-complete-banner.done{border-color:var(--ink);background:#f7f6f3;}
  .wf-complete-text{font-size:14px;line-height:1.6;}
  /* Stage-completion interstitial */
  #ps-container{display:none;position:fixed;inset:0;z-index:500;background:#fff;flex-direction:column;}
  #ps-native-root{flex:1;width:100%;overflow:hidden;position:relative;}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" onload="window._lucideLoaded=true; if(window.lucide) lucide.createIcons();" onerror="console.warn('Lucide icon library failed to load from CDN — toolbar icons will be blank until this loads. Check network access.');"></script>

<body>
<div id="root"></div>

<!-- Panel Studio, mounted natively in-page (no iframe — see
     panel-studio-module.js) — this container is never touched by render()'s
     innerHTML replacement, so its work-in-progress stays intact across
     every other interaction on the page. Visibility is toggled directly,
     not re-rendered. PanelStudio.mount() injects into #ps-native-root once
     and is never re-mounted, so switching tabs away and back preserves it.
     No outer topbar here on purpose — Panel Studio's own studio-header
     (title/stage badge/progress/timer/Finish) is the only chrome above the
     workspace; the participant's sole way out is confirming Finish. -->
<div id="ps-container">

// Unlock progression is deliberately NOT a stored field — it's derived from
// lifecycleLog, the same way computeStageMetrics() (Console) already
// derives activity duration from activity_entered/exited pairs. Revealing
// additional-reference N requires 1..N-1 already revealed (the UI never
// allows skipping — see Panel Studio's renderScaffoldIcons), so "how many
// distinct refs have a reference_shown event, counted from the start of
// the list" IS the current unlock level; no separate persisted counter can
// drift out of sync with the real event history. Stops at the first
// not-yet-revealed one so a structurally impossible out-of-order event
// (there shouldn't be one) can't inflate the count.
function unlockedReferenceCount(stageKey){
  const refs = STAGE_REFERENCES[stageKey];
  if(!refs) return 0;
  const log = (PKG && PKG.lifecycleLog) || [];
  const shown = new Set(log.filter(e=>e && e.stage===stageKey && e.type==='reference_shown' && e.ref).map(e=>e.ref));
  let count=0;
  for(const r of refs.additional){ if(shown.has(r.key)) count++; else break; }
  return count;
}
// Automatic Reveal — once Studio work for a stage is finished, the
// "never skip ahead" rule above no longer serves any purpose (there's
// nothing left to bias), so the Full Panel Arrangement hint — if this stage
// has one — becomes available immediately, without the participant having
// to click through every hint before it. Implemented as a genuine
// "catch-up" reveal (logging reference_shown for anything still unrevealed
// up to and including it) rather than a special case elsewhere, so every
// other derivation (unlockedReferenceCount, hint-usage metrics) keeps
// working unchanged. A no-op for stages with no such hint (pretest/
// posttest/s1 today) and for Stage 2, whose Full Panel Arrangement is the
// primary task reference shown from the very start, not a hint to reveal.
function autoRevealFullArrangement(stageKey){
  if(stageKey==='s2') return;
  const refs = STAGE_REFERENCES[stageKey];
  if(!refs) return;
  const idx = refs.additional.findIndex(r=>r.key==='fullArrangement');
  if(idx===-1) return;
  const already = unlockedReferenceCount(stageKey);
  for(let i=already; i<=idx; i++){ logLifecycle('reference_shown', stageKey, refs.additional[i].key); }
}

function newId(prefix){
  if(window.crypto && typeof crypto.randomUUID === 'function') return prefix+'_'+crypto.randomUUID();
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
}
function startSession(){
  if(!PKG) return;
  if(!PKG.sessions) PKG.sessions = [];
  PKG.sessions.forEach(s=>{ if(!s.endedAt){ s.endedAt = new Date().toISOString(); s.endedReason = 'replaced'; } });
  const id = newId('sess');
  PKG.sessions.push({id, startedAt:new Date().toISOString(), endedAt:null, endedReason:null});
  currentSessionId = id;
}
function endCurrentSession(reason){
  if(!PKG || !currentSessionId) return;
  const s = PKG.sessions.find(s=>s.id===currentSessionId);
  if(s && !s.endedAt){ s.endedAt = new Date().toISOString(); s.endedReason = reason; }
}

// ── Native integration with Panel Studio (panel-studio-module.js) — no
// iframe, no postMessage. PanelStudio.mount() is called once and its DOM/JS
// state then lives for the rest of the page's life, so leaving the Activity
// screen and coming back doesn't lose work-in-progress, same as before. ──
PanelStudio.onComplete(async function(project, stageKey){
  // Training Task uses this exact same "Finish" button/modal/callback
  // plumbing (see panel-studio-module.js's showCompleteModal() isTraining
  // branch), but must never fall through into the research-stage logic
  // below — finishTrainingTask() is a fully separate, non-stage path.
  if(stageKey==='training'){ finishTrainingTask(); return; }
  if(!stageKey || !PKG || !PKG.stages[stageKey]) return;
  const st = PKG.stages[stageKey];
  if(!st.response) st.response=emptyResponse();
  // Marks the studio work itself done via a dedicated timestamp rather than
  // recording a redundant panel-studio-work-*.json "upload" — the whole
  // package (already saved throughout, and exported again at the very end)
  // is the single authoritative record of this project's state, so a
  // second copy of the same data as a fake "attached file" added nothing.
  // studioIsComplete() below still also honours a genuine manual upload
  // (Stage 2's physical-construction photos etc.), unaffected by this.
  st.studioCompletedAt = new Date().toISOString();
  autoRevealFullArrangement(stageKey);
  PanelStudio.setReferenceUnlockState(unlockedReferenceCount(stageKey));
  // Confirming Finish inside the Studio (timer already stopped by
  // _confirmComplete()) closes it immediately and returns to Brief — Brief's
  // own workflow stepper picks this up automatically via stagePhase(), since
  // studioIsComplete() just became true. No manual "Done — continue" step,
  // and no auto-jump into Survey either — Brief is the hub the participant
  // chooses "Start Survey" from.
  logLifecycle('activity_exited', stageKey);
  PKG.progress.currentScreen = 'brief';
  toast('Your Panel Studio work for '+STAGE_NAME[stageKey]+' was recorded');
  render();
  // Deliberately no saveProgress() here — this callback runs outside a real
  // user gesture (Finish's confirm click already resolved), so
  // showSaveFilePicker() always throws and saveProgress() silently falls
  // back to forcing a real browser file download on the participant. The
  // work above is already recorded into PKG in memory (same as every other
  // in-app action — survey answers, uploads); it persists to a file the
  // next time the participant hits an explicit Save button.
});
// "Back to Activity" clicked inside a read-only (already-completed) Studio
// view — same destination Studio always returns to on completion (Brief is
// the hub; see the comment above).
PanelStudio.onBack(function(){
  PKG.progress.currentScreen = 'brief';
  render();
});
// Progressive Reference system — fires whenever the participant reveals,
// switches to, or hides a reference tab inside Panel Studio's task-brief
// panel. Participant owns all logging (invariant: Panel Studio never
// touches PKG); Panel Studio only reports the raw interaction. action is
// 'shown' or 'hidden' — a tab switch fires hidden(old) then shown(new), so
// per-reference viewing intervals and counts are always derivable from
// consecutive pairs, the same shape as activity_entered/exited.
// setReferenceUnlockState() is called right back with the freshly-derived
// count so Panel Studio's own tab rendering (and, for the 'panels'-type
// reference, its tray content) updates immediately on the same click that
// caused it — no separate re-sync round trip.
PanelStudio.onReferenceEvent(function(action, refKey, stageKey){
  if(!PKG || !stageKey || !refKey) return;
  logLifecycle(action==='shown' ? 'reference_shown' : 'reference_hidden', stageKey, refKey);
  if(action==='shown') PanelStudio.setReferenceUnlockState(unlockedReferenceCount(stageKey));
});

function openInPanelStudio(stageKey){
  const st = PKG.stages[stageKey];
  if(!st || !st.assigned){ alert('This stage has not been assigned by your researcher yet.'); return; }
  // Guarded against a double-click race before render() swaps the Brief/
  // Reflect screen out — every real call here is a genuine transition,
  // since those screens never render while currentScreen is already
  // 'activity'. Not deduplicated like stage_entered: reopening a
  // completed stage's Activity screen later is a real, distinct visit.
  if(PKG.progress.currentScreen !== 'activity') logLifecycle('activity_entered', stageKey);
  PKG.progress.currentScreen = 'activity';
  render();
}
function loadTaskIntoPanelStudio(stageKey){
  const st = PKG.stages[stageKey];
  if(!st || !st.assigned) return;
  PanelStudio.mount(document.getElementById('ps-native-root'));
  // Applied on every visit, not just the first load — cheap/idempotent, and
  // must stay in sync even when the early-return below skips reloading the
  // task file (e.g. re-rendering while already viewing this same stage).
  const done = studioIsComplete(stageKey);
  PanelStudio.setReadOnly(done, done ? {completedLabel:'Completed in '+fmtStudioDuration(stageKey)} : undefined);
  // Same "must stay in sync on every visit" reasoning as setReadOnly above —
  // resuming a saved-and-reopened package (or just switching screens and
  // back) must always reflect whatever was actually revealed, derived fresh
  // from lifecycleLog rather than trusted from any in-memory state.
  PanelStudio.setReferenceUnlockState(unlockedReferenceCount(stageKey));
  if(psLoadedForStage === stageKey) return; // already loaded — just switched screens, no reload needed
  const g = st.garment || {};
  const task = {
    flatform_task: true, stage: stageKey,
    garment: { name:g.name, type:g.type, image:g.fullImg||'', frontBackImage:g.frontBackImg||'', flatSketchImage:g.flatSketchImg||'', groupPanelImage:g.arrangementScaffold||'', scaffold4Image:g.fullArrangementPng||'' },
    complexity: {s:'Simple',m:'Moderate',c:'Complex'}[st.cx]||st.cx,
    styleLine: st.styleLine || null,
    panels: (st.tray||[]).map(item=>({ image:item.img||null, shape:item.shape||null, label:item.label })),
    // Progressive Reference system: the alternate individual-panel tray
    // (only meaningful for s1/s2/s3 — Console leaves it undefined for
    // pretest/posttest, which never swap trays) and the ordered reference
    // config Panel Studio needs to render locked/unlocked tabs correctly.
    individualPanelTray: (st.individualPanelTray||[]).map(item=>({ image:item.img||null, shape:item.shape||null, label:item.label })),
    references: STAGE_REFERENCES[stageKey] || null,
    brief: (STAGE_BRIEF[stageKey] && STAGE_BRIEF[stageKey].steps.join(' ')) || '',
    budgetMin: parseInt(STAGE_TIME_BUDGET[stageKey], 10) || null,
    participantCode: (PKG.participant && PKG.participant.code) || '',
    exportId: getExportId(),
    // Stage 2's Full Panel Arrangement PDF is task input, not a post-task
    // solution — re-exposed here so the participant can re-download it from
    // inside the Stage 2 activity screen without leaving it (see
    // renderPlanPanel()'s stage==='s2' branch in panel-studio-module.js).
    // Harmless no-op for every other stage (renderPlanPanel only reads it
    // when t.stage==='s2').
    fullArrangementPdf: g.fullArrangementPdf || null,
    fullArrangementPdfName: g.fullArrangementPdfName || '',
  };
  psLoadedForStage = stageKey;
  PanelStudio.applyTaskFile(task);
  PanelStudio.setReferenceUnlockState(unlockedReferenceCount(stageKey));
  const draft = st.activityDraft;
  if(draft){ PanelStudio.restoreState(draft); logSync('restore_applied', stageKey); }
}

function logSync(type, stageKey){
  if(!PKG) return;
  if(!PKG.syncLog) PKG.syncLog=[];
  PKG.syncLog.push({t:new Date().toISOString(), stage:stageKey||null, screen:'activity', type});
}
function snapshotActivity(stageKey){
  if(psLoadedForStage !== stageKey) return Promise.resolve(false);
  PKG.stages[stageKey].activityDraft = PanelStudio.buildStateSnapshot();
  logSync('snapshot_applied', stageKey);
  return Promise.resolve(true);
}
async function saveFromActivity(){
  if(VIEW_STAGE) await snapshotActivity(VIEW_STAGE);
  await saveProgress();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && PKG && PKG.progress.currentScreen==='activity' && VIEW_STAGE){
    snapshotActivity(VIEW_STAGE); // best-effort — page may be backgrounded/closed before this resolves
  }
});
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function readFileAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('File could not be read')); r.readAsDataURL(file); }); }
// Builds the returned-package filename from the participant's own name —
// "<Name>_<YYYYMMDD>_<HHMM>_FlatFormSolution.json" — computed once (at
// import for an Assigned package, at registration for a Shared one, since
// the name isn't known until then) and reused by every later saveProgress()
// call, so the participant always has exactly one evolving file, clearly
// distinguishable from the blank package the researcher originally sent.
function toReturnedFileName(participantName){
  const now = new Date();
  const date = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const time = `${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const safeName = (participantName||'').trim().replace(/\s+/g,'').replace(/[^a-zA-Z0-9_-]/g,'') || 'Participant';
  return `${safeName}_${date}_${time}_FlatFormSolution.json`;
}
// The short export id baked into Console's export filename (see
// buildPackageFileName() in flat-form-console_11_1_11.html) — read back out
// of currentPkgFileName so Panel Studio's PDF/PNG exports and this package's
// own filename all carry the same id without adding a new PKG field. Cached
// per session; falls back to a freshly-generated id if the file was renamed
// beyond recognition (e.g. a pre-convention legacy package).
let _sessionExportId = null;
function getExportId(){
  if(_sessionExportId) return _sessionExportId;
  const m = currentPkgFileName && currentPkgFileName.match(/ - ([A-Z0-9]{4,8})(?: - Solution)?\.json$/i);
  _sessionExportId = m ? m[1].toUpperCase() : ('EXP'+Date.now().toString(36).slice(-4).toUpperCase());
  return _sessionExportId;
}
// Per-stage counterpart of computeTotalStudioTime() (which sums across all
// stages) — same activity_entered/activity_exited pairing, scoped to one
// stage. Deliberately a separate function rather than a refactor of the
// already-verified total, per this project's standing preference for small
// duplication over touching frozen, working code.
function computeStageActivityDuration(stageKey){
  const log = (PKG && PKG.lifecycleLog) || [];
  const events = log.filter(e=>e && e.stage===stageKey && (e.type==='activity_entered'||e.type==='activity_exited') && e.t)
    .slice().sort((a,b)=>new Date(a.t)-new Date(b.t));
  let totalMs=0, enteredAt=null;
  events.forEach(e=>{
    if(e.type==='activity_entered'){ enteredAt=e.t; }
    else if(enteredAt){ const ms=new Date(e.t)-new Date(enteredAt); if(Number.isFinite(ms)&&ms>=0) totalMs+=ms; enteredAt=null; }
  });
  return totalMs;
}
function fmtStudioDuration(stageKey){
  const totalSec = Math.round(computeStageActivityDuration(stageKey)/1000);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return m>0 ? `${m} min ${s} sec` : `${s} sec`;
}

// ════════════════════════════════════════
//  IMPORT / OPEN a package (or a checkpoint — same format)
// ════════════════════════════════════════
function emptyResponse(){
  return {survey:null,promptNotes:'',interviewNotes:'',uploads:[],submittedAt:null};
}
function migratePackage(pkg){
  if(!pkg.progress) pkg.progress = {currentStage:'pretest', completedStages:[]};
  if(!pkg.schemaVersion) pkg.schemaVersion = 1;
  if(pkg.schemaVersion < 2){
    if(!pkg.sessions) pkg.sessions = [];
    if(!pkg.eventLog) pkg.eventLog = [];
    if(!pkg.syncLog) pkg.syncLog = [];
    if(!pkg.consent) pkg.consent = {recording:'no', interactionLogging:false};
    if(!pkg.progress.currentScreen) pkg.progress.currentScreen = 'brief';
    Object.keys(pkg.stages||{}).forEach(function(k){
      const st = pkg.stages[k];
      if(!st.activityDraft) st.activityDraft = null;
      if(st.response && st.response.submittedAt === undefined) st.response.submittedAt = null;
    });
    pkg.schemaVersion = 2;
  }
  if(pkg.schemaVersion < 3){
    if(!pkg.lifecycleLog) pkg.lifecycleLog = [];
    pkg.schemaVersion = 3;
  }
  if(pkg.schemaVersion < 4){
    if(!pkg.progress.hasOwnProperty('packageConfirmed')){
      pkg.progress.packageConfirmed = (pkg.sessions||[]).length > 0;
    }
    pkg.schemaVersion = 4;
  }
  if(pkg.schemaVersion < 5){
    // Pre-study survey (Survey Revision, item 1) — additive only, same
    // shape as the existing finalReflection field. Left null rather than
    // pre-built with empty answers so surveyAnswersFor('prestudy') builds
    // it fresh (with however many questions PRESTUDY_DEF currently has)
    // the first time it's actually touched.
    if(!pkg.hasOwnProperty('preStudy')) pkg.preStudy = null;
    pkg.schemaVersion = 5;
  }
  if(pkg.schemaVersion < 6){
    // Training Task (interface familiarisation only) — additive-only, same
    // lazy-null-until-touched shape as preStudy/finalReflection above.
    // Deliberately NOT part of pkg.stages: it must never be mistaken for a
    // research stage by anything that iterates STAGE_ORDER/pkg.stages.
    if(!pkg.hasOwnProperty('training')) pkg.training = null;
    pkg.schemaVersion = 6;
  }
  return pkg;
}
// ── The canonical participant workflow timeline — significant lifecycle
// transitions (stage_entered, activity_entered/activity_exited,
// progress_saved), not a place to store derived timing numbers. Metrics
// (durations, etc.) are computed FROM this timeline by readers, never
// stored here. Mirrors logSync()'s shape exactly ({t, stage, type}) but is
// a separate array — syncLog stays specifically about sync-protocol
// health, this is specifically about participant workflow lifecycle.
// progress_saved is logged with stage:null since a save persists the whole
// package, not one stage — see saveProgress() for its two emission points. ──
// refKey is optional and only ever set by the Progressive Reference system
// below (reference_shown/reference_hidden) — every other existing call site
// passes just (type, stageKey) unchanged, so this stays fully backward
// compatible; an entry with no ref is simply omitted, not stored as null,
// so old-shaped lifecycleLog entries and these new ones are structurally
// identical except for the one genuinely new field.
function logLifecycle(type, stageKey, refKey){
  if(!PKG) return;
  if(!PKG.lifecycleLog) PKG.lifecycleLog = [];
  const entry = {t:new Date().toISOString(), stage:stageKey||null, type};
  if(refKey) entry.ref = refKey;
  PKG.lifecycleLog.push(entry);
}
// Package-driven navigation: which stage should the participant work on next,
// based purely on what the researcher assigned and what's already completed —
// never on a fixed position in STAGE_ORDER. Callers never need to know how
// this is determined, only that it reflects the package's own contents.
function getNextAssignedStage(pkg, extraCompleted){
  const done = (pkg.progress.completedStages||[]).concat(extraCompleted||[]);
  return STAGE_ORDER.find(sk => pkg.stages[sk] && pkg.stages[sk].assigned && !done.includes(sk));
}
function hasAnyAssignedStage(pkg){
  return STAGE_ORDER.some(sk => pkg.stages[sk] && pkg.stages[sk].assigned);
}
function openPackageFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(PKG && !confirm('Opening a new file will replace everything currently loaded that hasn\'t been saved. Continue?')){
    input.value='';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('This does not look like a valid task package file.'); input.value=''; return; }
    if(!data || !data.flatform_participant_package || !data.stages){
      alert('This does not look like a Flat⇄Form task package (exported from the Workshop Console\'s Package & Send page).');
      input.value=''; return;
    }
    PKG = migratePackage(data);
    // Captured before startSession() runs below — sessions.length===0 is a
    // structural fact (nothing in this app ever clears an existing sessions
    // array; see logLifecycle's header comment), not an inference from which
    // resolution branch fires. Used only to log a genuine first-ever
    // stage_entered further down — never to skip/alter the resolution logic
    // itself, which is unchanged from before.
    const isFirstEverSession = !PKG.sessions || PKG.sessions.length === 0;
    const cur = PKG.progress.currentStage, curStage = PKG.stages[cur];
    const curStillValid = curStage && curStage.assigned && !(PKG.progress.completedStages||[]).includes(cur);
    if(!curStillValid){
      const next = getNextAssignedStage(PKG);
      if(next){ PKG.progress.currentStage = next; PKG.progress.currentScreen = 'brief'; }
      // if next is undefined: either nothing is assigned yet, or everything
      // assigned is already complete — leave currentStage untouched either
      // way; render() handles the "nothing assigned" case, and the
      // "everything complete" case is already just that stage's own
      // recorded Reflect screen.
    }
    if(isFirstEverSession && PKG.stages[PKG.progress.currentStage] && PKG.stages[PKG.progress.currentStage].assigned){
      logLifecycle('stage_entered', PKG.progress.currentStage);
    }
    VIEW_STAGE = PKG.progress.currentStage;
    // A Shared Workshop Package (see flat-form-console_11_1_11.html's
    // buildSharedWorkshopPackage()) has no participant identity yet — the
    // filename can't be finalised until renderParticipantRegistration()'s
    // submitParticipantRegistration() sets PKG.participant and calls
    // toReturnedFileName() itself. An Assigned package already has a name.
    currentPkgFileName = PKG.participant ? toReturnedFileName(PKG.participant.name) : null;
    currentPkgFileHandle = null;
    startSession();
    render();
    toast(PKG.participant
      ? ('Welcome, '+PKG.participant.name+' — Save will update "'+currentPkgFileName+'"')
      : 'Package imported — please tell us who you are to continue');
    input.value='';
  };
  reader.onerror = function(){ alert('Could not read that file.'); input.value=''; };
  reader.readAsText(f);
}

// Returns true/false once a genuine save attempt has resolved (existing
// callers that don't check the return value are unaffected) — added so
// exportFinalPackage() can tell a real completed write apart from a
// cancelled dialog or a read failure before it locks the application.
async function saveProgress(){
  if(!PKG) return false;
  let json;
  try{ json = JSON.stringify(PKG, null, 2); }
  catch(e){ alert('Could not save: '+e.message); return false; }

  if(window.showSaveFilePicker){
    try{
      if(!currentPkgFileHandle){
        currentPkgFileHandle = await window.showSaveFilePicker({
          suggestedName: currentPkgFileName || ('participant-'+(PKG.participant?PKG.participant.code:'progress')+'.json'),
          types: [{ description:'Flat⇄Form task package', accept:{'application/json':['.json']} }]
        });
      }
      const w = await currentPkgFileHandle.createWritable();
      await w.write(json); await w.close();
      currentPkgFileName = currentPkgFileHandle.name;
      // File System Access API: write()+close() resolving means the browser
      // has confirmed the write completed — the strongest signal this path offers.
      logLifecycle('progress_saved', null);
      toast('Saved to "'+currentPkgFileName+'" — share this file with your researcher');
      return true;
    }catch(err){
      if(err && err.name==='AbortError') return false;
      console.error(err);
    }
  }
  const name = currentPkgFileName || ('participant-'+(PKG.participant?PKG.participant.code:'progress')+'.json');
  currentPkgFileName = name;
  const blob = new Blob([json], {type:'application/json'});
  try{
    // Must stay awaited: callers (e.g. savePause()) tell the participant it's
    // safe to close the tab right after `await saveProgress()` returns — that
    // can't be true until the download has actually been triggered below.
    const dataUrl = await new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result);
      reader.onerror = ()=>rej(reader.error||new Error('File could not be read'));
      reader.readAsDataURL(blob);
    });
    const a=document.createElement('a'); a.href=dataUrl; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    // Download fallback: a.click() firing is the strongest completion signal
    // browsers expose here — there's no event for "the file finished writing
    // to disk," only for "the download was successfully initiated."
    logLifecycle('progress_saved', null);
    toast('Saved as "'+name+'" — share this file with your researcher');
    return true;
  }catch(err){
    alert('Could not save (file read failed).');
    return false;
  }
}
async function savePause(){
  endCurrentSession('pause');
  await saveProgress();
  toast('Saved — you can safely close this tab and continue later');
}

// ════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════
function render(){
  const root = document.getElementById('root');
  const psContainer = document.getElementById('ps-container');
  // Hard top-level gate — checked before even the Activity-screen branch
  // below, so a finalized package can never be reopened for editing under
  // any prior state (including a stale currentScreen==='activity').
  if(PKG && PKG.progress.workshopFinalized){
    psContainer.style.display='none';
    root.innerHTML = renderWorkshopFinalized();
    return;
  }
  // Training Task (interface familiarisation only) — fully separate from
  // the research-stage system. TRAINING_VIEW is transient/in-memory (see
  // its declaration), so this never touches VIEW_STAGE, PKG.progress.
  // currentStage/currentScreen, or completedStages. Reuses the same Panel
  // Studio mount point (#ps-native-root) the real stages use.
  if(PKG && TRAINING_VIEW==='studio'){
    psContainer.style.display='flex';
    loadTrainingIntoPanelStudio();
    return;
  }
  if(PKG && TRAINING_VIEW==='brief'){
    psContainer.style.display='none';
    root.innerHTML = renderTrainingBrief();
    return;
  }
  if(PKG && (!VIEW_STAGE || !PKG.stages[VIEW_STAGE])) VIEW_STAGE = PKG.progress.currentStage;
  const showingActivity = PKG && VIEW_STAGE && VIEW_STAGE===PKG.progress.currentStage && PKG.progress.currentScreen==='activity';
  if(showingActivity){
    psContainer.style.display='flex';
    loadTaskIntoPanelStudio(VIEW_STAGE);
    return; // #root stays as-is underneath — no need to touch it while hidden
  }
  psContainer.style.display='none';
  if(!PKG){ root.innerHTML = renderImportScreen(); return; }
  // A Shared Workshop Package carries no participant identity — collect it
  // before anything else (even the package-verify step, which needs a name
  // to show). Once submitParticipantRegistration() sets PKG.participant,
  // this never matches again for this session.
  if(PKG.packageMode==='shared' && !PKG.participant){ root.innerHTML = renderParticipantRegistration(); return; }
  if(!PKG.progress.packageConfirmed){ root.innerHTML = renderVerifyPackage(); return; }
  // Shown once before the first activity — deliberately transient (never
  // written to PKG, per "do not change any package schema"), so it resets
  // on a fresh page load rather than being a persistent "seen it" flag.
  if(!WELCOME_SEEN){ root.innerHTML = renderWelcomeScreen(); return; }
  if(!hasAnyAssignedStage(PKG)){ root.innerHTML = renderDashboard() + renderNoActivitiesAssigned(); return; }
  // Pre-study survey — shown once, right after Welcome, before the first
  // activity. Gated on PKG.share.survey (same flag every other survey
  // uses) and on not having started any stage yet, so a package already
  // mid-workshop before this feature existed is never retroactively
  // interrupted with it (backward compatibility).
  const prestudyStarted = (PKG.lifecycleLog||[]).some(e=>e && e.type==='stage_entered');
  if(PKG.share.survey && !isSurveySubmittedFor('prestudy') && !prestudyStarted){ root.innerHTML = renderPrestudyScreen(); return; }
  if(STAGE_JUST_COMPLETED){ root.innerHTML = renderStageCompleteScreen(STAGE_JUST_COMPLETED.stageKey, STAGE_JUST_COMPLETED.next); return; }
  if(SURVEY_JUST_COMPLETED){ root.innerHTML = renderSurveyCompleteScreen(SURVEY_JUST_COMPLETED.stageKey); return; }
  const reviewingPast = VIEW_STAGE !== PKG.progress.currentStage;
  // Brief now holds the full recap (uploads, survey status, complete action),
  // so reviewing a different stage lands on its Brief, not its Survey.
  const screen = reviewingPast ? 'brief' : PKG.progress.currentScreen;
  // Final Reflection is workshop-level (not tied to VIEW_STAGE) — its own
  // full-bleed screen, same treatment as the survey/landing/completion ones.

// ── Generalized survey engine (Survey Revision) ──────────────────────────
// Supports the five real stage keys (pretest/s1/s2/s3/posttest) plus two
// workshop-level, non-stage keys: 'prestudy' and 'final'. All three kinds
// of survey share this exact same question-rendering/answer-storage code —
// only WHERE the answers live differs, resolved once here rather than
// duplicated per kind. Stage-key behaviour is unchanged from before this
// generalization: same object (PKG.stages[key].response), same field
// shapes, same completeStage() hookup.
function surveyDefFor(key){
  if(key==='prestudy') return PRESTUDY_DEF;
  if(key==='final') return FINAL_REFLECTION_DEF;
  return SURVEYDEF[key];
}
function surveyAnswersFor(key){
  const def = surveyDefFor(key);
  if(key==='prestudy'){
    if(!PKG.preStudy) PKG.preStudy = { response:{ survey:null }, submittedAt:null };
    if(!PKG.preStudy.response) PKG.preStudy.response = { survey:null };
    if(!PKG.preStudy.response.survey) PKG.preStudy.response.survey = def.qs.map(()=>null);
    return PKG.preStudy.response.survey;
  }
  if(key==='final'){
    if(!PKG.finalReflection) PKG.finalReflection = { response:{ survey:null }, submittedAt:null };
    if(!PKG.finalReflection.response) PKG.finalReflection.response = { survey:null };
    if(!PKG.finalReflection.response.survey) PKG.finalReflection.response.survey = def.qs.map(()=>null);
    return PKG.finalReflection.response.survey;
  }
  const st = PKG.stages[key];
  if(!st.response) st.response = emptyResponse();
  if(!st.response.survey) st.response.survey = def.qs.map(()=>null);
  return st.response.survey;
}
function isSurveySubmittedFor(key){
  if(key==='prestudy') return !!(PKG.preStudy && PKG.preStudy.submittedAt);
  if(key==='final') return !!(PKG.finalReflection && PKG.finalReflection.submittedAt);
  const st = PKG.stages[key];
  return !!(st.response && st.response.submittedAt);
}
// One-question-at-a-time survey UI position — transient/per-session only
// (like VIEW_STAGE, psLoadedForStage, etc.), never persisted to PKG. The
// underlying answer engine (surveyAnswersFor, setSurveyAnswer,
// toggleSurveyMulti) is completely unchanged by this.
let SURVEY_UI = {};
function surveyIsAnswered(val){
  if(val==null) return false;
  if(Array.isArray(val)) return val.length>0;
  if(typeof val==='string') return val.trim().length>0;
  return true;
}
function surveyInitUI(key, def, ans){
  if(SURVEY_UI[key]) return SURVEY_UI[key];
  const firstUnanswered = def.qs.findIndex((q,i)=>!surveyIsAnswered(ans[i]));
  const allAnswered = firstUnanswered===-1;
  SURVEY_UI[key] = { idx: allAnswered?0:firstUnanswered, done: allAnswered };
  return SURVEY_UI[key];
}
// Lets the currently-visible question card play its exit animation before
// the DOM underneath it is replaced — render() always does a full innerHTML
// swap, so this is the only way to get a real outgoing transition rather
// than a hard cut.
function surveyTransition(cb){
  const active = document.querySelector('.sv-shell .sv-card');
  if(active){ active.classList.add('leaving'); setTimeout(cb, 180); }
  else cb();
}
function surveyGo(key, delta){
  const ui = SURVEY_UI[key]; if(!ui) return;
  const max = surveyDefFor(key).qs.length-1;
  const next = Math.max(0, Math.min(max, ui.idx+delta));
  if(next===ui.idx) return;
  surveyTransition(()=>{ ui.idx = next; render(); });
}
function surveyFinish(key){
  const ui = SURVEY_UI[key]; if(!ui) return;
  surveyTransition(()=>{
    ui.done = true;
    if(key==='prestudy'){
      PKG.preStudy.submittedAt = new Date().toISOString();
      PKG.progress.currentScreen = 'brief';
      render();
      return;
    }
    if(key==='final'){
      PKG.finalReflection.submittedAt = new Date().toISOString();
      PKG.progress.currentScreen = 'brief';
      render();
      return;
    }
    // Finishing the last survey question is the last thing this stage
    // needs — it completes itself right here, no separate "Mark stage
    // complete" click. completeStage() sets response.submittedAt (if not
    // already set), adds this stage to completedStages, advances
    // progress.currentStage to the next assigned stage (unlocking its row
    // in the left rail) while leaving VIEW_STAGE on THIS stage, so the
    // participant lands back on this stage's own Brief showing both
    // checkmarks — not an interstitial, and not the next stage's Brief.
    completeStage(key);
  });
}
function surveyReview(key){
  const ui = SURVEY_UI[key]; if(!ui) return;
  surveyTransition(()=>{ ui.idx = 0; ui.done = false; render(); });
}
function surveyFormHTML(key){
  const def = surveyDefFor(key);
  if(!def) return '';
  const ans = surveyAnswersFor(key);
  const ui = surveyInitUI(key, def, ans);
  if(ui.done){
    const answeredCount = def.qs.filter((q,i)=>surveyIsAnswered(ans[i])).length;
    return `<div class="card sv-card sv-complete">
      <div class="sv-stage-label">${esc(def.title)}</div>
      <div class="ico">✓</div>
      <div class="sv-complete-title">Survey complete</div>
      <p class="faint" style="font-size:14px;margin-top:8px">${answeredCount} of ${def.qs.length} questions answered.</p>
      <button class="btn ghost" style="margin-top:22px" onclick="surveyReview('${key}')">Review your answers</button>
    </div>`;
  }
  const i = ui.idx, q = def.qs[i], isLast = i===def.qs.length-1;
  let qHTML;
  if(q.t==='likert'){
    // q.labels (added for the Final Refinement question bank) gives each of
    // the 5 points its own caption, shown under its circle — otherwise fall
    // back to the older two-endpoint-only display for any def that doesn't
    // set it.
    const opts=[1,2,3,4,5].map(v=>{
      const lbl = q.labels ? q.labels[v-1] : '';
      return `<label><input type="radio" name="sv_${key}_${i}" value="${v}" ${ans[i]==v?'checked':''} onchange="setSurveyAnswer('${key}',${i},${v})"><span class="sv-likert-circle">${v}</span>${lbl?`<span class="sv-likert-label">${esc(lbl)}</span>`:''}</label>`;
    }).join('');
    qHTML = q.labels
      ? `<div class="likert likert-labeled"><div class="opts">${opts}</div></div>`
      : `<div class="likert"><span class="end">${q.ends[0]}</span><div class="opts">${opts}</div><span class="end">${q.ends[1]}</span></div>`;
  } else if(q.t==='single'){
    // An option literally named "Other" / "Other (please specify)" reveals
    // an inline free-text field (shown via CSS once its radio is checked —
    // see .opt-other in the stylesheet) — the typed text is folded into the
    // stored answer as "Other: <text>" so it stays a plain string, same as
    // every other single-choice answer.
    const opts=q.opts.map(o=>{
      const isOther = /^other\b/i.test(o);
      if(!isOther) return `<label><input type="radio" name="sv_${key}_${i}" ${ans[i]===o?'checked':''} onchange="setSurveyAnswer('${key}',${i},'${o.replace(/'/g,"\\'")}')">${esc(o)}</label>`;
      const curVal = ans[i];
      const checked = typeof curVal==='string' && /^other\b/i.test(curVal);
      const otherText = checked ? curVal.replace(/^other:\s*/i,'') : '';
      return `<label class="opt-other"><input type="radio" name="sv_${key}_${i}" ${checked?'checked':''} onchange="setSurveyOtherSingle('${key}',${i})">${esc(o)}<input type="text" class="other-input" placeholder="Please specify…" value="${esc(otherText)}" oninput="setSurveyOtherText('${key}',${i},this.value)" onclick="event.stopPropagation()"></label>`;
    }).join('');
    qHTML = `<div class="optlist">${opts}</div>`;
  } else if(q.t==='multi'){
    const cur = Array.isArray(ans[i])?ans[i]:[];
    const opts=q.opts.map(o=>{
      const isOther = /^other\b/i.test(o);
      if(!isOther) return `<label><input type="checkbox" ${cur.includes(o)?'checked':''} onchange="toggleSurveyMulti('${key}',${i},'${o.replace(/'/g,"\\'")}')">${esc(o)}</label>`;
      const otherEntry = cur.find(v=>typeof v==='string' && /^other\b/i.test(v));
      const otherText = otherEntry ? otherEntry.replace(/^other:\s*/i,'') : '';
      return `<label class="opt-other"><input type="checkbox" ${otherEntry?'checked':''} onchange="toggleSurveyMultiOther('${key}',${i})">${esc(o)}<input type="text" class="other-input" placeholder="Please specify…" value="${esc(otherText)}" oninput="setSurveyMultiOtherText('${key}',${i},this.value)" onclick="event.stopPropagation()"></label>`;
    }).join('');
    qHTML = `<div class="optlist">${opts}</div>`;
  } else if(q.t==='rank'){
    qHTML = rankQuestionHTML(key, i, q, ans[i]);
  } else {
    qHTML = `<textarea oninput="setSurveyAnswer('${key}',${i},this.value)">${esc(ans[i]||'')}</textarea>`;
  }
  return `<div class="card sv-card">
    <div class="sv-qbody">
      <div class="sv-eyebrow-row">
        <span class="sv-stage-label">${esc(def.title)}</span>
        <span class="sv-qcount">Question ${i+1} of ${def.qs.length}</span>
      </div>
      <div class="qtitle">${esc(q.q)}</div>
      ${qHTML}
    </div>
    <div class="sv-nav">
      <button class="btn ghost" ${i===0?'disabled':''} onclick="surveyGo('${key}',-1)">← Back</button>
      ${isLast?`<button class="btn blue" onclick="surveyFinish('${key}')">Finish</button>`:`<button class="btn blue" onclick="surveyGo('${key}',1)">Next →</button>`}
    </div>
  </div>`;
}
function setSurveyAnswer(key,i,val){ surveyAnswersFor(key)[i]=val; }
function toggleSurveyMulti(key,i,opt){
  const arr = surveyAnswersFor(key);
  if(!Array.isArray(arr[i])) arr[i]=[];
  const at=arr[i].indexOf(opt);
  if(at>-1) arr[i].splice(at,1); else arr[i].push(opt);
}
// ── "Other (please specify)" handling — single/multi questions whose last
// option matches /^other\b/i. Selecting it (before any text is typed)
// stores the bare string 'Other'; typing folds the text in as 'Other: …' so
// the stored answer stays a plain string (single) / a plain array entry
// (multi) exactly like every other option, no new data shape involved. ──
function setSurveyOtherSingle(key,i){ surveyAnswersFor(key)[i]='Other'; }
function setSurveyOtherText(key,i,text){
  surveyAnswersFor(key)[i] = text.trim() ? ('Other: '+text) : 'Other';
}
function toggleSurveyMultiOther(key,i){
  const arr = surveyAnswersFor(key);
  if(!Array.isArray(arr[i])) arr[i]=[];
  const idx=arr[i].findIndex(v=>typeof v==='string' && /^other\b/i.test(v));
  if(idx>-1) arr[i].splice(idx,1); else arr[i].push('Other');
}
function setSurveyMultiOtherText(key,i,text){
  const arr = surveyAnswersFor(key);
  if(!Array.isArray(arr[i])) arr[i]=[];
  const idx=arr[i].findIndex(v=>typeof v==='string' && /^other\b/i.test(v));
  const val = text.trim() ? ('Other: '+text) : 'Other';
  if(idx>-1) arr[i][idx]=val; else arr[i].push(val);
}
// "Rank" questions store the same shape as "multi" (an array of selected
// option labels on the same answers array) — the only difference is that
// here array ORDER is meaningful (most important/most used first) and
// participant-controlled via drag, rather than incidental insertion order.
// An option matching /^other\b/i gets the same inline free-text treatment
// single/multi already have (toggleRankOtherAnswer/setRankOtherText),
// folding typed text into 'Other: …' the same way.
function rankQuestionHTML(key, i, q, val){
  const cur = Array.isArray(val) ? val : [];
  const chips = q.opts.map(o=>{
    const isOther = /^other\b/i.test(o);
    if(!isOther) return `<label class="rank-chip${cur.includes(o)?' on':''}"><input type="checkbox" ${cur.includes(o)?'checked':''} onchange="toggleRankAnswer('${key}',${i},'${o.replace(/'/g,"\\'")}')">${esc(o)}</label>`;
    const otherEntry = cur.find(v=>typeof v==='string' && /^other\b/i.test(v));
    const otherText = otherEntry ? otherEntry.replace(/^other:\s*/i,'') : '';
    return `<label class="rank-chip opt-other${otherEntry?' on':''}"><input type="checkbox" ${otherEntry?'checked':''} onchange="toggleRankOtherAnswer('${key}',${i})">${esc(o)}<input type="text" class="other-input" placeholder="Please specify…" value="${esc(otherText)}" oninput="setRankOtherText('${key}',${i},this.value)" onclick="event.stopPropagation()"></label>`;
  }).join('');
  const bucket = cur.length ? `<div class="rank-bucket">${cur.map((o,ri)=>`
    <div class="rank-item" draggable="true" data-idx="${ri}" ondragstart="rankDragStart(event,${ri})" ondragover="rankDragOver(event)" ondrop="rankDrop(event,'${key}',${i},${ri})" ondragend="rankDragEnd(event)">
      <span class="rank-handle">⠿</span><span class="rank-num">${ri+1}</span><span class="rank-label">${esc(o)}</span>
    </div>`).join('')}</div>`
    : `<p class="faint rank-empty">Selected items will appear here — drag to put them in order.</p>`;
  return `<div class="rank-q" data-stage="${key}" data-qidx="${i}">
    <div class="rank-chips">${chips}</div>
    ${cur.length?'<div class="rank-bucket-label">Drag to reorder</div>':''}
    ${bucket}
  </div>`;
}
// Checking/dragging inside this question must never trigger a full
// render() — that replaces the *entire page*, destroying and recreating
// .sv-card, which replays its entrance animation and resets .sv-qbody's
// scroll position. That's exactly what caused the reported "jerk" and
// ranked items intermittently vanishing behind the fold mid-drag. Instead,
// only this question's own <div class="rank-q"> subtree is regenerated —
// everything outside it (the card, the nav footer, the rest of the page)
// is left completely untouched.
function refreshRankQuestion(key, i){
  const el = document.querySelector(`.rank-q[data-stage="${key}"][data-qidx="${i}"]`);
  if(!el){ render(); return; }
  el.outerHTML = rankQuestionHTML(key, i, surveyDefFor(key).qs[i], surveyAnswersFor(key)[i]);
}
function toggleRankAnswer(key, i, opt){
  toggleSurveyMulti(key, i, opt);
  refreshRankQuestion(key, i);
}
function toggleRankOtherAnswer(key, i){
  toggleSurveyMultiOther(key, i);
  refreshRankQuestion(key, i);
}
// No refreshRankQuestion() call on every keystroke here — same reasoning as
// setSurveyOtherText/setSurveyMultiOtherText: re-rendering the subtree while
// the participant is actively typing would steal focus mid-word. The typed
// text is already visible in the input itself; the rank bucket's label
// catches up next time this question's subtree is refreshed (toggling the
// chip, dragging, or navigating away and back).
function setRankOtherText(key, i, text){
  const arr = surveyAnswersFor(key);
  if(!Array.isArray(arr[i])) arr[i]=[];
  const idx=arr[i].findIndex(v=>typeof v==='string' && /^other\b/i.test(v));
  const val = text.trim() ? ('Other: '+text) : 'Other';
  if(idx>-1) arr[i][idx]=val; else arr[i].push(val);
}
let _rankDragIdx = null;
function rankDragStart(ev, idx){ _rankDragIdx = idx; ev.dataTransfer.effectAllowed='move'; }
function rankDragOver(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; }
function rankDrop(ev, key, qIdx, targetIdx){
  ev.preventDefault();
  if(_rankDragIdx===null || _rankDragIdx===targetIdx){ _rankDragIdx=null; return; }
  const arr = surveyAnswersFor(key);
  const [moved] = arr[qIdx].splice(_rankDragIdx, 1);
  arr[qIdx].splice(targetIdx, 0, moved);
  _rankDragIdx = null;
  refreshRankQuestion(key, qIdx);
}
function rankDragEnd(){ _rankDragIdx = null; }

async function handleUploads(stageKey,input){
  const files=[...input.files]; if(!files.length) return;
  const st=PKG.stages[stageKey];
  if(!st.response) st.response=emptyResponse();
  st.response.uploads=st.response.uploads||[];
  for(const f of files){
    if(f.size>25*1024*1024) toast('"'+f.name+'" is quite large — this may take a moment.');
    try{
      const dataUrl=await readFileAsDataURL(f);
      st.response.uploads.push({name:f.name,type:f.type,size:f.size,dataUrl,at:new Date().toISOString()});
    }catch(err){ alert('Could not read "'+f.name+'": '+(err&&err.message||err)); }
  }
  input.value='';
  render();
  toast(files.length+' file(s) added');
}

// Derived-only display metric (clarification #2) — computed fresh from PKG.lifecycleLog
// entered/exited pairs each render; never written back to PKG.
function computeTotalStudioTime(){
  const log = (PKG && PKG.lifecycleLog) || [];
  let totalMs = 0;
  STAGE_ORDER.forEach(sk=>{
    const events = log.filter(e=>e && e.stage===sk && (e.type==='activity_entered'||e.type==='activity_exited') && e.t)
      .slice().sort((a,b)=>new Date(a.t)-new Date(b.t));
    let enteredAt=null;
    events.forEach(e=>{
      if(e.type==='activity_entered'){ enteredAt=e.t; }
      else if(enteredAt){ const ms=new Date(e.t)-new Date(enteredAt); if(Number.isFinite(ms)&&ms>=0) totalMs+=ms; enteredAt=null; }
    });
  });
  return totalMs;
}
function fmtDuration(ms){
  const mins = Math.round(ms/60000);
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

// ── Brief's finite-state workflow: exactly one enabled step at a time. ──
// Durable (survives reload) — checks response.submittedAt, which
// surveyFinish() sets at the exact moment the participant clicks Finish.
// Deliberately NOT "every question has an answer": answering has never been
// required to advance in this survey engine (surveyGo()'s Back/Next has no
// answered-check either, predating this redesign) — requiring full
// per-question completeness here would let the Survey screen declare
// "complete" while stagePhase() disagreed, which was the actual bug.
function surveyIsComplete(stageKey){
  const def = SURVEYDEF[stageKey];
  if(!def || !PKG.share.survey) return true; // no survey applies to this stage — treat as satisfied
  const st = PKG.stages[stageKey];

function studioIsComplete(stageKey){
