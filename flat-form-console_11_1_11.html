<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workshop Console — Flat ↔ Form (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --paper:#F1EFE7; --paper-2:#E9E6DB; --card:#FBFAF5;
    --ink:#1A1B24; --ink-soft:#54545f; --ink-faint:#8a8a93;
    --mat:#13322D; --mat-2:#0e2723; --mat-line:#245049; --chalk:#EDEAE0;
    --digital:#2E54F0; --digital-ink:#1c39b8;
    --physical:#BC5A28; --physical-ink:#9a4719;
    --think:#6B3FD4; --survey:#B4820F; --interview:#1E7E6E; --hi:#E8A11C;
    --done:#2f8f5b; --line:#C9C5B8; --r:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--hi);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--digital);outline-offset:2px;border-radius:4px}
  .mono{font-family:"JetBrains Mono",monospace}
  h1,h2,h3,h4,.disp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}

  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px) saturate(1.2);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:1240px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
  .brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
  .brand .sw{width:14px;height:14px;border:1.6px solid var(--ink);position:relative}
  .brand .sw::after{content:"";position:absolute;inset:2px 2px auto auto;width:5px;height:5px;background:var(--hi)}
  .brand small{font-family:"JetBrains Mono";font-weight:400;font-size:10px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;border-radius:5px}
  .pswitch{margin-left:auto;display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .pswitch button{border:0;background:transparent;font-family:"JetBrains Mono";font-size:12px;font-weight:600;letter-spacing:.04em;padding:7px 16px;border-radius:999px;color:var(--ink-soft)}
  .pswitch button.on{background:var(--ink);color:var(--chalk)}
  .who{font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .who select{font-family:"JetBrains Mono";font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--card);color:var(--ink)}

  .shell{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:212px 1fr;gap:22px}
  .shell.solo{grid-template-columns:1fr;max-width:820px}
  nav.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
  nav.side .nh{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin:6px 8px 8px}
  nav.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;width:100%;padding:10px 12px;border-radius:9px;font-family:"Bricolage Grotesque";font-weight:600;font-size:15px;color:var(--ink-soft)}
  nav.side button .ic{width:18px;height:18px;color:var(--ink-faint)}
  nav.side button.on{background:var(--ink);color:var(--chalk)}
  nav.side button.on .ic{color:var(--hi)}
  nav.side button:not(.on):hover{background:var(--paper-2)}
  nav.side .badge{margin-left:auto;font-family:"JetBrains Mono";font-size:10px;font-weight:700;background:var(--hi);color:var(--ink);border-radius:999px;padding:2px 7px;min-width:18px;text-align:center}

  main.view{min-width:0}
  .page-head{margin-bottom:18px}
  .page-head .k{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
  .page-head h2{font-size:clamp(24px,3.4vw,34px);margin-top:5px}
  .page-head p{color:var(--ink-soft);max-width:66ch;margin:8px 0 0;font-size:15.5px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spacer{flex:1}.muted{color:var(--ink-soft)}.faint{color:var(--ink-faint)}
  .mlabel{font-family:"JetBrains Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--chalk);border-radius:9px;padding:9px 15px;font-family:"JetBrains Mono";font-size:12.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.blue{background:var(--digital);border-color:var(--digital)}
  .btn.sm{padding:6px 11px;font-size:11.5px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .cx{display:inline-flex;align-items:center;gap:7px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .cx i{width:7px;height:7px;border-radius:50%}
  .cx.s i{background:var(--done)} .cx.m i{background:var(--survey)} .cx.c i{background:var(--physical)}
  .tag{font-family:"JetBrains Mono";font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .tag.s{background:#dcefe3;color:#1e5f3e} .tag.m{background:#f3e7c4;color:#7a5c10} .tag.c{background:#f0ddd0;color:#8a3d16}
  .tag.phys{background:#f1ddd0;color:var(--physical-ink)} .tag.dig{background:#dde2fb;color:var(--digital-ink)}
  .tag.ok{background:#dcefe3;color:#1e5f3e} .tag.wait{background:#f6e6c2;color:#7a5c10}

  .strip{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  .seg{position:relative;width:24px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:"JetBrains Mono";font-size:8px;font-weight:700;color:var(--ink-faint)}
  .seg.done{background:var(--done);border-color:var(--done);color:#eafff3}
  .seg.active{border-color:var(--hi);color:var(--physical-ink);box-shadow:0 0 0 0 rgba(232,161,28,.55);animation:pz 1.8s infinite}
  .seg.divider{width:8px;border:0;background:transparent}
  @keyframes pz{70%{box-shadow:0 0 0 6px rgba(232,161,28,0)}100%{box-shadow:0 0 0 0 rgba(232,161,28,0)}}

  .prow{display:grid;grid-template-columns:1.5fr 2.7fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .pname{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
  .pname .dotn{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
  .pname .dotn.notify{background:var(--hi);box-shadow:0 0 0 0 rgba(232,161,28,.5);animation:pz 1.6s infinite}
  .pid{font-family:"JetBrains Mono";font-size:10.5px;color:var(--ink-faint)}

  .stagehead{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
  .stagehead .sn{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;color:var(--ink)}
  .stagehead .nm{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px}
  .stagehead .vb{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
  .stagehead:first-of-type{margin-top:6px}

  .gcard{display:flex;flex-direction:column;gap:10px}
  .gthumb{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;height:104px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
  .gthumb svg{height:74px;width:auto}
  .tnote{font-size:14px;color:var(--ink-soft)}
  .panelchips{display:flex;flex-wrap:wrap;gap:5px}
  .pchip{font-family:"JetBrains Mono";font-size:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
  .pchip svg{height:14px;width:14px}

  .seltile{border:1.5px solid var(--line);border-radius:11px;padding:12px;background:var(--card);cursor:pointer;display:flex;gap:11px;align-items:center}
  .seltile.sel{border-color:var(--ink);background:var(--paper-2)}
  .seltile .mini{width:44px;height:44px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;flex:none}
  .seltile .mini svg{height:32px}
  .modepick{display:flex;gap:8px;flex-wrap:wrap}
  .modepick button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 13px;font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft)}
  .modepick button.on{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .filterchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filterchips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft)}
  .filterchips button.on{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .checks{display:flex;gap:8px;flex-wrap:wrap}
  .chk{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-family:"JetBrains Mono";font-size:11.5px;color:var(--ink-soft);user-select:none;cursor:pointer}
  .chk.on{border-color:var(--ink);color:var(--ink)}
  .chk .bx{width:14px;height:14px;border:1.5px solid var(--ink-faint);border-radius:4px;display:grid;place-items:center}
  .chk.on .bx{background:var(--ink);border-color:var(--ink)}
  .chk.on .bx::after{content:"✓";color:var(--chalk);font-size:10px;line-height:1}

  .matrix{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  table.mx{border-collapse:collapse;width:100%;font-family:"JetBrains Mono";font-size:11px}
  table.mx th,table.mx td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.mx thead th{position:sticky;top:0;background:var(--paper-2);color:var(--ink-soft);font-weight:500;letter-spacing:.04em;font-size:10px}
  table.mx td.name{text-align:left;font-family:"Bricolage Grotesque";font-weight:700;font-size:13px}
  .cell{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
  .cell.done{background:var(--done);border-color:var(--done)}.cell.active{background:var(--hi);border-color:var(--hi)}
  .cm-cell{padding:8px 10px}
  .cm-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;margin:0 2px}
  .cm-dot.cm-done{background:var(--done);border-color:var(--done)}
  .cm-dot.cm-pending{background:var(--card)}
  .cm-dot.cm-na{background:transparent;border-style:dashed;opacity:.5}

  .chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:6px 0 0}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bcol .bars{display:flex;gap:5px;align-items:flex-end;height:100%}
  .bcol .bar{width:16px;border-radius:4px 4px 0 0}
  .bcol .lab{font-family:"JetBrains Mono";font-size:10px;color:var(--ink-soft);text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .legend span{display:flex;align-items:center;gap:7px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft)}
  .legend i{width:13px;height:9px;border-radius:2px}

  textarea.find,input.txt,select.txt{width:100%;font-family:"Newsreader";font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--card);color:var(--ink);resize:vertical}
  select.txt{font-family:"JetBrains Mono";font-size:13px}
  textarea.find{min-height:120px}
  .saved{background:var(--paper-2);border:1px dashed var(--line);border-radius:10px;padding:13px 14px;font-size:15px}
  .artrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
  .artrow:last-child{border:0}
  .artrow .ai{width:30px;height:30px;border-radius:7px;background:var(--paper-2);display:grid;place-items:center;color:var(--ink-soft)}
  .artrow a{font-family:"JetBrains Mono";font-size:12.5px;color:var(--digital-ink);text-decoration:none}.artrow a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--chalk);border-radius:11px;padding:13px 18px;font-family:"JetBrains Mono";font-size:13px;display:flex;align-items:center;gap:11px;z-index:80;transition:.3s;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .d{width:9px;height:9px;border-radius:50%;background:var(--hi)}

  .pview{max-width:740px;margin:0 auto}
  .login{text-align:center;padding:50px 24px}
  .login svg{height:90px;margin-bottom:20px}.login h2{font-size:30px;margin-bottom:6px}
  .login .field{max-width:360px;margin:18px auto 0;text-align:left}
  .ptask-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .ptask-head .tnum{font-family:"Bricolage Grotesque";font-weight:800;font-size:46px;line-height:.85;color:var(--ink)}
  .refer{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .refer .rt{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:120px}
  .refer .rt .k{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .refer .rt .v{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;margin-top:3px}
  .psteps{list-style:none;margin:18px 0 0;padding:0;position:relative}
  .psteps::before{content:"";position:absolute;left:14px;top:5px;bottom:14px;width:2px;background:var(--line)}
  .psteps li{position:relative;padding:0 0 14px 42px;font-size:16px}
  .psteps li .n{position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono";font-weight:700;font-size:12px;color:var(--ink-soft)}
  .scaffold-note{margin-top:14px;background:var(--mat);color:var(--chalk);border-radius:11px;padding:13px 15px;display:flex;gap:11px;align-items:center;font-size:14px}
  .scaffold-note .si{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--hi);flex:none}
  .workspace-mock{margin-top:16px;border:2px dashed var(--line);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-family:"JetBrains Mono";font-size:12.5px;text-align:center;background:repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(0,0,0,.015) 12px,rgba(0,0,0,.015) 24px)}
  .recbar{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono";font-size:11.5px;color:var(--ink-soft);margin-top:14px}
  .recbar .rec{width:9px;height:9px;border-radius:50%;background:#c0392b;animation:pz2 2s infinite}
  @keyframes pz2{0%,100%{opacity:1}50%{opacity:.3}}
  .empty{text-align:center;padding:54px 20px;color:var(--ink-soft)}
  .empty svg{height:60px;margin-bottom:16px;color:var(--ink-faint)}.empty h3{font-size:22px;margin-bottom:6px}

  .doc-head{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 20px;margin-bottom:16px}
  .doc-head .t{font-size:23px}
  .doc-head .meta{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.7}
  .infosheet{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px 22px}
  .infosheet h4{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 6px}
  .infosheet h4:first-child{margin-top:0}
  .infosheet p{margin:0 0 8px;font-size:15px;color:#2c2d38}
  .infosheet ul{margin:0 0 8px;padding-left:18px;font-size:14.5px;color:#2c2d38}.infosheet li{margin-bottom:4px}
  .form-field{margin-top:14px}
  .form-field label.q{display:block;font-size:15px;margin-bottom:7px}
  .form-field label.q .req{color:var(--physical);font-family:"JetBrains Mono";font-size:11px}
  .yn{display:flex;gap:10px;flex-wrap:wrap}
  .yn label{cursor:pointer;border:1.5px solid var(--line);border-radius:9px;padding:9px 16px;font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
  .yn input{position:absolute;opacity:0;width:0;height:0}
  .yn input:checked + label{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .consent-stmt{display:flex;gap:11px;align-items:flex-start;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:14px;font-size:15px}
  .consent-stmt input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--ink)}
  .sigwrap{border:1.5px dashed var(--line);border-radius:11px;background:var(--card);position:relative}
  canvas#sigpad{display:block;width:100%;height:120px;border-radius:11px;touch-action:none;cursor:crosshair}
  .sighint{position:absolute;left:14px;bottom:8px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);pointer-events:none}

  .survey-q{padding:18px 0;border-bottom:1px solid var(--line)}.survey-q:last-child{border:0}
  .survey-q .qn{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);font-weight:700}
  .survey-q .qt{font-size:16px;margin:5px 0 11px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .survey-q .qtype{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink-faint)}
  .likert{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .likert .ends{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint)}
  .likert .opt input{position:absolute;opacity:0;width:0;height:0}
  .likert .opt label{cursor:pointer;width:38px;height:38px;border:1.5px solid var(--line);border-radius:9px;display:grid;place-items:center;font-family:"JetBrains Mono";font-size:13px;color:var(--ink-soft)}
  .likert .opt input:checked + label{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt-row{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:15px;color:#2c2d38}
  .opt-row input{position:absolute;opacity:0;width:0;height:0}
  .opt-row .mk{width:18px;height:18px;border:1.8px solid var(--ink-faint);flex:none;display:grid;place-items:center}
  .opt-row.radio .mk{border-radius:50%}.opt-row.check .mk{border-radius:5px}
  .opt-row input:checked ~ .mk{background:var(--ink);border-color:var(--ink)}
  .opt-row input:checked ~ .mk::after{content:"";width:8px;height:8px;background:var(--chalk);border-radius:inherit}
  .opt-row:has(input:checked){border-color:var(--ink);background:var(--paper-2)}
  .q-open textarea{width:100%;min-height:84px;font-family:"Newsreader";font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--card);resize:vertical}

  /* ---- participant workspace (drag-arrange A4 canvas) ---- */
  .ws2{margin-top:10px}

<body>

<div class="topbar"><div class="in">
  <div class="brand"><span class="sw"></span>Workshop&nbsp;Console <small>Flat ↔ Form</small></div>
  <div class="pswitch" id="pswitch"><button data-p="researcher" class="on">Researcher</button><button data-p="participant">Participant</button></div>
  <div class="who" id="whoBox"></div>
</div></div>

<div id="root"></div>
<div class="toast" id="toast"><span class="d"></span><span id="toastMsg"></span></div>

<script>
/* ===== stages & phases ===== */
const PHASES = [
  {key:'pretest',label:'Pre',g:'test'},{key:'pretest_survey',label:'PS',g:'survey'},{key:'div1',divider:true},
  {key:'s1_task',label:'S1',g:'task'},{key:'s1_prompt',label:'P',g:'think'},{key:'s1_survey',label:'S',g:'survey'},{key:'s1_interview',label:'I',g:'intv'},{key:'div2',divider:true},
  {key:'s2_task',label:'S2',g:'task'},{key:'s2_prompt',label:'P',g:'think'},{key:'s2_survey',label:'S',g:'survey'},{key:'s2_interview',label:'I',g:'intv'},{key:'div3',divider:true},
  {key:'s3_task',label:'S3',g:'task'},{key:'s3_prompt',label:'P',g:'think'},{key:'s3_survey',label:'S',g:'survey'},{key:'s3_interview',label:'I',g:'intv'},{key:'div4',divider:true},
  {key:'posttest',label:'Post',g:'test'},{key:'posttest_survey',label:'PS',g:'survey'},
];
const PHASE_KEYS = PHASES.filter(p=>!p.divider).map(p=>p.key);
const stagePhaseKey = s=>({pretest:'pretest',s1:'s1_task',s2:'s2_task',s3:'s3_task',posttest:'posttest'}[s]);
const surveyPhaseKey = s=>({pretest:'pretest_survey',s1:'s1_survey',s2:'s2_survey',s3:'s3_survey',posttest:'posttest_survey'}[s]);
const promptPhaseKey = s=>({s1:'s1_prompt',s2:'s2_prompt',s3:'s3_prompt'}[s]);
const interviewPhaseKey = s=>({s1:'s1_interview',s2:'s2_interview',s3:'s3_interview'}[s]);
const WORKSHOP_STAGES=['s1','s2','s3'];
// Package-driven participant's legacy-shaped PHASE_KEYS progress object, for
// LIVE DISPLAY only (tabParticipants()'s row strip) — a different object
// from the one collectExport() writes into progress.json, which stays
// deliberately untouched (frozen export format, per its own compatibility
// promise). Priority 3 audit finding: the survey/prompt/interview cells
// previously read 'done' purely from the stage being completed —
// completeStage() sets response.submittedAt unconditionally, regardless of
// whether that instrument was ever offered (PKG.share.survey/.prompt/
// .interview can be false) — so a participant who was never given, say, an
// interview would still show a false "done" checkmark for it the moment
// their stage was marked complete. Gated on the package's real share flags
// below; the task cell was already correct and is unchanged.
// Multiple Workshop Attempts: takes an ARRAY of session entries (see
// getImportedSessions()) and unions each cell to 'done' if it was ever done
// in ANY session — a participant who completed Stage 1 in an earlier
// attempt and Stage 2/3 in a later one must show both as done, not just
// whichever session happens to be read. A bare single `data` object (or a
// single legacy {data,...} entry) is still accepted for callers that only
// ever had one package, so this stays a drop-in replacement.
function derivePackageProgressForDisplay(sessions){
  const list = Array.isArray(sessions) ? sessions
    : (sessions && sessions.data) ? [sessions]
    : sessions ? [{data:sessions}] : [];
  const prog={};
  PKG_STAGE_ORDER.forEach(sk=>{
    const taskKey=stagePhaseKey(sk), surveyKey=surveyPhaseKey(sk);
    let taskState='pending', surveyState='pending', promptState='pending', interviewState='pending';
    list.forEach(sess=>{
      const data = sess.data || sess;
      const share = data.share||{};
      const st = data.stages && data.stages[sk];
      if(!st || !st.assigned) return;
      if(st.completed) taskState='done';
      else if(taskState!=='done' && data.progress && data.progress.currentStage===sk) taskState='active';
      if(share.survey && st.response && st.response.submittedAt) surveyState='done';
      if(sk==='s1'||sk==='s2'||sk==='s3'){
        const resp=(st&&st.response)||{};
        if(share.prompt && (resp.promptNotes || st.completed)) promptState='done';
        if(share.interview && (resp.interviewNotes || st.completed)) interviewState='done';
      }
    });
    if(taskKey) prog[taskKey]=taskState;
    if(surveyKey) prog[surveyKey]=surveyState;
    if(sk==='s1'||sk==='s2'||sk==='s3'){ prog[sk+'_prompt']=promptState; prog[sk+'_interview']=interviewState; }
  });
  return prog;
}
// ── Multiple Workshop Attempts: per-stage status unioned across every
// imported session for one participant. Feeds the Completion Matrix and the
// At-a-glance stats — a stage counts as Studio-complete/Survey-complete if
// it was ever completed/submitted in ANY session, never just the latest. ──
function computeParticipantStageStatus(code){
  const sessions = getImportedSessions(code);
  const out = {};
  PKG_STAGE_ORDER.forEach(sk=>{ out[sk] = {assigned:false, stageComplete:false, studioDone:false, surveyApplies:false, surveyDone:false}; });
  sessions.forEach(sess=>{
    const data = sess.data||{};
    const share = data.share||{};
    PKG_STAGE_ORDER.forEach(sk=>{
      const st = data.stages && data.stages[sk];
      if(!st || !st.assigned) return;
      out[sk].assigned = true;
      if(st.completed) out[sk].stageComplete = true;
      const studioDone = !!st.studioCompletedAt || (((st.response&&st.response.uploads)||[]).length>0) || !!st.completed;
      if(studioDone) out[sk].studioDone = true;
      if(share.survey){
        out[sk].surveyApplies = true;
        if(st.response && st.response.submittedAt) out[sk].surveyDone = true;
      }
    });
  });
  return out;
}
// A participant "needs attention" if they've returned at least one file but
// still have assigned work (studio and/or survey) that isn't done in any
// session yet — i.e. the workshop isn't finished for them.
function participantNeedsAttention(code){
  const status = computeParticipantStageStatus(code);
  return PKG_STAGE_ORDER.some(sk=>{
    const s = status[sk];
    if(!s.assigned) return false;
    return !s.studioDone || (s.surveyApplies && !s.surveyDone);
  });
}
// ── Completion Matrix (Data & Analysis Final Refinement, item 2): replaces
// the old 16-cell Pre/PS/S1/P/S/I/… grid, whose abbreviations were
// developer-facing and hard to read at a glance. Plain-language instead:
// for each of the 5 protocol stages, one dot for "Studio activity done" and
// (when a survey was actually offered for that stage) one for "Survey
// done" — no cryptic codes to learn. Built on computeParticipantStageStatus,
// which already unions correctly across every imported session, so a
// participant who completed different stages across separate attempts
// shows the union here, never just their latest import. ──
function completionMatrixHTML(){
  const stageLabels = PKG_STAGE_ORDER.map(sk=>(STAGEINFO[sk]&&STAGEINFO[sk].name.split(' · ')[0])||sk);
  const rows = S.participants.map(p=>{
    const code = p.code||p.id;
    const sessions = getImportedSessions(code);
    if(!sessions.length){
      return `<tr><td class="name">${esc(p.name)}<div class="pid">${esc(p.code||p.id)}</div></td>
        <td colspan="${PKG_STAGE_ORDER.length}" class="faint mono" style="text-align:center;font-size:11px">no file imported yet</td>
        <td style="text-align:center"><span class="faint">—</span></td></tr>`;
    }
    const status = computeParticipantStageStatus(code);
    const needsAttention = participantNeedsAttention(code);
    const cells = PKG_STAGE_ORDER.map(sk=>{
      const s = status[sk];
      if(!s.assigned) return `<td class="cm-cell"><span class="cm-dot cm-na" title="Not assigned"></span></td>`;
      const studioTitle = `Studio activity: ${s.studioDone?'complete':'not yet complete'}`;
      const dots = `<span class="cm-dot ${s.studioDone?'cm-done':'cm-pending'}" title="${studioTitle}"></span>`
        + (s.surveyApplies?`<span class="cm-dot ${s.surveyDone?'cm-done':'cm-pending'}" title="Survey: ${s.surveyDone?'complete':'not yet complete'}"></span>`:'');
      return `<td class="cm-cell">${dots}</td>`;
    }).join('');
    const sessionNote = sessions.length>1?` · ${sessions.length} sessions`:'';
    return `<tr><td class="name">${esc(p.name)}<div class="pid">${esc(p.code||p.id)}${sessionNote}</div></td>${cells}
      <td style="text-align:center">${needsAttention?'<span class="tag wait">⚠ needs review</span>':'<span class="tag ok">✓ complete</span>'}</td></tr>`;
  }).join('');
  const head = stageLabels.map(l=>`<th>${esc(l)}</th>`).join('');
  return `<table class="mx"><thead><tr><th style="text-align:left">Participant</th>${head}<th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="legend" style="margin-top:10px">
      <span><i style="background:var(--done)"></i>done</span>
      <span><i style="background:var(--card);border:1.5px solid var(--line)"></i>pending</span>
      <span><i style="background:transparent;border:1.5px dashed var(--line)"></i>not assigned</span>
      <span class="faint mono" style="font-size:11px">left dot = Studio activity · right dot = Survey (only shown when a survey was assigned)</span>
    </div>`;

//  CONSOLE STATE — SAVE / OPEN
//  The console has no backend at all — garments, tasks, basic panels and
//  participants exist only in this tab's memory. A refresh, crash, or
//  closed tab loses everything. This saves/restores the full state.
// ════════════════════════════════════════
let currentConsoleFileHandle = null;
let currentConsoleFileName = null;

function buildConsoleStatePayload(){
  return {
    flatform_console_state: true,
    version: 1,
    savedAt: new Date().toISOString(),
    garments: GARMENTS,
    tasks: TASKS,
    basicPanels: BASIC_PANELS,
    participants: PARTICIPANTS,
    seq: { garment: GARMENT_SEQ, task: TASK_SEQ },
    importedPackages: S.importedPackages,
  };
}

async function saveConsoleState(){
  let json;
  try { json = JSON.stringify(buildConsoleStatePayload()); }
  catch(e){ alert('Could not save: '+e.message); return; }

  // Prefer TRUE in-place overwrite where the browser supports it (Chrome,
  // Edge) — first Save asks where to save once, every Save after that
  // writes straight back to that same file.
  if (window.showSaveFilePicker) {
    try {
      if (!currentConsoleFileHandle) {
        currentConsoleFileHandle = await window.showSaveFilePicker({
          suggestedName: currentConsoleFileName || ('workshop-console-state-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.json'),
          types: [{ description: 'Workshop Console state', accept: {'application/json': ['.json']} }]
        });
      }
      const writable = await currentConsoleFileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      currentConsoleFileName = currentConsoleFileHandle.name;
      toast('Saved to "'+currentConsoleFileName+'" — Save again to update the same file');
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      console.error(err); // fall through to the download fallback
    }
  }

  // Fallback for browsers without the File System Access API (Safari,
  // Firefox) — reuse the same filename every time so it's at least
  // consistent; whether that replaces the previous download or adds "(1)"
  // is controlled by your browser's own download settings.
  const name = currentConsoleFileName || ('workshop-console-state-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.json');
  currentConsoleFileName = name;
  const blob = new Blob([json], {type:'application/json'});
  const reader = new FileReader();
  reader.onload = function(){
    const a=document.createElement('a');
    a.href=reader.result; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Saved as "'+name+'" — your browser controls whether this replaces the previous download or adds a copy');
  };
  reader.onerror = function(){ alert('Could not save (file read failed).'); };
  reader.readAsDataURL(blob);
}

function openConsoleState(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function(){
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ alert('This does not look like a valid Workshop Console state file.'); input.value=''; return; }
    if (!data || !data.flatform_console_state) {
      alert('This does not look like a Workshop Console state file (saved with the Save button).');
      input.value=''; return;
    }
    GARMENTS.length=0; if(Array.isArray(data.garments)) GARMENTS.push(...data.garments);
    TASKS.length=0; if(Array.isArray(data.tasks)) TASKS.push(...data.tasks);
    PARTICIPANTS.length=0; if(Array.isArray(data.participants)) PARTICIPANTS.push(...data.participants);
    BASIC_PANELS = Array.isArray(data.basicPanels) ? data.basicPanels : [];

// Attempt ID was introduced — data.createdAt (set once by Console at export

function getImportedSessions(code){

function importParticipantPackage(input){

    // Same exported package re-imported (e.g. a later checkpoint save, or an
    // accidental re-import) updates that session in place; a different
    // createdAt is a genuinely separate workshop attempt and is added
    // alongside the earlier ones, never replacing them.
    const dupIdx = sessions.findIndex(s=>s.data && s.data.createdAt && s.data.createdAt===data.createdAt);

// restore_error event is a real signal and still counts; a structurally

// ── Package-derived dashboard summary. Once a participant has an imported

function deriveParticipantSummary(p){

  const completedCount = assignedKeys.filter(sk=>status[sk].stageComplete).length;

// Operates on a single imported session entry ({data, importedAt, fileName})
// — sessions/syncLog are per-package, so operational metrics are computed
// and displayed per session (see operationalMetricsHTML below), never
// blended across a participant's separate workshop attempts.
function computeOperationalMetrics(entry){
  if(!entry) return null;
  const data = entry.data || {};
  const sessions = Array.isArray(data.sessions) ? data.sessions : [];
  const syncLog = Array.isArray(data.syncLog) ? data.syncLog : [];

  const validSessions = sessions.filter(s=>s && typeof s.startedAt==='string');
  const closedSessions = validSessions.filter(s=>typeof s.endedAt==='string');

  const reasonCounts = {pause:0, completed:0, replaced:0};
  closedSessions.forEach(s=>{ if(s.endedReason && reasonCounts.hasOwnProperty(s.endedReason)) reasonCounts[s.endedReason]++; });

// ── Stage-card metrics: only values the package directly supports. As of

// genuine stage_entered transition for that stage — never derived from

// completedAt/submittedAt/syncCount remain available regardless. ──
// ── Pairs one stage's activity_entered/activity_exited events chronologically

// differently-worded "ease" question into one cross-stage line, with no
// visible indication of which literal question a given number came from —
// exactly the "difficult to interpret, doesn't communicate which question
// is being summarised" complaint. Replaced with one summary per LIKERT
// question, grouped by stage, each showing its own full question text and
// its own scale end-labels (SURVEYDEF.qs[i].ends) — nothing is collapsed
// across stages or across differently-worded questions. Still a genuine
// cross-participant mean from S.importedPackages, not placeholder data;
// malformed/missing answers are excluded from a question's mean rather
// than counted as zero (same convention as computeOperationalMetrics()).
// Non-likert question types (single/multi/rank/open) aren't meaningfully

function computeLikertSummaries(){
  return PKG_STAGE_ORDER.map(sk=>{
    const def = SURVEYDEF[sk];
    const stageName = (STAGEINFO[sk]&&STAGEINFO[sk].name)||sk;
    if(!def) return {sk, stageName, questions:[]};
    const questions = def.qs
      .map((q,idx)=>({q,idx}))
      .filter(({q})=>q.t==='likert')
      .map(({q,idx})=>{
        const values=[];
        // Multiple Workshop Attempts: every session across every participant
        // contributes — a stage's survey answer from ANY imported attempt
        // counts, not just a participant's most recently imported package.
        Object.keys(S.importedPackages||{}).forEach(code=>{
          getImportedSessions(code).forEach(entry=>{
            const st = entry.data && entry.data.stages && entry.data.stages[sk];
            const v = st && st.response && Array.isArray(st.response.survey) ? st.response.survey[idx] : undefined;

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

function downloadBlob(blob,name){
  // Use a data: URI instead of a blob: URL. blob: URLs are tied to the page's
  // origin — in a sandboxed preview or a file:// context that origin is "null",
  // and Safari can't navigate/download blob:null/... URLs at all; it instead
  // tries to open the blob URL as a real page, fails, and replaces the whole
  // tab with an error page (wiping out all in-memory state). data: URIs have
  // no such origin dependency and work the same everywhere.
  const reader = new FileReader();
  reader.onload = function(){
    const a=document.createElement('a');
    a.href=reader.result; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  reader.onerror = function(){
    // Fallback: original blob-URL approach, in case data: URL reading fails for some reason
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  reader.readAsDataURL(blob);
}

    const sessions=getImportedSessions(p.code||p.id);
    if(sessions.length){
      // Package-driven participant: populate the same legacy export artifacts
      // from the imported package(s). Closest semantically correct value
      // only — never fabricated (see ARCHITECTURE.md V2 Roadmap Item 5-i for
      // the mapping). Multiple Workshop Attempts: a single session keeps the
      // exact flat layout used before (backward compatible); more than one
      // session writes each into its own attempt-N subfolder so every
      // returned file's data is preserved independently, never merged.
      const sorted=sessions.slice().sort((a,b)=>new Date((a.data&&a.data.createdAt)||a.importedAt)-new Date((b.data&&b.data.createdAt)||b.importedAt));
      if(sorted.length===1){
        writeImportedSessionFiles(files, base, sorted[0]);
      } else {
        sorted.forEach((entry,i)=>writeImportedSessionFiles(files, `${base}/attempt-${i+1}`, entry));
      }
    } else {
      files.push({path:`${base}/progress.json`,content:JSON.stringify(p.progress,null,2)});
      ['prompts','interviews','surveys'].forEach(map=>{if(p[map])Object.keys(p[map]).forEach(stg=>files.push({path:`${base}/${map}/${stg}-${map.slice(0,-1)}.json`,content:JSON.stringify(p[map][stg],null,2)}));});
      if(p.work)Object.keys(p.work).forEach(stg=>{const w=p.work[stg];
        files.push({path:`${base}/work/${stg}.json`,content:JSON.stringify({tray:w.tray||[],uploads:(w.uploads||[]).map(u=>u.name),presentedAt:w.presentedAt||null},null,2)});
        (w.uploads||[]).forEach((u,i)=>{const dp=dataUrlParts(u.dataUrl);const safe=(u.name||('file-'+(i+1))).replace(/[^\w.\-]+/g,'_');if(dp)files.push({path:`${base}/solutions/${stg}/${safe.match(/\.[a-z0-9]+$/i)?safe:safe+'.'+dp.ext}`,content:dp.b64,base64:true});});
        Object.keys(w.scaffolds||{}).forEach(k=>{const f=w.scaffolds[k];const dp=dataUrlParts(f.dataUrl);if(dp)files.push({path:`${base}/scaffolds/${stg}/${k}.${dp.ext}`,content:dp.b64,base64:true});});
      });
    }
  });
  // flat responses CSV across everyone (all instruments)
  const srows=[['participant_code','stage','instrument','question','type','answer']];
  S.participants.forEach(p=>{
    const sessions=getImportedSessions(p.code||p.id);
    if(sessions.length){
      // Multiple Workshop Attempts: every session's responses are included,
      // not just the latest — a stage completed in an earlier attempt still
      // has its survey/think-aloud/interview data represented here.
      sessions.forEach(entry=>{
        const data=entry.data||{}, stages=data.stages||{};
        PKG_STAGE_ORDER.forEach(sk=>{
          const st=stages[sk]; if(!st) return;
          const resp=st.response||{};
          if(Array.isArray(resp.survey)&&resp.survey.length){
            resp.survey.forEach((answer,i)=>{srows.push([p.code||p.id,sk,'survey','Response '+(i+1),'',Array.isArray(answer)?answer.join('; '):(answer==null?'':answer)]);});
          }
          if(resp.promptNotes) srows.push([p.code||p.id,sk,'think-aloud','(researcher-led, conducted)','notes',resp.promptNotes]);
          if(resp.interviewNotes) srows.push([p.code||p.id,sk,'interview','(researcher-led, conducted)','notes',resp.interviewNotes]);
        });
      });
    } else {
      [['prompts','think-aloud'],['surveys','survey'],['interviews','interview']].forEach(([map,label])=>{if(p[map])Object.keys(p[map]).forEach(stg=>{const rec=p[map][stg];if(rec.responses){rec.responses.forEach(r=>{srows.push([p.code||p.id,stg,label,r.q,r.type,Array.isArray(r.answer)?r.answer.join('; '):(r.answer==null?'':r.answer)]);});}else{srows.push([p.code||p.id,stg,label,'(researcher-led, conducted)','notes',rec.notes||'']);}});});
    }
  });
  if(srows.length>1)files.push({path:'responses.csv',content:srows.map(r=>r.map(csvCell).join(',')).join('\n')});
  S.garments.forEach(g=>{const base=`garments/${g.id}`;
    files.push({path:`${base}/meta.json`,content:JSON.stringify({id:g.id,name:g.name,type:g.type,complexity:cxName(g.cx),stages:g.stages||[],description:g.desc||'',panelCount:(g.panelImgs?g.panelImgs.length:(g.panels?g.panels.length:0))},null,2)});
    const gi=dataUrlParts(g.img);if(gi)files.push({path:`${base}/garment.${gi.ext}`,content:gi.b64,base64:true});
    (g.panelImgs||[]).forEach((d,i)=>{const pi=dataUrlParts(d);if(pi)files.push({path:`${base}/panel-${i+1}.${pi.ext}`,content:pi.b64,base64:true});});
  });
  files.push({path:'README.txt',content:`Workshop Console (Flat ↔ Form) — research data export\nGenerated ${new Date().toString()}\n\nfolders:\n  <code>/   one per participant (profile, consent, progress, findings)\n  garments/ one per garment (meta + uploaded images)\n  participants.csv, tasks.csv  summaries`});
  return files;
}
async function exportZip(){
  if(!window.JSZip){toast('Zip library not available (offline?)');return;}
  toast('Building data export…');
  const zip=new JSZip();
  collectExport().forEach(f=>zip.file('flat-form-export/'+f.path,f.content,f.base64?{base64:true}:undefined));
  const blob=await zip.generateAsync({type:'blob'});
  downloadBlob(blob,'flat-form-export.zip');
  toast('Export downloaded (.zip)');
}
async function writeToDir(dirHandle,path,content,base64){
  const parts=path.split('/');const name=parts.pop();let d=dirHandle;
  for(const seg of parts){d=await d.getDirectoryHandle(seg,{create:true});}
  const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();
  if(base64){const bin=atob(content);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);await w.write(arr);}else{await w.write(content);}
  await w.close();
}
async function exportFolder(){
  if(!window.showDirectoryPicker){toast('Folder save needs Chrome or Edge');return;}
  let dir;try{dir=await window.showDirectoryPicker({mode:'readwrite'});}catch(e){return;}
  try{const files=collectExport();for(const f of files){await writeToDir(dir,f.path,f.content,f.base64);}toast('Saved into the chosen folder');}
  catch(e){toast('Could not write to folder: '+e.message);}
}

// ════════════════════════════════════════
//  BULK FOLDER IMPORT — select a whole folder of garment subfolders at
//  once (Full garment / Extract panel / One / Two / Group arrangement /
//  Individual Panels, optionally under Simple/Moderate/Complex), and
//  auto-sort every file into the right slot by matching folder/file names,
//  instead of uploading each file one at a time per garment.
// ════════════════════════════════════════
// Single shared list of category keywords — classifyBulkFile() (which file
// goes in which bucket) and garmentNameFromPath() (which folder is "the
// garment folder") used to each hard-code their own separate list; those
// two lists silently drifted apart, which is exactly what broke recognition
// when garment folders got renamed to the new role-based asset structure.
// Substring match (not exact-segment match — the old garmentNameFromPath's
// stricter exact match was the more fragile of the two and is why renaming
// e.g. "Full garment" → "Full garment image" would have broken it even
// before this round of renames).
const BULK_CATEGORY_KEYWORDS=[
  'half panel arrangement','half arrangement','arrangement - scaffold','arrangement scaffold',
  'full panel arrangement','full arrangement',
  'researcher solution','solution image',
  'extract panel','individual panel','full garment',
];
function findCategorySegmentIdx(parts){
  for(let i=0;i<parts.length;i++){
    const seg=parts[i].toLowerCase();
    if(BULK_CATEGORY_KEYWORDS.some(k=>seg.indexOf(k)>-1)) return i;
  }
  return -1;
}
function classifyBulkFile(relPath){
  const parts=relPath.split('/');
  const fname=parts[parts.length-1];
  const lower=relPath.toLowerCase();
  const fnameLower=fname.toLowerCase();
  const has=(s,k)=>s.indexOf(k)>-1;
  const ext=(fnameLower.match(/\.([a-z0-9]+)$/)||[])[1]||'';

  // Basic panels (global set, not a per-garment folder)
  if(has(lower,'basic panel')) return {bucket:'basicPanel'};

  // Which reference-view slot (full / front&back / flat sketch) does this
  // file represent? Bug found: this used to try viewSlot(fnameLower) — the
  // FILENAME ALONE — first, and only fall back to checking the full path
  // (which includes the folder name) if that returned nothing, via
  // `viewSlot(fnameLower) || viewSlot(lower)`. That fallback never actually
  // ran whenever the filename alone matched ANYTHING, even a wrong,
  // incomplete match — so a file physically filed under a "Front & Back"
  // folder but named e.g. "TunicA-Full.jpg" (a generic "full-size photo"
  // naming habit, nothing to do with the Full Garment role) matched 'full'
  // from the filename alone and never got the chance to see the folder
  // name that actually said front&back. Folder and filename are now
  // checked TOGETHER as one combined signal, most-specific-first, so an
  // explicit "front & back" anywhere (folder or filename) always outranks
  // a bare "full" anywhere — order of the two input strings no longer
  // matters, only which pattern is more specific. ──
  const folderPath = parts.slice(0,-1).join('/').toLowerCase();
  function viewSlot(folder, fname){
    if((has(folder,'front')&&has(folder,'back')) || (has(fname,'front')&&has(fname,'back'))) return 'frontBack';
    if(has(folder,'flat')||has(fname,'flat')) return 'flatSketch';
    if(has(folder,'full')||has(fname,'full')) return 'full';
    return null;
  }
  const slot = viewSlot(folderPath, fnameLower);

  // ── New role-based asset folders (Priority 2) — checked first since a
  // folder can now hold an svg + png + pdf of the same conceptual asset
  // side by side; disambiguated by extension rather than a single winner
  // file. Also checked before the legacy "full garment"/"arrangement…"
  // rules below so e.g. "Full Panel Arrangement" isn't mistaken for the
  // old "Full garment" folder just because both contain "full". ──
  if(has(lower,'half panel arrangement')||has(lower,'half arrangement')){
    return ext==='svg' ? {bucket:'halfArrangementSvg'} : {bucket:'arrangementScaffold'};
  }
  if(has(lower,'researcher solution')||has(lower,'solution image')) return {bucket:'solutionImagePng'};
  if(has(lower,'full panel arrangement')||has(lower,'full arrangement')){
    if(ext==='svg') return {bucket:'fullArrangementSvg'};
    if(ext==='pdf') return {bucket:'fullArrangementPdf'};
    return {bucket:'fullArrangementPng'};
  }

  // "Panel Arrangement - Scaffold" (legacy name for the same Half Panel
  // Arrangement PNG role handled above) — shown as a scaffold reference
  // directly in the Panel Studio workspace, not a solution file.
  if(has(lower,'arrangement - scaffold')||has(lower,'arrangement scaffold')) return {bucket:'arrangementScaffold'};
  if(has(lower,'individual panel')) return {bucket:'panel'};
  if(has(lower,'extract panel')){
    const setIdx = has(lower,'/two/')||has(lower,'-two-')||/\btwo\b/.test(lower) ? 1 : 0; // default to option 1
    return {bucket:'marked', setIdx, slot: slot||'full'};
  }
  if(has(lower,'full garment')||slot) return {bucket:'ref', slot: slot||'full'};
  return {bucket:'other'};
}
function garmentNameFromPath(relPath){
  // The garment name is whichever folder directly contains a recognized
  // category subfolder — walk the path and take the segment right before
  // the first one BULK_CATEGORY_KEYWORDS recognizes, using the exact same
  // keyword list classifyBulkFile() uses so the two can't disagree.
  const parts=relPath.split('/');
  const idx=findCategorySegmentIdx(parts);
  if(idx>0) return parts[idx-1];
  return parts.length>1?parts[0]:null;
}
function difficultyFromPath(relPath){
  const lower=relPath.toLowerCase();
  if(/(^|\/)simple(\/|$)/.test(lower)) return 's';
  if(/(^|\/)moderate(\/|$)/.test(lower)) return 'm';
  if(/(^|\/)complex(\/|$)/.test(lower)) return 'c';
  return null;
}
function newBulkGarmentEntry(name,cx){
  return {name, cx, full:null,frontBack:null,flat:null, panelFiles:[], arrangementScaffold:null,
    marked:[{full:null,frontBack:null,flat:null},{full:null,frontBack:null,flat:null}],
    // Priority 2 role-based assets — same fields the manual garment form
    // (taskForm()) writes to, so bulk-imported and manually-added garments
    // end up in an identical shape.
    halfArrangementSvg:null, fullArrangementSvg:null, fullArrangementPng:null, fullArrangementPdf:null, solutionImagePng:null};
}
function handleBulkImportFiles(fileList){
  const files=[...fileList].filter(f=>f.webkitRelativePath);
  if(!files.length){ toast('No files found — make sure you selected a folder, not individual files.'); return; }
  const byGarment={}; // name -> newBulkGarmentEntry() shape
  let basicPanelFiles=[];
  let unmatched=0;

  files.forEach(f=>{
    const rel=f.webkitRelativePath;
    const cls=classifyBulkFile(rel);
    if(cls.bucket==='basicPanel'){ basicPanelFiles.push(f); return; }
    if(cls.bucket==='other'){ unmatched++; return; }
    const gname=garmentNameFromPath(rel);
    if(!gname){ unmatched++; return; }
    if(!byGarment[gname]) byGarment[gname]=newBulkGarmentEntry(gname, difficultyFromPath(rel)||'s');
    const g=byGarment[gname];
    if(cls.bucket==='ref'){ g[cls.slot==='frontBack'?'frontBack':cls.slot==='flatSketch'?'flat':'full']=f; }
    else if(cls.bucket==='panel'){ g.panelFiles.push(f); }
    else if(cls.bucket==='arrangementScaffold'){ g.arrangementScaffold=f; }
    else if(cls.bucket==='marked'){ const slotKey=cls.slot==='frontBack'?'frontBack':cls.slot==='flatSketch'?'flat':'full'; g.marked[cls.setIdx][slotKey]=f; }
    else if(cls.bucket==='halfArrangementSvg'){ g.halfArrangementSvg=f; }
    else if(cls.bucket==='fullArrangementSvg'){ g.fullArrangementSvg=f; }
    else if(cls.bucket==='fullArrangementPng'){ g.fullArrangementPng=f; }
    else if(cls.bucket==='fullArrangementPdf'){ g.fullArrangementPdf=f; }
    else if(cls.bucket==='solutionImagePng'){ g.solutionImagePng=f; }
  });

  S.bulkImport = { garments: Object.values(byGarment), basicPanelFiles, unmatched, tagStages:{pretest:true,s1:true,s2:true,s3:true,posttest:true} };
  render();
}

async function confirmBulkImport(){
  const bi=S.bulkImport; if(!bi) return;
  const stages=Object.keys(bi.tagStages).filter(k=>bi.tagStages[k]);
  toast('Importing… this may take a moment for a lot of files');
  for(const g of bi.garments){
    try{
      const [fullImg,frontBackImg,flatSketchImg,arrangementScaffold,
             halfArrangementSvg,fullArrangementSvg,fullArrangementPng,fullArrangementPdf,solutionImagePng,
             ...panelImgs] = await Promise.all([
        g.full?readImg(g.full):null, g.frontBack?readImg(g.frontBack):null, g.flat?readImg(g.flat):null,
        g.arrangementScaffold?readImg(g.arrangementScaffold):null,
        g.halfArrangementSvg?readImg(g.halfArrangementSvg):null,
        g.fullArrangementSvg?readImg(g.fullArrangementSvg):null, g.fullArrangementPng?readImg(g.fullArrangementPng):null,
        g.fullArrangementPdf?readImg(g.fullArrangementPdf):null, g.solutionImagePng?readImg(g.solutionImagePng):null,
        ...g.panelFiles.map(readImg)
      ]);
      const markedSets = await Promise.all(g.marked.map(async ms=>({
        full: ms.full?await readImg(ms.full):null,
        frontBack: ms.frontBack?await readImg(ms.frontBack):null,
        flatSketch: ms.flat?await readImg(ms.flat):null,
      })));
      const gid='gx'+(GARMENT_SEQ++);
      const garmentObj={id:gid,name:g.name.trim()||'Garment',type:'Garment',cx:g.cx,desc:'',
        img:fullImg,fullImg,frontBackImg,flatSketchImg,
        panelImgs,
        arrangementScaffold,
        halfArrangementSvg, halfArrangementSvgName:g.halfArrangementSvg?g.halfArrangementSvg.name:'',
        fullArrangementSvg, fullArrangementSvgName:g.fullArrangementSvg?g.fullArrangementSvg.name:'',
        fullArrangementPng,
        fullArrangementPdf, fullArrangementPdfName:g.fullArrangementPdf?g.fullArrangementPdf.name:'',
        solutionImagePng, solutionImagePngName:g.solutionImagePng?g.solutionImagePng.name:'',
        markedSets,stages,
        panels:panelImgs.length?panelImgs.map(()=>'bodice'):['bodice','back']};
      S.garments.push(garmentObj);
      stages.filter(s=>WORKSHOP_STAGES.includes(s)).forEach(s=>{const t={id:'tk'+(TASK_SEQ++),stage:s,cx:g.cx,garmentId:gid};if(s==='s3')t.line='see garment image';TASKS.push(t);});
    }catch(err){ console.error(err); alert('Could not import "'+g.name+'": '+(err&&err.message||err)); }
  }
  if(bi.basicPanelFiles.length){
    try{ const arr=await Promise.all(bi.basicPanelFiles.map(readImg)); BASIC_PANELS=BASIC_PANELS.concat(arr); }
    catch(err){ console.error(err); alert('Some basic panel images could not be read: '+(err&&err.message||err)); }
  }
  S.bulkImport=null; render();
  toast('Import complete');
}

    ${rows}</div>`;
}
function conductPanel(p){
  const a=p.active, info=STAGEINFO[a.stage], cur=a.current||'task';
  const acts=[['task','Task','participant'],['prompt','Think-aloud','researcher'],['survey','Survey','participant'],['interview','Interview','researcher']]
    .filter(([k])=> k==='task' || (a.share&&a.share[k]&&instrPhaseKey(k,a.stage)));
  const rows=acts.map(([k,label,who])=>{

      return `<div class="crow ${live?'cur':''}"><div class="chead"><span class="cname">${label}</span><span class="who">researcher-led</span>${status}</div>
        <details ${live?'open':''}><summary>${def.groups.reduce((n,g)=>n+g.qs.length,0)} questions to ask</summary><div class="qbox">${questionList(def)}</div></details>
        <textarea id="note_${k}" placeholder="Notes / key observations (optional, saved to record)">${esc((p[INSTR_KIND[k]]&&p[INSTR_KIND[k]][a.stage]&&p[INSTR_KIND[k]][a.stage].notes)||'')}</textarea>

    }
    else{btns=`<button class="btn cw sm" data-act="setCurrent" data-k="survey" data-pid="${p.id}">Open survey for participant</button>${done?'':''}`;}
    return `<div class="crow ${live?'cur':''}"><div class="chead"><span class="cname">${label}</span><span class="who">${who}-led</span>${status}</div><div class="cbtns">${btns}</div></div>`;
  }).join('');
  return `<div class="conduct"><h3>Live session — ${p.name}</h3><div class="sub">${info.n} · ${info.name} &nbsp;·&nbsp; participant currently sees: <b style="color:var(--hi)">${INSTR_TITLE[cur]||'Task'}</b></div>
    ${scaffoldConduct(p)}
    ${rows}
    <div class="cbtns" style="margin-top:14px"><button class="btn cw ghost sm" data-act="setCurrent" data-k="waiting" data-pid="${p.id}">Put participant on standby</button><button class="btn sm" style="background:var(--physical);border-color:var(--physical)" data-act="endSession" data-pid="${p.id}">End session · release participant</button></div></div>`;
}

// ════════════════════════════════════════
//  PACKAGE & SEND — bundle all 5 stages for a participant into one JSON
//  file the participant imports and works through on their own machine,
//  saving/re-sharing progress as a checkpoint file after each stage.
// ════════════════════════════════════════
const PKG_STAGE_ORDER=['pretest','s1','s2','s3','posttest'];
function ensurePlan(p){
  if(!p.plan) p.plan={
    mode:'physical',
    share:{prompt:true,survey:true,interview:true,finalReflection:true},
    // shareDocs (default false, added below) — the Brief page must only
    // show a document because the researcher deliberately turned it on for
    // this stage, never just because the garment happens to have one
    // uploaded to its asset library. Off by default on every stage.
    stages:{
      pretest:{cx:'s',garmentId:null,distractors:{},shareDocs:false},
      s1:{cx:'s',taskId:null,distractors:{},shareDocs:false},
      s2:{cx:'s',taskId:null,shareDocs:false},
      s3:{cx:'s',taskId:null,extractOption:null,shareDocs:false},
      posttest:{cx:'s',garmentId:null,distractors:{},shareDocs:false}
    }
  };
  return p.plan;
}
function stagePickerHTML(stageKey,p){

  const filters=[['all','All'],['s','Simple'],['m','Moderate'],['c','Complex']].map(([k,l])=>`<button data-act="pkgCxFilter" data-stage="${stageKey}" data-k="${k}" class="${viewCx===k?'on':''}">${l}</button>`).join('');

  let tiles='', selName='', hasSelection=false;

    const pool=S.garments.filter(gg=>(gg.stages||[]).includes(stageKey));
    const list=viewCx==='all'?pool:pool.filter(gg=>gg.cx===viewCx);
    tiles=list.map(gg=>`<div class="seltile ${cfg.garmentId===gg.id?'sel':''}" data-act="pkgPickGarment" data-stage="${stageKey}" data-id="${gg.id}">
      <div class="mini">${garmentThumb(gg,28)}</div><div><div class="disp" style="font-size:14px">${gg.name}</div></div>
      <span class="spacer"></span><span class="tag ${gg.cx}">${cxName(gg.cx)}</span></div>`).join('')||'<div class="faint" style="font-size:12px">No garments tagged for this stage.</div>';
    const g=cfg.garmentId?garment(cfg.garmentId):null;
    selName=g?g.name:''; hasSelection=!!g;
  } else {
    const pool=tasksOf(stageKey);
    const list=viewCx==='all'?pool:pool.filter(t=>t.cx===viewCx);
    tiles=list.map(t=>{const g=garment(t.garmentId);return `<div class="seltile ${cfg.taskId===t.id?'sel':''}" data-act="pkgPickTask" data-stage="${stageKey}" data-id="${t.id}">
      <div class="mini">${garmentThumb(g,28)}</div><div><div class="disp" style="font-size:14px">${g.name}</div>${stageKey==='s3'&&t.line?`<div class="mlabel">${t.line}</div>`:''}</div>
      <span class="spacer"></span><span class="tag ${t.cx}">${cxName(t.cx)}</span></div>`;}).join('')||'<div class="faint" style="font-size:12px">No tasks in this stage yet — add a garment tagged for it.</div>';
    const t=cfg.taskId?taskById(cfg.taskId):null;
    selName=t?garment(t.garmentId).name:''; hasSelection=!!t;
  }
  const autoAct = isGarmentStage?'pkgAutoGarment':'pkgAutoTask';
  // Participant documents (Priority: Brief page must not auto-expose every
  // stage asset) — the assigned garment's fullArrangementPdf only reaches
  // the participant if the researcher explicitly opts in here, per stage.
  // Only shown at all when there's actually a document to decide about.
  const assignedGarmentForDocs = isGarmentStage
    ? (cfg.garmentId?garment(cfg.garmentId):null)
    : (cfg.taskId?garment(taskById(cfg.taskId).garmentId):null);
  const shareDocsHTML = (assignedGarmentForDocs && assignedGarmentForDocs.fullArrangementPdf) ? `
    <div class="mlabel" style="margin-top:10px;font-size:11px">Participant documents <span class="faint">(off by default — not shared just because it exists)</span></div>
    <span class="chk ${cfg.shareDocs?'on':''}" data-act="pkgToggleShareDocs" data-stage="${stageKey}"><span class="bx"></span>Share "Full arrangement reference" (PDF) with the participant</span>` : '';
  const distractorHTML = (stageKey==='s1') ? `
    <div class="mlabel" style="margin-top:10px;font-size:11px">Distractor panels <span class="faint">(optional)</span></div>
    <div class="checks" style="margin-top:6px">${S.garments.filter(g=>g.id!==(cfg.garmentId||(cfg.taskId&&taskById(cfg.taskId)?taskById(cfg.taskId).garmentId:null))).map(g=>`<span class="chk ${cfg.distractors&&cfg.distractors[g.id]?'on':''}" data-act="pkgToggleDistractor" data-stage="${stageKey}" data-k="${g.id}"><span class="bx"></span>${g.name}</span>`).join('')||'<span class="faint" style="font-size:11px">no other garments yet</span>'}</div>` : '';
  const extractOptionHTML = stageKey==='s3' ? `
    <div class="mlabel" style="margin-top:10px;font-size:11px">Extract Panel option <span class="faint">(required before export)</span></div>
    <div class="modepick" style="margin:6px 0 0">
      <button data-act="pkgSetExtractOption" data-stage="s3" data-opt="1" class="${cfg.extractOption==='1'?'on':''}">Option 1</button>
      <button data-act="pkgSetExtractOption" data-stage="s3" data-opt="2" class="${cfg.extractOption==='2'?'on':''}">Option 2</button>
    </div>
    ${(cfg.taskId&&!cfg.extractOption)?'<div class="faint mono" style="font-size:11px;margin-top:4px">⚠ choose an option — the participant package can\'t be exported until you do</div>':''}` : '';

  return `<div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between">
      <div class="disp" style="font-size:16px">${STAGEINFO[stageKey].name}</div>
      ${hasSelection?`<span class="saved" style="padding:3px 10px;font-size:11px">✓ ${esc(selName)}</span>`:'<span class="faint mono" style="font-size:11px">not assigned yet</span>'}
    </div>
    <div class="filterchips" style="margin-top:8px">${filters}</div>
    <div class="row" style="margin:8px 0"><button class="btn sm ghost" data-act="${autoAct}" data-stage="${stageKey}">⚡ Auto-select</button></div>
    <div class="grid" style="gap:6px;max-height:220px;overflow:auto">${tiles}</div>
    ${distractorHTML}
    ${extractOptionHTML}
    ${shareDocsHTML}
  </div>`;
}
function tabPackage(){
  const pOpts=S.participants.map(p=>`<option value="${p.id}" ${S.pkg.participant===p.id?'selected':''}>${p.name} · ${p.id}</option>`).join('');
  const p = S.pkg.participant?S.participants.find(x=>x.id===S.pkg.participant):null;

      <p>Build a self-contained task package for a participant working on a separate machine — they import it, work through all five stages at their own pace, and save/share a checkpoint file back to you after each one.</p></div>
      <div class="card"><div class="mlabel">Participant</div><select class="txt" id="pkgP" style="margin-top:8px"><option value="">— choose —</option>${pOpts}</select></div>`;

  const s3NeedsOption = !!plan.stages.s3.taskId && !plan.stages.s3.extractOption;

    <p>Assign whichever stages apply to this participant — a package doesn't need all five. They import the file on their own machine and work through their assigned stages in order, saving a checkpoint file back to you after each one.</p></div>
    <div class="card" style="margin-bottom:16px"><div class="mlabel">Participant</div><select class="txt" id="pkgP" style="margin-top:8px"><option value="">— choose —</option>${pOpts}</select>
      ${!p.consent.given
        ?`<div class="saved" style="margin-top:10px;border-color:var(--physical);color:var(--physical-ink)">⚠ ${p.name} hasn't completed consent yet. <button class="btn sm ghost" style="margin-left:8px" data-act="pkgToggleConsent" data-id="${p.id}">Mark consent received</button></div>`
        :`<div class="saved" style="margin-top:10px">✓ Consent received <button class="btn sm ghost" style="margin-left:8px" data-act="pkgToggleConsent" data-id="${p.id}">Undo</button></div>`}
    </div>
    <div class="grid g2">
      <div>${stageBlocks}</div>
      <div>
        <div class="card">
          <div class="mlabel">Mode</div>
          <div class="modepick" style="margin:8px 0 18px">
            <button data-act="pkgMode" data-m="physical" class="${plan.mode==='physical'?'on':''}">Physical</button>
            <button data-act="pkgMode" data-m="digital" class="${plan.mode==='digital'?'on':''}">Digital</button>
          </div>
          <div class="mlabel">Share instruments <span class="faint">(bundled into the package — surveys are self-serve; prompt/interview are face-to-face, with a text box for the participant's response)</span></div>
          <div class="checks" style="margin:8px 0 18px">${['prompt','survey','interview'].map(k=>`<span class="chk ${plan.share[k]?'on':''}" data-act="pkgShare" data-k="${k}"><span class="bx"></span>${k}</span>`).join('')}</div>
          <div class="mlabel">Ready to export</div>
          <div class="saved" style="margin-top:8px">${assignedCount} / 5 stages assigned<div class="mono faint" style="font-size:11px;margin-top:4px">You can export a partial package (e.g. pre-test only) and send an updated one later once more stages are ready.</div>
            ${!assignedCount?'<div class="faint mono" style="font-size:11px;margin-top:6px;color:var(--physical-ink)">⚠ Export is disabled — assign at least one stage above before exporting.</div>':''}
            ${s3NeedsOption?'<div class="faint mono" style="font-size:11px;margin-top:6px;color:var(--physical-ink)">⚠ Export is disabled — Stage 3 has a garment assigned but no Extract Panel option chosen yet. Pick Option 1 or 2 above before exporting.</div>':''}
          </div>

        </div>

// Stage asset roles (Priority 2 / Option C) — the same fields belong in
// every garment payload sent to Participant (general stages and Stage 3's
// own payload alike), since the asset roles aren't Stage-3-specific. One
// helper instead of duplicating this list a third time. taskPdf and the
// legacy solutionFile/solutionFileName field were removed by explicit
// request — solutionImagePng is the only "solution" concept left.
// halfArrangementSvg/fullArrangementSvg/fullArrangementPng are internal-only
// (Panel Studio consumption or future tooling) — Participant never renders
// them as a document, so they always travel with the package regardless.
// fullArrangementPdf is different: it's the one field stageDocumentsHTML()
// actually shows the participant as a downloadable document, so it must
// only be included when the researcher explicitly opted in for this stage
// (cfg.shareDocs) — never just because the garment happens to have one
// uploaded to its asset library. cfg is optional so this helper still works
// anywhere a stage config genuinely isn't available (it defaults to "not
// shared" rather than assuming — the safe direction to fail in).
function stageAssetFields(g,cfg){
  const shareDocs = !!(cfg && cfg.shareDocs);
  return {
    halfArrangementSvg:g.halfArrangementSvg||null, halfArrangementSvgName:g.halfArrangementSvgName||'',
    fullArrangementSvg:g.fullArrangementSvg||null, fullArrangementSvgName:g.fullArrangementSvgName||'',
    fullArrangementPng:g.fullArrangementPng||null,
    fullArrangementPdf: shareDocs ? (g.fullArrangementPdf||null) : null,
    fullArrangementPdfName: shareDocs ? (g.fullArrangementPdfName||'') : '',
    solutionImagePng:g.solutionImagePng||null, solutionImagePngName:g.solutionImagePngName||''
  };
}
function s3GarmentPayload(g,cfg){
  if(!g) return null;
  const opt = (cfg.extractOption && g.markedSets) ? g.markedSets[Number(cfg.extractOption)-1] : null;
  return {
    id:g.id, name:g.name, type:g.type, cx:g.cx,
    fullImg: opt?opt.full:null, frontBackImg: opt?opt.frontBack:null, flatSketchImg: opt?opt.flatSketch:null,
    arrangementScaffold:g.arrangementScaffold,
    ...stageAssetFields(g,cfg),
    desc:g.desc
  };
}
function buildParticipantPackage(p){
  const plan=ensurePlan(p);
  const stagesOut={};
  PKG_STAGE_ORDER.forEach(sk=>{
    const cfg=plan.stages[sk];
    let g=null,t=null,tray=[],individualPanelTray=undefined;
    if(sk==='pretest'||sk==='posttest'){
      g=cfg.garmentId?garment(cfg.garmentId):null;
      const dg=Object.keys(cfg.distractors||{}).filter(k=>cfg.distractors[k]).map(garment).filter(Boolean);
      tray=g?buildTrayFromDescs(descFromBasicPanels(),dg):[];
    } else {
      t=cfg.taskId?taskById(cfg.taskId):null;
      g=t?garment(t.garmentId):null;
      const dg=(sk==='s1'&&cfg.distractors)?Object.keys(cfg.distractors).filter(k=>cfg.distractors[k]&&(!t||k!==t.garmentId)).map(garment).filter(Boolean):[];
      // Progressive Reference (Hint) system: the participant now starts
      // Stage 1/2/3 with the same basic panel tray pretest/posttest already
      // use, not the garment's real individual panels — those only become
      // available once the participant reveals the "Reveal Individual
      // Panels" hint level, which is why the true per-garment tray now
      // travels separately as individualPanelTray (consumed by Participant
      // to hand to Panel Studio only after that reveal, never before). The
      // basic set is not stage-specific data, so it needs no distractors.
      tray=g?buildTrayFromDescs(descFromBasicPanels(),[]):[];
      individualPanelTray=g?buildTray(g,dg):[];
    }
    stagesOut[sk]={
      assigned:!!g,
      cx:cfg.cx||(g?g.cx:'s'),
      garment: sk==='s3' ? s3GarmentPayload(g,cfg) : (g?{id:g.id,name:g.name,type:g.type,cx:g.cx,fullImg:g.fullImg,frontBackImg:g.frontBackImg,flatSketchImg:g.flatSketchImg,arrangementScaffold:g.arrangementScaffold,...stageAssetFields(g,cfg),markedSets:g.markedSets,desc:g.desc}:null),
      styleLine:(sk==='s3'&&t)?t.line:null,
      tray:tray,
      individualPanelTray:individualPanelTray,
      completed:false, completedAt:null,
      activityDraft:null,
      response:{survey:null,promptNotes:'',interviewNotes:'',uploads:[],submittedAt:null}
    };
  });
  return {
    flatform_participant_package:true, version:1, schemaVersion:4,
    createdAt:new Date().toISOString(),
    participant:{id:p.id,name:p.name,code:p.code||p.id,email:p.email||'',detail:p.detail||''},
    mode:plan.mode, share:{...plan.share},
    consent:{recording:p.consent?p.consent.recording||'no':'no', interactionLogging:false},
    progress:{currentStage:'pretest',completedStages:[],currentScreen:'brief',packageConfirmed:false},
    sessions:[], eventLog:[], syncLog:[], lifecycleLog:[],
    // Lazily filled in by Participant once the workshop-level Final
    // Reflection is actually reached (see finalReflectionAnswers() there) —
    // present as null here purely so the field is self-documenting in a
    // freshly exported package.
    finalReflection:null,
    stages:stagesOut
  };
}
// Filename convention: "<participant id> - <stages included> - <date> -
// <time AM/PM> - <export id>.json" — human-scannable at a glance in a
// folder of many exports, and the date/time/export-id are frozen into
// the name once here so a participant's later "-Solution" file (see
// participant-page_3.html's toSolutionFileName()) can trace back to
// exactly which export it came from without recomputing anything.
const PKG_STAGE_ABBR={pretest:'PT',s1:'S1',s2:'S2',s3:'S3',posttest:'POST'};
function buildPackageFileName(pkg){
  const stagesIncluded=PKG_STAGE_ORDER.filter(sk=>pkg.stages[sk].assigned).map(sk=>PKG_STAGE_ABBR[sk]).join('+')||'none';
  const now=new Date();
  const date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  let h=now.getHours(); const ampm=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  const time=`${String(h).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${ampm}`;
  const exportId=Date.now().toString(36).slice(-5).toUpperCase();
  const pid=(pkg.participant.code||pkg.participant.id).replace(/\s+/g,'-');
  return `${pid} - ${stagesIncluded} - ${date} - ${time} - ${exportId}.json`;
}
function exportPackage(pid){
  const p=S.participants.find(x=>x.id===pid); if(!p) return;
  const plan=ensurePlan(p);
  if(plan.stages.s3.taskId && !plan.stages.s3.extractOption){
    alert('Stage 3 has a garment assigned but no Extract Panel option chosen yet. Pick Option 1 or 2 in Package & Send before exporting.');
    return;
  }
  const pkg=buildParticipantPackage(p);
  downloadJSON(pkg, buildPackageFileName(pkg));
  toast('Package exported for '+p.name+' — send this file to their machine');
}

function surveyQ(q,i){
  const tlabel={likert:'scale',single:'single choice',multi:'multiple choice',open:'open ended'}[q.t];
  let body='';
  if(q.t==='likert'){body=`<div class="likert"><span class="ends">${q.ends[0]}</span>${[1,2,3,4,5].map(n=>`<span class="opt"><input type="radio" name="q${i}" value="${n}" id="q${i}_${n}"><label for="q${i}_${n}">${n}</label></span>`).join('')}<span class="ends">${q.ends[1]}</span></div>`;}
  else if(q.t==='single'||q.t==='multi'){const type=q.t==='single'?'radio':'check';const input=q.t==='single'?'radio':'checkbox';body=`<div class="opts">${q.opts.map(o=>`<label class="opt-row ${type}"><input type="${input}" name="q${i}" value="${esc(o)}"><span class="mk"></span>${o}</label>`).join('')}</div>`;}
  else{body=`<div class="q-open"><textarea id="qopen${i}" placeholder="Type your answer…"></textarea></div>`;}
  return `<div class="survey-q"><div class="qn">Q${i+1}</div><div class="qt">${q.q}<span class="qtype">${tlabel}</span></div>${body}</div>`;
}
function readSurvey(def){return def.qs.map((q,i)=>{let ans;
  if(q.t==='likert'){const el=document.querySelector(`input[name="q${i}"]:checked`);ans=el?Number(el.value):null;}
  else if(q.t==='single'){const el=document.querySelector(`input[name="q${i}"]:checked`);ans=el?el.value:null;}
  else if(q.t==='multi'){ans=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(e=>e.value);}
  else{const el=document.getElementById('qopen'+i);ans=el?el.value.trim():'';}
  return {q:q.q,type:q.t,answer:ans};
});}

function initSig(){
  const c=$('#sigpad'); if(!c) return;
  const ctx=c.getContext('2d'); let drawing=false, has=false;
  function size(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1A1B24';}
  size();
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{drawing=true;has=true;const h=$('#sigHint');if(h)h.style.display='none';const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
  c._clear=()=>{ctx.clearRect(0,0,c.width,c.height);has=false;const h=$('#sigHint');if(h)h.style.display='block';};
  c._has=()=>has;
}
