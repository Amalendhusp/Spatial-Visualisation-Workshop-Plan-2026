$('#pswitch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.perspective=b.dataset.p;render();});

root.addEventListener('click',e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){S.rtab=tabBtn.dataset.tab;render();return;}
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='recordFindings'){const p=S.participants.find(x=>x.id===id);p.notify=false;S.selParticipant=id;S.rtab='analysis';render();toast(`Opened ${p.name}'s record`);}
  else if(act==='showAddP'){S.addP=true;S.editingParticipantId=null;render();}
  else if(act==='cancelAddP'){S.addP=false;S.editingParticipantId=null;render();}
  else if(act==='openP'){if(e.cancelable)e.preventDefault();S.selParticipant=id;S.rtab='analysis';render();}
  else if(act==='editParticipant'){
    // Priority 4 — same show-form-in-place pattern as editGarment() below,
    // just for participant contact metadata. Deliberately does not touch
    // consent/progress/active/findings/arts — this is a metadata correction
    // tool, not a way to reset a participant's recorded state.
    S.editingParticipantId=id; S.addP=true; S.confirmDelP=null; render();
  }
  else if(act==='askDelP'){S.confirmDelP=id;render();}
  else if(act==='cancelDelP'){S.confirmDelP=null;render();}
  else if(act==='delParticipant'){
    S.participants=S.participants.filter(p=>p.id!==id);
    if(S.selParticipant===id)S.selParticipant=null;
    S.confirmDelP=null; render(); toast('Participant removed');
  }
  else if(act==='submitAddP'){
    const editing=S.editingParticipantId?S.participants.find(p=>p.id===S.editingParticipantId):null;
    if(editing){
      // Pseudoname/code is deliberately not editable here — it's the
      // participant's stable identifier (package matching, exported
      // filenames, plan/findings/import lookups all key off it, and it may
      // already be baked into a package already sent to or returned by the
      // participant). Only the surrounding contact metadata is corrected.
      editing.name=$('#apName').value.trim()||editing.code||editing.id;
      editing.email=$('#apEmail').value.trim(); editing.phone=$('#apPhone').value.trim();
      S.addP=false; S.editingParticipantId=null; render(); toast(`Saved changes to ${editing.name}`);
      return;
    }
    const code=$('#apCode').value.trim(); if(!code){toast('A pseudoname / code is required');return;}
    if(S.participants.some(p=>(p.code||p.id)===code||p.id===code)){toast('That code is already in use');return;}
    S.participants.push({id:code,code,name:$('#apName').value.trim()||code,email:$('#apEmail').value.trim(),phone:$('#apPhone').value.trim(),detail:'added',mode:'physical',consent:{given:false},progress:progressTo(-1,-1),notify:false,active:null,findings:'',arts:0});
    S.addP=false;render();toast(`Added participant ${code}`);
  }
  else if(act==='goAssign'){S.assign.participant=id;S.rtab='assign';render();}
  else if(act==='openArts'){e.preventDefault();S.selParticipant=id;S.rtab='analysis';render();}
  else if(act==='useTask'){const t=taskById(id);S.assign.activity=t.stage;S.assign.taskId=t.id;S.assign.garmentId=t.garmentId;S.assign.cxFilter='all';S.rtab='assign';render();toast(`Task ${t.id} loaded into assignment`);}
  else if(act==='exportZip'){exportZip();}
  else if(act==='exportFolder'){exportFolder();}
  else if(act==='dlTaskFile'){const me=S.participants.find(p=>p.id===S.curUser);if(me&&me.active){const g=garment(me.active.garmentId);downloadJSON(buildTaskFile(me.active,g),`task-${me.active.stage}-${(g&&g.name?g.name.replace(/\s+/g,'-'):'garment')}.json`);toast('Task file downloaded — open it in Panel Studio');}}
  else if(act==='dlTaskCard'){const t=taskById(id);if(t){const g=garment(t.garmentId);downloadJSON(buildTaskFile({stage:t.stage,cx:t.cx,line:t.line,garmentId:t.garmentId,tray:null},g),`task-${t.id}.json`);toast('Task file downloaded');}}
  else if(act==='rmUpload'){const me=S.participants.find(p=>p.id===S.curUser);if(me&&me.active){const st=me.active.stage;if(me.work&&me.work[st]&&me.work[st].uploads){me.work[st].uploads.splice(+el.dataset.i,1);render();}}}
  else if(act==='saveWork'){if(CUR_WS)CUR_WS.save();toast('Composition saved to your record');}
  else if(act==='toggleDistractor'){S.assign.distractors[el.dataset.k]=!S.assign.distractors[el.dataset.k];render();}
  else if(act==='showAddT'){S.addT=true;S.editingGarmentId=null;S.confirmDel=null;render();}
  else if(act==='editGarment'){
    const g=S.garments.find(x=>x.id===id); if(!g) return;
    S.editingGarmentId=g.id;
    S.addTData={
      name:g.name||'', type:g.type||'', cx:g.cx||'s',
      stages:{pretest:false,s1:false,s2:false,s3:false,posttest:false},
      fullImg:g.fullImg||null, frontBackImg:g.frontBackImg||null, flatSketchImg:g.flatSketchImg||null,
      panelImgs:(g.panelImgs||[]).slice(),
      arrangementScaffold:g.arrangementScaffold||null,
      halfArrangementSvg:g.halfArrangementSvg||null, halfArrangementSvgName:g.halfArrangementSvgName||'',
      fullArrangementSvg:g.fullArrangementSvg||null, fullArrangementSvgName:g.fullArrangementSvgName||'',
      fullArrangementPng:g.fullArrangementPng||null,
      fullArrangementPdf:g.fullArrangementPdf||null, fullArrangementPdfName:g.fullArrangementPdfName||'',
      solutionImagePng:g.solutionImagePng||null, solutionImagePngName:g.solutionImagePngName||'',
      markedSets:(g.markedSets&&g.markedSets.length===2?g.markedSets:[{full:null,frontBack:null,flatSketch:null},{full:null,frontBack:null,flatSketch:null}]).map(ms=>({...ms})),
      desc:g.desc||''
    };
    (g.stages||[]).forEach(s=>{ if(S.addTData.stages.hasOwnProperty(s)) S.addTData.stages[s]=true; });
    S.addT=true; S.confirmDel=null; render();
  }
  else if(act==='cancelAddT'){S.addT=false;S.editingGarmentId=null;render();}
  else if(act==='setTCx'){captureAddT();S.addTData.cx=el.dataset.k;render();}
  else if(act==='toggleStage'){captureAddT();S.addTData.stages[el.dataset.k]=!S.addTData.stages[el.dataset.k];render();}
  else if(act==='clearPanels'){captureAddT();S.addTData.panelImgs=[];render();}
  else if(act==='submitAddT'){
    captureAddT();const d=S.addTData;
    if(!(d.name||'').trim()){toast('Give the garment a name');return;}
    const stages=Object.keys(d.stages).filter(k=>d.stages[k]);
    if(!stages.length){toast('Tag at least one stage');return;}

    if(S.editingGarmentId){
      const g=S.garments.find(x=>x.id===S.editingGarmentId);
      if(!g){toast('That garment no longer exists');S.addT=false;S.editingGarmentId=null;render();return;}
      g.name=d.name.trim(); g.type=(d.type||'').trim()||'Garment'; g.cx=d.cx; g.desc=(d.desc||'').trim();
      g.img=d.fullImg; g.fullImg=d.fullImg; g.frontBackImg=d.frontBackImg; g.flatSketchImg=d.flatSketchImg;
      g.panelImgs=d.panelImgs.slice();
      g.arrangementScaffold=d.arrangementScaffold;
      g.halfArrangementSvg=d.halfArrangementSvg; g.halfArrangementSvgName=d.halfArrangementSvgName;
      g.fullArrangementSvg=d.fullArrangementSvg; g.fullArrangementSvgName=d.fullArrangementSvgName;
      g.fullArrangementPng=d.fullArrangementPng;
      g.fullArrangementPdf=d.fullArrangementPdf; g.fullArrangementPdfName=d.fullArrangementPdfName;
      g.solutionImagePng=d.solutionImagePng; g.solutionImagePngName=d.solutionImagePngName;
      g.markedSets=d.markedSets.map(ms=>({...ms})); g.stages=stages;
      g.panels=d.panelImgs.length?d.panelImgs.map(()=>'bodice'):['bodice','back'];
      // Reconcile tasks: drop this garment's existing tasks and recreate them
      // to match the current stage tags/difficulty, rather than leaving
      // stale tasks around for stages that got un-tagged.
      for(let i=TASKS.length-1;i>=0;i--){ if(TASKS[i].garmentId===g.id) TASKS.splice(i,1); }
      stages.filter(s=>WORKSHOP_STAGES.includes(s)).forEach(s=>{const t={id:'tk'+(TASK_SEQ++),stage:s,cx:d.cx,garmentId:g.id};if(s==='s3')t.line=g.desc||'see garment image';TASKS.push(t);});
      S.addT=false; S.editingGarmentId=null;
      S.addTData=newAddTData();
      render(); toast(`Saved changes to "${g.name}"`);
      return;
    }

    const gid='gx'+(GARMENT_SEQ++);
    const g={id:gid,name:d.name.trim(),type:(d.type||'').trim()||'Garment',cx:d.cx,desc:(d.desc||'').trim(),
      img:d.fullImg,fullImg:d.fullImg,frontBackImg:d.frontBackImg,flatSketchImg:d.flatSketchImg,
      panelImgs:d.panelImgs.slice(),
      arrangementScaffold:d.arrangementScaffold,
      halfArrangementSvg:d.halfArrangementSvg, halfArrangementSvgName:d.halfArrangementSvgName,
      fullArrangementSvg:d.fullArrangementSvg, fullArrangementSvgName:d.fullArrangementSvgName,
      fullArrangementPng:d.fullArrangementPng,
      fullArrangementPdf:d.fullArrangementPdf, fullArrangementPdfName:d.fullArrangementPdfName,
      solutionImagePng:d.solutionImagePng, solutionImagePngName:d.solutionImagePngName,
      markedSets:d.markedSets.map(ms=>({...ms})),stages,
      panels:d.panelImgs.length?d.panelImgs.map(()=>'bodice'):['bodice','back']};
    S.garments.push(g);
    stages.filter(s=>WORKSHOP_STAGES.includes(s)).forEach(s=>{const t={id:'tk'+(TASK_SEQ++),stage:s,cx:d.cx,garmentId:gid};if(s==='s3')t.line=g.desc||'see garment image';TASKS.push(t);});
    S.addT=false;S.addTData=newAddTData();
    const ws=stages.filter(s=>WORKSHOP_STAGES.includes(s)).length;
    render();toast(`Added "${g.name}"${ws?` · ${ws} task${ws>1?'s':''} created`:''}`);
  }
  else if(act==='askDel'){S.confirmDel=id;render();}
  else if(act==='cancelDel'){S.confirmDel=null;render();}
  else if(act==='delGarment'){
    const gi=S.garments.findIndex(g=>g.id===id);if(gi>-1)S.garments.splice(gi,1);
    for(let i=TASKS.length-1;i>=0;i--){if(TASKS[i].garmentId===id)TASKS.splice(i,1);}
    if(S.assign.garmentId===id)S.assign.garmentId=null;
    if(S.assign.taskId&&(!taskById(S.assign.taskId)))S.assign.taskId=null;
    S.confirmDel=null;render();toast('Garment deleted');
  }
  else if(act==='rmBasicPanel'){BASIC_PANELS.splice(+el.dataset.i,1);render();}
  else if(act==='delTask'){
    const i=TASKS.findIndex(t=>t.id===id);if(i>-1)TASKS.splice(i,1);
    if(S.assign.taskId===id)S.assign.taskId=null;
    S.confirmDel=null;render();toast('Task deleted');
  }
  else if(act==='showPicker'){S.assign.forceShowPicker=true;render();}
  else if(act==='pkgCxFilter'){S.pkg.viewFilter[el.dataset.stage]=el.dataset.k;render();}
  else if(act==='pkgPickGarment'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const plan=ensurePlan(p);const cfg=plan.stages[el.dataset.stage];
    // Toggle: clicking the already-selected tile again deselects it (Priority 4)
    // — previously there was no way to undo an accidental selection short of
    // picking a different garment instead.
    cfg.garmentId = (cfg.garmentId===el.dataset.id) ? null : el.dataset.id;
    // render() fully replaces root.innerHTML, which resets scroll position --
    // restore it so picking a tile lower in a long list doesn't jump the
    // researcher back to the top with no visual confirmation of the selection.
    const y=window.scrollY;render();window.scrollTo(0,y);}}
  else if(act==='pkgPickTask'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const plan=ensurePlan(p);const cfg=plan.stages[el.dataset.stage];
    cfg.taskId = (cfg.taskId===el.dataset.id) ? null : el.dataset.id;
    const y=window.scrollY;render();window.scrollTo(0,y);}}
  else if(act==='pkgAutoGarment'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const stage=el.dataset.stage;const plan=ensurePlan(p);const cfg=plan.stages[stage];const viewCx=S.pkg.viewFilter[stage];let pool=S.garments.filter(gg=>(gg.stages||[]).includes(stage));if(viewCx&&viewCx!=='all')pool=pool.filter(gg=>gg.cx===viewCx);if(!pool.length){toast('No garments tagged for this stage'+(viewCx&&viewCx!=='all'?' at that difficulty':'')+'.');return;}const g=pool[Math.floor(Math.random()*pool.length)];cfg.garmentId=g.id;render();toast('Auto-selected: '+g.name);}}
  else if(act==='pkgAutoTask'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const stage=el.dataset.stage;const plan=ensurePlan(p);const cfg=plan.stages[stage];const viewCx=S.pkg.viewFilter[stage];let pool=tasksOf(stage);if(viewCx&&viewCx!=='all')pool=pool.filter(t=>t.cx===viewCx);if(!pool.length){toast('No tasks in this stage yet.');return;}const t=pool[Math.floor(Math.random()*pool.length)];cfg.taskId=t.id;render();toast('Auto-selected: '+garment(t.garmentId).name);}}
  else if(act==='pkgToggleDistractor'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const plan=ensurePlan(p);const cfg=plan.stages[el.dataset.stage];cfg.distractors=cfg.distractors||{};cfg.distractors[el.dataset.k]=!cfg.distractors[el.dataset.k];render();}}
  else if(act==='pkgMode'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){ensurePlan(p).mode=el.dataset.m;render();}}
  else if(act==='pkgSetExtractOption'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){ensurePlan(p).stages.s3.extractOption=el.dataset.opt;render();}}
  else if(act==='pkgToggleShareDocs'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const cfg=ensurePlan(p).stages[el.dataset.stage];cfg.shareDocs=!cfg.shareDocs;render();}}
  else if(act==='pkgShare'){const p=S.participants.find(x=>x.id===S.pkg.participant);if(p){const plan=ensurePlan(p);plan.share[el.dataset.k]=!plan.share[el.dataset.k];render();}}
  else if(act==='pkgToggleConsent'){
    // Consent is obtained manually/offline by the researcher (V2 architecture,
    // ARCHITECTURE_V2_VISION.md §6) — this records that fact directly, since the
    // legacy digital consent-capture flow (submitConsent()) is no longer reachable
    // for participants who never used the retired live workflow (Item 6 Phase A).
    // Reuses the existing p.consent.given field; no new consent concept, no schema change.
    const p=S.participants.find(x=>x.id===id);if(p){p.consent.given=!p.consent.given;render();toast(p.consent.given?`Consent recorded for ${p.name}`:`Consent unmarked for ${p.name}`);}
  }
  else if(act==='exportPackage'){exportPackage(id);}
  else if(act==='tagAllStagesAll'){
    const ALL=['pretest','s1','s2','s3','posttest'];
    S.garments.forEach(g=>{
      g.stages=ALL.slice();
      for(let i=TASKS.length-1;i>=0;i--){ if(TASKS[i].garmentId===g.id) TASKS.splice(i,1); }
      ALL.filter(s=>WORKSHOP_STAGES.includes(s)).forEach(s=>{const t={id:'tk'+(TASK_SEQ++),stage:s,cx:g.cx,garmentId:g.id};if(s==='s3')t.line=g.desc||'see garment image';TASKS.push(t);});
    });
    render();
    toast(`${S.garments.length} garment${S.garments.length===1?'':'s'} now tagged for every stage`);
  }
  else if(act==='bulkCx'){S.bulkImport.garments[+el.dataset.i].cx=el.dataset.k;render();}
  else if(act==='bulkTagStage'){S.bulkImport.tagStages[el.dataset.k]=!S.bulkImport.tagStages[el.dataset.k];render();}
  else if(act==='cancelBulkImport'){S.bulkImport=null;render();}
  else if(act==='confirmBulkImport'){confirmBulkImport();}
  else if(act==='activity'){S.assign.activity=el.dataset.k;S.assign.taskId=null;S.assign.garmentId=null;S.assign.cxFilter='all';render();}
  else if(act==='cxFilter'){S.assign.cxFilter=el.dataset.k;render();}
  else if(act==='pickTask'){const t=taskById(id);S.assign.taskId=t.id;S.assign.garmentId=t.garmentId;render();}
  else if(act==='pickGarment'){S.assign.garmentId=id;render();}
  else if(act==='autoSelect'){
    const a=S.assign;
    if(a.activity==='pretest'||a.activity==='posttest'){const g=autoGarment();if(!g){toast('No baseline garments yet — add one via a tagged task first');return;}a.garmentId=g.id;render();toast(`Auto-selected garment: ${g.name}`);}
    else if(WORKSHOP_STAGES.includes(a.activity)){const pool=a.cxFilter==='all'?tasksOf(a.activity):tasksOf(a.activity).filter(t=>t.cx===a.cxFilter);if(!pool.length){toast('No tasks at this difficulty');return;}const t=pool[Math.floor(Math.random()*pool.length)];a.taskId=t.id;a.garmentId=t.garmentId;render();toast(`Auto-picked ${t.id} · ${cxName(t.cx)}`);}
  }
  else if(act==='mode'){S.assign.mode=el.dataset.m;render();}
  else if(act==='share'){S.assign.share[el.dataset.k]=!S.assign.share[el.dataset.k];render();}
  else if(act==='activate'){
    const a=S.assign,p=S.participants.find(x=>x.id===a.participant);
    // Pre-Item-6 Phase A: starting a brand-new legacy session is retired.
    // An already-active participant's session is untouched either way — this
    // only blocks the null -> active transition (and, as a side benefit,
    // the pre-existing overwrite-on-reactivate behavior for anyone already live).
    if(p&&p.active){toast('Already live for this participant — use the conduct panel below, not Activate.');return;}
    if(p&&!p.active){toast('New legacy activation has been retired — use the package workflow for new participants.');return;}
    let stage=a.activity;
    let active={stage,mode:a.mode,share:{...a.share}};
    if(stage==='pretest'||stage==='posttest'){
      const g=a.garmentId?garment(a.garmentId):autoGarment();
      if(!g){toast('No baseline garments yet — add one via a tagged task first');return;}
      active.garmentId=g.id;active.cx=g.cx;
    }
    else{
      let t=a.taskId?taskById(a.taskId):autoTask(stage);
      if(!t){toast('No tasks in this stage yet — create one first');return;}
      active.taskId=t.id;active.garmentId=t.garmentId;active.cx=t.cx;active.line=t.line;
    }
    if(stage!=='pretest'&&stage!=='posttest'||stage==='pretest'||stage==='posttest'){
      const dg=(['pretest','s1'].includes(stage))?Object.keys(a.distractors||{}).filter(k=>a.distractors[k]&&k!==active.garmentId).map(garment).filter(Boolean):[];
      if(stage==='pretest'||stage==='posttest'){
        active.tray=buildTrayFromDescs(descFromBasicPanels(),dg);
      } else {
        const mainG=garment(active.garmentId);
        active.tray=buildTray(mainG,dg);
      }
      active.distractors=dg.map(x=>x.name);
      p.work=p.work||{};p.work[stage]={tray:active.tray.map(d=>({label:d.label,from:d.from})),uploads:(p.work[stage]&&p.work[stage].uploads)||[],scaffolds:(p.work[stage]&&p.work[stage].scaffolds)||{},presentedAt:new Date().toISOString()};
    }
    p.active=active;active.current='task';const k=stagePhaseKey(stage);if(p.progress[k]!==undefined)p.progress[k]='active';
    p.notify=false;
    S.assign.taskId=null;S.assign.garmentId=null;S.assign.forceShowPicker=false;
    render();toast(`Activated ${stage.toUpperCase()} for ${p.name} → live in their view`);
  }
  else if(act==='saveFindings'){const p=S.participants.find(x=>x.id===id);const ta=$('#findArea');if(ta)p.findings=ta.value;render();toast('Findings saved');}
  else if(act==='newLogin'){
    // Pre-Item-6 Phase A: new legacy participant sign-in is retired — package
    // import is now the only way to bring a new participant in. Everything
    // below is unchanged, kept intact for any already-active legacy session.
    toast('New sign-in here has been retired — participants now join via an imported package.');return;
    const v=$('#newName').value.trim();if(!v){toast('Enter a name to begin');return;}
    const nm=v.split('—')[0].trim()||v, dt=v.split('—')[1]?v.split('—')[1].trim():'new';
    const newId='SI-'+String(S.participants.length+1).padStart(2,'0');
    S.participants.push({id:newId,code:newId,name:nm,email:'',phone:'',detail:dt,mode:'physical',consent:{given:false},progress:progressTo(-1,-1),notify:false,active:null,findings:'',arts:0});
    S.curUser=newId;S.pstage='task';render();toast('Welcome! Please complete consent to begin.');}
  else if(act==='clearSig'){const c=$('#sigpad');if(c&&c._clear)c._clear();}
  else if(act==='submitConsent'){
    const me=S.participants.find(p=>p.id===S.curUser);
    const rec=document.querySelector('input[name="rec"]:checked');
    const age=$('#cAge').value.trim(),bg=$('#cBg').value.trim(),agree=$('#cAgree').checked,printn=$('#cPrint').value.trim();
    if(!age||!bg){toast('Please fill age and educational background');return;}
    if(!rec){toast('Please choose your recording preference');return;}
    if(!agree){toast('Please tick the consent statement');return;}
    if(!printn){toast('Please print your name to confirm');return;}
    me.consent={given:true,recording:rec.value,name:$('#cName').value.trim()||me.name,age,bg,exp:$('#cExp').value,print:printn,date:$('#cDate').value,signed:!!($('#sigpad')&&$('#sigpad')._has&&$('#sigpad')._has())};
    if($('#cName').value.trim())me.name=$('#cName').value.trim();
    render();toast('Consent recorded — thank you. Waiting for the researcher to activate a task.');
  }
  else if(act==='completeTask'){
    const me=S.participants.find(p=>p.id===S.curUser),a=me.active;
    const ups=(me.work&&me.work[a.stage]&&me.work[a.stage].uploads)||[];
    if(!ups.length && !S['warned_'+a.stage]){S['warned_'+a.stage]=true;toast('No solution uploaded yet — click again to complete anyway');return;}
    S['warned_'+a.stage]=false;
    const k=stagePhaseKey(a.stage);if(me.progress[k]!==undefined)me.progress[k]='done';me.arts++;
    a.current='waiting';me.notify=true;render();toast('Task submitted · your researcher will continue');
  }
  else if(act==='submitInstr'){
    const me=S.participants.find(p=>p.id===S.curUser),a=me.active,st=a.stage,def=instrDef('survey',st);
    if(!me.surveys)me.surveys={};
    me.surveys[st]={title:def.title,submittedAt:new Date().toISOString(),responses:readSurvey(def)};
    const pk=surveyPhaseKey(st);if(pk&&me.progress[pk]!==undefined)me.progress[pk]='done';
    a.current='waiting';me.notify=true;render();toast('Survey submitted → researcher notified');
  }
  else if(act==='setCurrent'){const p=S.participants.find(x=>x.id===el.dataset.pid);if(p&&p.active){p.active.current=el.dataset.k;render();toast(`Participant now sees: ${INSTR_TITLE[el.dataset.k]||'Task'}`);}}
  else if(act==='markInstr'){const p=S.participants.find(x=>x.id===el.dataset.pid);if(!p||!p.active)return;const k=el.dataset.k,st=p.active.stage;
    const pk=k==='task'?stagePhaseKey(st):instrPhaseKey(k,st);if(pk&&p.progress[pk]!==undefined)p.progress[pk]='done';
    if(RESEARCHER_LED[k]){const map=INSTR_KIND[k];if(!p[map])p[map]={};const note=$('#note_'+k);p[map][st]={conductedAt:new Date().toISOString(),notes:note?note.value:''};}
    if(p.active.current===k)p.active.current='waiting';render();toast(`${INSTR_TITLE[k]||'Task'} marked complete`);}
  else if(act==='endSession'){const p=S.participants.find(x=>x.id===el.dataset.pid);if(p){p.active=null;p.notify=false;render();toast('Session ended · participant released');}}
});

root.addEventListener('change',e=>{
  if(e.target.id==='assignP'){S.assign.participant=e.target.value||null;S.assign.forceShowPicker=false;render();}
  if(e.target.id==='pkgP'){S.pkg.participant=e.target.value||null;render();}
  if(e.target.id==='bulkImportInput'){handleBulkImportFiles(e.target.files);}
  if(e.target.dataset&&e.target.dataset.act==='bulkRename'){const bi=S.bulkImport;if(bi)bi.garments[+e.target.dataset.i].name=e.target.value;}
  if(e.target.id==='anaSel'){S.selParticipant=e.target.value||null;render();}
  if(e.target.id==='atFullImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.fullImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atFBImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.frontBackImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atFlatImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.flatSketchImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atMarkedImg'){/* legacy id no longer used */}
  if(e.target.id&&e.target.id.indexOf('atMarked_')===0){
    const m=e.target.id.match(/^atMarked_(\d)_(full|fb|flat)$/);
    if(m){const f=e.target.files[0];if(f){captureAddT();const idx=+m[1],slot=m[2]==='fb'?'frontBack':m[2]==='flat'?'flatSketch':'full';
      readImg(f).then(dUrl=>{S.addTData.markedSets[idx][slot]=dUrl;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  }
  if(e.target.id==='atArrangementScaffold'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.arrangementScaffold=d;render();toast('Arrangement scaffold attached: '+f.name);}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  // ── Stage asset roles (Priority 2 / Option C) — same readImg()-then-store
  // pattern as every upload above; readImg() reads any file type as a data
  // URL, it's not actually image-specific despite the name, so it works
  // unchanged for the PDF/SVG roles too. One small table instead of six
  // near-identical blocks, since the only real difference between them is
  // which addTData field(s) each writes to. ──
  const ASSET_ROLE_INPUTS={
    atHalfSvg:{field:'halfArrangementSvg',nameField:'halfArrangementSvgName',label:'Half Panel Arrangement SVG'},
    atFullSvg:{field:'fullArrangementSvg',nameField:'fullArrangementSvgName',label:'Full Panel Arrangement SVG'},
    atFullPng:{field:'fullArrangementPng',label:'Full Panel Arrangement PNG'},
    atFullPdf:{field:'fullArrangementPdf',nameField:'fullArrangementPdfName',label:'Full Panel Arrangement PDF'},
    atSolutionPng:{field:'solutionImagePng',nameField:'solutionImagePngName',label:'Researcher Solution PNG'}
  };
  if(ASSET_ROLE_INPUTS[e.target.id]){
    const role=ASSET_ROLE_INPUTS[e.target.id];const f=e.target.files[0];
    if(f){captureAddT();readImg(f).then(d=>{S.addTData[role.field]=d;if(role.nameField)S.addTData[role.nameField]=f.name;render();toast(role.label+' attached: '+f.name);})
      .catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}
  }
  if(e.target.id&&e.target.id.indexOf('scf_')===0){const parts=e.target.id.split('_');const key=parts[1];const pid=parts.slice(2).join('_');const p=S.participants.find(x=>x.id===pid);const f=e.target.files[0];if(p&&p.active&&f){const st=p.active.stage;p.work=p.work||{};p.work[st]=p.work[st]||{};p.work[st].scaffolds=p.work[st].scaffolds||{};readImg(f).then(d=>{p.work[st].scaffolds[key]={label:e.target.dataset.role||key,name:f.name,type:f.type,dataUrl:d};render();toast('Scaffold added — participant can now see it');}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='solUpload'){const me=S.participants.find(p=>p.id===S.curUser);if(me&&me.active){const st=me.active.stage;const fs=[...e.target.files];if(fs.length){me.work=me.work||{};me.work[st]=me.work[st]||{uploads:[]};me.work[st].uploads=me.work[st].uploads||[];Promise.all(fs.map(f=>readImg(f).then(d=>({name:f.name,type:f.type,size:f.size,dataUrl:d,at:new Date().toISOString()})))).then(arr=>{me.work[st].uploads=me.work[st].uploads.concat(arr);render();toast(`${arr.length} file${arr.length>1?'s':''} uploaded`);}).catch(err=>{console.error(err);alert('One of those files could not be read: '+(err&&err.message||err)+'\n\nTry uploading them one at a time to find which one is the problem.');});}}}
  if(e.target.id==='atPImgs'){const fs=[...e.target.files];if(fs.length){captureAddT();Promise.all(fs.map(readImg)).then(arr=>{S.addTData.panelImgs=S.addTData.panelImgs.concat(arr);render();}).catch(err=>{console.error(err);alert('One of those panel images could not be read: '+(err&&err.message||err));});}}
  if(e.target.id==='atBasicPanels'){const fs=[...e.target.files];if(fs.length){Promise.all(fs.map(readImg)).then(arr=>{BASIC_PANELS=BASIC_PANELS.concat(arr);render();toast(`${arr.length} panel${arr.length>1?'s':''} added to the basic set`);}).catch(err=>{console.error(err);alert('One of those panel images could not be read: '+(err&&err.message||err));});}}
});

render();
</script>
</body>
</html>
