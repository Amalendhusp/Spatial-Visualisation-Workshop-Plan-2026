<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workshop Console — Flat ↔ Form (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --paper:#F1EFE7; --paper-2:#E9E6DB; --card:#FBFAF5;
    --ink:#1A1B24; --ink-soft:#54545f; --ink-faint:#8a8a93;
    --mat:#13322D; --mat-2:#0e2723; --mat-line:#245049; --chalk:#EDEAE0;
    --digital:#2E54F0; --digital-ink:#1c39b8;
    --physical:#BC5A28; --physical-ink:#9a4719;
    --think:#6B3FD4; --survey:#B4820F; --interview:#1E7E6E; --hi:#E8A11C;
    --done:#2f8f5b; --line:#C9C5B8; --r:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--hi);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--digital);outline-offset:2px;border-radius:4px}
  .mono{font-family:"JetBrains Mono",monospace}
  h1,h2,h3,h4,.disp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}

  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px) saturate(1.2);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:1240px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
  .brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
  .brand .sw{width:14px;height:14px;border:1.6px solid var(--ink);position:relative}
  .brand .sw::after{content:"";position:absolute;inset:2px 2px auto auto;width:5px;height:5px;background:var(--hi)}
  .brand small{font-family:"JetBrains Mono";font-weight:400;font-size:10px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;border-radius:5px}
  .pswitch{margin-left:auto;display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .pswitch button{border:0;background:transparent;font-family:"JetBrains Mono";font-size:12px;font-weight:600;letter-spacing:.04em;padding:7px 16px;border-radius:999px;color:var(--ink-soft)}
  .pswitch button.on{background:var(--ink);color:var(--chalk)}
  .who{font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .who select{font-family:"JetBrains Mono";font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--card);color:var(--ink)}

  .shell{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:212px 1fr;gap:22px}
  .shell.solo{grid-template-columns:1fr;max-width:820px}
  nav.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
  nav.side .nh{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin:6px 8px 8px}
  nav.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;width:100%;padding:10px 12px;border-radius:9px;font-family:"Bricolage Grotesque";font-weight:600;font-size:15px;color:var(--ink-soft)}
  nav.side button .ic{width:18px;height:18px;color:var(--ink-faint)}
  nav.side button.on{background:var(--ink);color:var(--chalk)}
  nav.side button.on .ic{color:var(--hi)}
  nav.side button:not(.on):hover{background:var(--paper-2)}
  nav.side .badge{margin-left:auto;font-family:"JetBrains Mono";font-size:10px;font-weight:700;background:var(--hi);color:var(--ink);border-radius:999px;padding:2px 7px;min-width:18px;text-align:center}

  main.view{min-width:0}
  .page-head{margin-bottom:18px}
  .page-head .k{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
  .page-head h2{font-size:clamp(24px,3.4vw,34px);margin-top:5px}
  .page-head p{color:var(--ink-soft);max-width:66ch;margin:8px 0 0;font-size:15.5px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spacer{flex:1}.muted{color:var(--ink-soft)}.faint{color:var(--ink-faint)}
  .mlabel{font-family:"JetBrains Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--chalk);border-radius:9px;padding:9px 15px;font-family:"JetBrains Mono";font-size:12.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.blue{background:var(--digital);border-color:var(--digital)}
  .btn.sm{padding:6px 11px;font-size:11.5px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .cx{display:inline-flex;align-items:center;gap:7px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .cx i{width:7px;height:7px;border-radius:50%}
  .cx.s i{background:var(--done)} .cx.m i{background:var(--survey)} .cx.c i{background:var(--physical)}
  .tag{font-family:"JetBrains Mono";font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .tag.s{background:#dcefe3;color:#1e5f3e} .tag.m{background:#f3e7c4;color:#7a5c10} .tag.c{background:#f0ddd0;color:#8a3d16}
  .tag.phys{background:#f1ddd0;color:var(--physical-ink)} .tag.dig{background:#dde2fb;color:var(--digital-ink)}
  .tag.ok{background:#dcefe3;color:#1e5f3e} .tag.wait{background:#f6e6c2;color:#7a5c10}

  .strip{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  .seg{position:relative;width:24px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:"JetBrains Mono";font-size:8px;font-weight:700;color:var(--ink-faint)}
  .seg.done{background:var(--done);border-color:var(--done);color:#eafff3}
  .seg.active{border-color:var(--hi);color:var(--physical-ink);box-shadow:0 0 0 0 rgba(232,161,28,.55);animation:pz 1.8s infinite}
  .seg.divider{width:8px;border:0;background:transparent}
  @keyframes pz{70%{box-shadow:0 0 0 6px rgba(232,161,28,0)}100%{box-shadow:0 0 0 0 rgba(232,161,28,0)}}

  .prow{display:grid;grid-template-columns:1.5fr 2.7fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .pname{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
  .pname .dotn{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
  .pname .dotn.notify{background:var(--hi);box-shadow:0 0 0 0 rgba(232,161,28,.5);animation:pz 1.6s infinite}
  .pid{font-family:"JetBrains Mono";font-size:10.5px;color:var(--ink-faint)}

  .stagehead{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
  .stagehead .sn{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;color:var(--ink)}
  .stagehead .nm{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px}
  .stagehead .vb{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
  .stagehead:first-of-type{margin-top:6px}

  .gcard{display:flex;flex-direction:column;gap:10px}
  .gthumb{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;height:104px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
  .gthumb svg{height:74px;width:auto}
  .tnote{font-size:14px;color:var(--ink-soft)}
  .panelchips{display:flex;flex-wrap:wrap;gap:5px}
  .pchip{font-family:"JetBrains Mono";font-size:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
  .pchip svg{height:14px;width:14px}

  .seltile{border:1.5px solid var(--line);border-radius:11px;padding:12px;background:var(--card);cursor:pointer;display:flex;gap:11px;align-items:center}
  .seltile.sel{border-color:var(--ink);background:var(--paper-2)}
  .seltile .mini{width:44px;height:44px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;flex:none}
  .seltile .mini svg{height:32px}
  .modepick{display:flex;gap:8px;flex-wrap:wrap}
  .modepick button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 13px;font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft)}
  .modepick button.on{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .filterchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filterchips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft)}
  .filterchips button.on{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .checks{display:flex;gap:8px;flex-wrap:wrap}
  .chk{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-family:"JetBrains Mono";font-size:11.5px;color:var(--ink-soft);user-select:none;cursor:pointer}
  .chk.on{border-color:var(--ink);color:var(--ink)}
  .chk .bx{width:14px;height:14px;border:1.5px solid var(--ink-faint);border-radius:4px;display:grid;place-items:center}
  .chk.on .bx{background:var(--ink);border-color:var(--ink)}
  .chk.on .bx::after{content:"✓";color:var(--chalk);font-size:10px;line-height:1}

  .matrix{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
  table.mx{border-collapse:collapse;width:100%;font-family:"JetBrains Mono";font-size:11px}
  table.mx th,table.mx td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.mx thead th{position:sticky;top:0;background:var(--paper-2);color:var(--ink-soft);font-weight:500;letter-spacing:.04em;font-size:10px}
  table.mx td.name{text-align:left;font-family:"Bricolage Grotesque";font-weight:700;font-size:13px}
  .cell{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
  .cell.done{background:var(--done);border-color:var(--done)}.cell.active{background:var(--hi);border-color:var(--hi)}

  .chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:6px 0 0}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bcol .bars{display:flex;gap:5px;align-items:flex-end;height:100%}
  .bcol .bar{width:16px;border-radius:4px 4px 0 0}
  .bcol .lab{font-family:"JetBrains Mono";font-size:10px;color:var(--ink-soft);text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .legend span{display:flex;align-items:center;gap:7px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft)}
  .legend i{width:13px;height:9px;border-radius:2px}

  textarea.find,input.txt,select.txt{width:100%;font-family:"Newsreader";font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--card);color:var(--ink);resize:vertical}
  select.txt{font-family:"JetBrains Mono";font-size:13px}
  textarea.find{min-height:120px}
  .saved{background:var(--paper-2);border:1px dashed var(--line);border-radius:10px;padding:13px 14px;font-size:15px}
  .artrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
  .artrow:last-child{border:0}
  .artrow .ai{width:30px;height:30px;border-radius:7px;background:var(--paper-2);display:grid;place-items:center;color:var(--ink-soft)}
  .artrow a{font-family:"JetBrains Mono";font-size:12.5px;color:var(--digital-ink);text-decoration:none}.artrow a:hover{text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--chalk);border-radius:11px;padding:13px 18px;font-family:"JetBrains Mono";font-size:13px;display:flex;align-items:center;gap:11px;z-index:80;transition:.3s;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .d{width:9px;height:9px;border-radius:50%;background:var(--hi)}

  .pview{max-width:740px;margin:0 auto}
  .login{text-align:center;padding:50px 24px}
  .login svg{height:90px;margin-bottom:20px}.login h2{font-size:30px;margin-bottom:6px}
  .login .field{max-width:360px;margin:18px auto 0;text-align:left}
  .ptask-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .ptask-head .tnum{font-family:"Bricolage Grotesque";font-weight:800;font-size:46px;line-height:.85;color:var(--ink)}
  .refer{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .refer .rt{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:120px}
  .refer .rt .k{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .refer .rt .v{font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;margin-top:3px}
  .psteps{list-style:none;margin:18px 0 0;padding:0;position:relative}
  .psteps::before{content:"";position:absolute;left:14px;top:5px;bottom:14px;width:2px;background:var(--line)}
  .psteps li{position:relative;padding:0 0 14px 42px;font-size:16px}
  .psteps li .n{position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono";font-weight:700;font-size:12px;color:var(--ink-soft)}
  .scaffold-note{margin-top:14px;background:var(--mat);color:var(--chalk);border-radius:11px;padding:13px 15px;display:flex;gap:11px;align-items:center;font-size:14px}
  .scaffold-note .si{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--hi);flex:none}
  .workspace-mock{margin-top:16px;border:2px dashed var(--line);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-family:"JetBrains Mono";font-size:12.5px;text-align:center;background:repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(0,0,0,.015) 12px,rgba(0,0,0,.015) 24px)}
  .recbar{display:flex;align-items:center;gap:9px;font-family:"JetBrains Mono";font-size:11.5px;color:var(--ink-soft);margin-top:14px}
  .recbar .rec{width:9px;height:9px;border-radius:50%;background:#c0392b;animation:pz2 2s infinite}
  @keyframes pz2{0%,100%{opacity:1}50%{opacity:.3}}
  .empty{text-align:center;padding:54px 20px;color:var(--ink-soft)}
  .empty svg{height:60px;margin-bottom:16px;color:var(--ink-faint)}.empty h3{font-size:22px;margin-bottom:6px}

  .doc-head{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 20px;margin-bottom:16px}
  .doc-head .t{font-size:23px}
  .doc-head .meta{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.7}
  .infosheet{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px 22px}
  .infosheet h4{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 6px}
  .infosheet h4:first-child{margin-top:0}
  .infosheet p{margin:0 0 8px;font-size:15px;color:#2c2d38}
  .infosheet ul{margin:0 0 8px;padding-left:18px;font-size:14.5px;color:#2c2d38}.infosheet li{margin-bottom:4px}
  .form-field{margin-top:14px}
  .form-field label.q{display:block;font-size:15px;margin-bottom:7px}
  .form-field label.q .req{color:var(--physical);font-family:"JetBrains Mono";font-size:11px}
  .yn{display:flex;gap:10px;flex-wrap:wrap}
  .yn label{cursor:pointer;border:1.5px solid var(--line);border-radius:9px;padding:9px 16px;font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
  .yn input{position:absolute;opacity:0;width:0;height:0}
  .yn input:checked + label{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
  .consent-stmt{display:flex;gap:11px;align-items:flex-start;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:14px;font-size:15px}
  .consent-stmt input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--ink)}
  .sigwrap{border:1.5px dashed var(--line);border-radius:11px;background:var(--card);position:relative}
  canvas#sigpad{display:block;width:100%;height:120px;border-radius:11px;touch-action:none;cursor:crosshair}
  .sighint{position:absolute;left:14px;bottom:8px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);pointer-events:none}

  .survey-q{padding:18px 0;border-bottom:1px solid var(--line)}.survey-q:last-child{border:0}
  .survey-q .qn{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);font-weight:700}
  .survey-q .qt{font-size:16px;margin:5px 0 11px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .survey-q .qtype{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink-faint)}
  .likert{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .likert .ends{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint)}
  .likert .opt input{position:absolute;opacity:0;width:0;height:0}
  .likert .opt label{cursor:pointer;width:38px;height:38px;border:1.5px solid var(--line);border-radius:9px;display:grid;place-items:center;font-family:"JetBrains Mono";font-size:13px;color:var(--ink-soft)}
  .likert .opt input:checked + label{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt-row{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:15px;color:#2c2d38}
  .opt-row input{position:absolute;opacity:0;width:0;height:0}
  .opt-row .mk{width:18px;height:18px;border:1.8px solid var(--ink-faint);flex:none;display:grid;place-items:center}
  .opt-row.radio .mk{border-radius:50%}.opt-row.check .mk{border-radius:5px}
  .opt-row input:checked ~ .mk{background:var(--ink);border-color:var(--ink)}
  .opt-row input:checked ~ .mk::after{content:"";width:8px;height:8px;background:var(--chalk);border-radius:inherit}
  .opt-row:has(input:checked){border-color:var(--ink);background:var(--paper-2)}
  .q-open textarea{width:100%;min-height:84px;font-family:"Newsreader";font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--card);resize:vertical}

  /* ---- participant workspace (drag-arrange A4 canvas) ---- */
  .ws2{margin-top:10px}
  .ws-tray{display:flex;gap:8px;overflow-x:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);min-height:86px;align-items:center}
  .ws-tray .ptile{flex:0 0 auto;width:66px;height:66px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;color:var(--ink);padding:4px}
  .ws-tray .ptile svg{height:30px}

//  CONSOLE STATE — SAVE / OPEN
//  The console has no backend at all — garments, tasks, basic panels and
//  participants exist only in this tab's memory. A refresh, crash, or
//  closed tab loses everything. This saves/restores the full state.
// ════════════════════════════════════════
let currentConsoleFileHandle = null;
let currentConsoleFileName = null;

function buildConsoleStatePayload(){
  return {
    flatform_console_state: true,
    version: 1,
    savedAt: new Date().toISOString(),
    garments: GARMENTS,
    tasks: TASKS,
    basicPanels: BASIC_PANELS,
    participants: PARTICIPANTS,
    seq: { garment: GARMENT_SEQ, task: TASK_SEQ },
    importedPackages: S.importedPackages,
  };
}

async function saveConsoleState(){
  let json;
  try { json = JSON.stringify(buildConsoleStatePayload()); }
  catch(e){ alert('Could not save: '+e.message); return; }

  // Prefer TRUE in-place overwrite where the browser supports it (Chrome,
  // Edge) — first Save asks where to save once, every Save after that
  // writes straight back to that same file.
  if (window.showSaveFilePicker) {
    try {
      if (!currentConsoleFileHandle) {
        currentConsoleFileHandle = await window.showSaveFilePicker({
          suggestedName: currentConsoleFileName || ('workshop-console-state-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.json'),
          types: [{ description: 'Workshop Console state', accept: {'application/json': ['.json']} }]
        });
      }
      const writable = await currentConsoleFileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      currentConsoleFileName = currentConsoleFileHandle.name;
      toast('Saved to "'+currentConsoleFileName+'" — Save again to update the same file');
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;

    }
  }

  // Fallback for browsers without the File System Access API (Safari,
  // Firefox) — reuse the same filename every time so it's at least
  // consistent; whether that replaces the previous download or adds "(1)"
  // is controlled by your browser's own download settings.
  const name = currentConsoleFileName || ('workshop-console-state-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.json');
  currentConsoleFileName = name;
  const blob = new Blob([json], {type:'application/json'});
  const reader = new FileReader();
  reader.onload = function(){
    const a=document.createElement('a');
    a.href=reader.result; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Saved as "'+name+'" — your browser controls whether this replaces the previous download or adds a copy');
  };
  reader.onerror = function(){ alert('Could not save (file read failed).'); };
  reader.readAsDataURL(blob);
}

// ── Operational metrics, derived from an imported package's sessions/syncLog.
// Malformed or incomplete records (missing required fields, unparsable
// timestamps) are silently excluded from the relevant calculation rather
// than counted as failures — a genuine snapshot_timeout/snapshot_error/
// restore_error event is a real signal and still counts; a structurally
// broken record is not a signal at all. ──
function computeOperationalMetrics(code){
  const entry = S.importedPackages && S.importedPackages[code];
  if(!entry) return null;
  const data = entry.data || {};
  const sessions = Array.isArray(data.sessions) ? data.sessions : [];
  const syncLog = Array.isArray(data.syncLog) ? data.syncLog : [];

  const validSessions = sessions.filter(s=>s && typeof s.startedAt==='string');
  const closedSessions = validSessions.filter(s=>typeof s.endedAt==='string');
  const durationsMs = closedSessions
    .map(s=>new Date(s.endedAt).getTime()-new Date(s.startedAt).getTime())
    .filter(ms=>Number.isFinite(ms) && ms>=0);
  const totalDurationMs = durationsMs.reduce((a,b)=>a+b,0);
  const avgDurationMs = durationsMs.length ? totalDurationMs/durationsMs.length : null;
  const reasonCounts = {pause:0, completed:0, replaced:0};
  closedSessions.forEach(s=>{ if(s.endedReason && reasonCounts.hasOwnProperty(s.endedReason)) reasonCounts[s.endedReason]++; });

  const sorted = [...validSessions].sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));
  const gapsMs = [];
  for(let i=1;i<sorted.length;i++){
    if(typeof sorted[i-1].endedAt !== 'string') continue;
    const gap = new Date(sorted[i].startedAt).getTime() - new Date(sorted[i-1].endedAt).getTime();
    if(Number.isFinite(gap) && gap>=0) gapsMs.push(gap);
  }

  const validSync = syncLog.filter(e=>e && typeof e.type==='string');
  const rawCounts = {};
  validSync.forEach(e=>{ rawCounts[e.type] = (rawCounts[e.type]||0)+1; });
  const snapshotSucceeded = rawCounts.snapshot_applied||0;
  const snapshotAttempts = snapshotSucceeded + (rawCounts.snapshot_timeout||0) + (rawCounts.snapshot_error||0);
  const restoreSucceeded = rawCounts.restore_sent||0;
  const restoreAttempts = restoreSucceeded + (rawCounts.restore_error||0);

  return {
    fileName: entry.fileName, importedAt: entry.importedAt,
    sessionCount: validSessions.length, closedSessionCount: closedSessions.length,
    openSessionCount: validSessions.length - closedSessions.length,
    totalDurationMs, avgDurationMs, reasonCounts,
    longestGapMs: gapsMs.length ? Math.max(...gapsMs) : null,
    sync: { snapshotAttempts, snapshotSucceeded, restoreAttempts, restoreSucceeded, rawCounts },
  };
}
function fmtDuration(ms){
  if(ms==null) return '—';
  const mins = Math.round(ms/60000);
  if(mins<60) return mins+'m';
  return Math.floor(mins/60)+'h '+(mins%60)+'m';
}
function operationalMetricsHTML(code){
  const m = computeOperationalMetrics(code);
  if(!m) return `<div class="mlabel" style="margin-top:14px">Session &amp; sync data</div><div class="faint" style="padding:8px 0">No returned file imported yet — use "Import participant's returned file" above.</div>`;
  const statusLabel = m.reasonCounts.completed>0 ? 'completed' : (m.openSessionCount>0 ? 'in progress' : 'paused, not yet finished');
  const gapNote = m.longestGapMs ? `Longest break between sessions: ${fmtDuration(m.longestGapMs)}` : '';
  const failedSnapshots = m.sync.snapshotAttempts - m.sync.snapshotSucceeded;
  const syncNote = m.sync.snapshotAttempts===0 ? '' :
    (failedSnapshots===0 ? 'Design tool connection: reliable throughout.' : `Design tool connection: ${failedSnapshots} of ${m.sync.snapshotAttempts} save attempts had trouble.`);
  return `<div class="mlabel" style="margin-top:14px">Session &amp; sync data</div>

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function dataUrlParts(d){const m=/^data:([^;]+);base64,(.*)$/.exec(d||'');if(!m)return null;let ext=(m[1].split('/')[1]||'png');ext=ext.replace('jpeg','jpg').replace('svg+xml','svg');return{ext,b64:m[2]};}
function downloadBlob(blob,name){
  // Use a data: URI instead of a blob: URL. blob: URLs are tied to the page's
  // origin — in a sandboxed preview or a file:// context that origin is "null",
  // and Safari can't navigate/download blob:null/... URLs at all; it instead
  // tries to open the blob URL as a real page, fails, and replaces the whole
  // tab with an error page (wiping out all in-memory state). data: URIs have
  // no such origin dependency and work the same everywhere.
  const reader = new FileReader();
  reader.onload = function(){
    const a=document.createElement('a');
    a.href=reader.result; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  reader.onerror = function(){
    // Fallback: original blob-URL approach, in case data: URL reading fails for some reason
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  reader.readAsDataURL(blob);
}

async function writeToDir(dirHandle,path,content,base64){
  const parts=path.split('/');const name=parts.pop();let d=dirHandle;
  for(const seg of parts){d=await d.getDirectoryHandle(seg,{create:true});}
  const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();
  if(base64){const bin=atob(content);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);await w.write(arr);}else{await w.write(content);}
  await w.close();
}

// ════════════════════════════════════════
//  BULK FOLDER IMPORT — select a whole folder of garment subfolders at
//  once (Full garment / Extract panel / One / Two / Group arrangement /
//  Individual Panels, optionally under Simple/Moderate/Complex), and
//  auto-sort every file into the right slot by matching folder/file names,
//  instead of uploading each file one at a time per garment.
// ════════════════════════════════════════
function classifyBulkFile(relPath){
  const parts=relPath.split('/');
  const fname=parts[parts.length-1];
  const lower=relPath.toLowerCase();
  const fnameLower=fname.toLowerCase();
  const has=(s,k)=>s.indexOf(k)>-1;

  // Basic panels (global set, not a per-garment folder)
  if(has(lower,'basic panel')) return {bucket:'basicPanel'};

  // Which reference-view slot does the FILENAME itself indicate?
  function viewSlot(s){
    if(has(s,'front')&&has(s,'back')) return 'frontBack';
    if(has(s,'flat')) return 'flatSketch';
    if(has(s,'full')) return 'full';
    return null;
  }
  const slot = viewSlot(fnameLower) || viewSlot(lower);

  // "Panel Arrangement Solution" (renamed from "Group arrangement") — the
  // PDF solution, ready for Clo3D import. Checked before the more generic
  // "panel arrangement" prefix match below.
  if(has(lower,'arrangement solution')||has(lower,'group arrangement')) return {bucket:'solution'};
  // "Panel Arrangement - Scaffold" (new) — a PNG shown as a scaffold
  // reference directly in the Panel Studio workspace, not a solution file.
  if(has(lower,'arrangement - scaffold')||has(lower,'arrangement scaffold')) return {bucket:'arrangementScaffold'};
  if(has(lower,'individual panel')) return {bucket:'panel'};
  if(has(lower,'extract panel')){
    const setIdx = has(lower,'/two/')||has(lower,'-two-')||/\btwo\b/.test(lower) ? 1 : 0; // default to option 1
    return {bucket:'marked', setIdx, slot: slot||'full'};
  }
  if(has(lower,'full garment')||slot) return {bucket:'ref', slot: slot||'full'};
  return {bucket:'other'};
}
function garmentNameFromPath(relPath){
  // The garment name is whichever folder directly contains the known
  // category subfolders (Extract panel / Full garment / Group arrangement /
  // Individual Panels) — walk the path and take the segment right before
  // the first recognized category segment.
  const parts=relPath.split('/');
  const catNames=['extract panel','full garment','group arrangement','individual panels','panel arrangement solution','panel arrangement - scaffold'];
  for(let i=1;i<parts.length;i++){
    if(catNames.includes(parts[i].toLowerCase())) return parts[i-1];
  }
  return parts.length>1?parts[0]:null;
}
function difficultyFromPath(relPath){
  const lower=relPath.toLowerCase();
  if(/(^|\/)simple(\/|$)/.test(lower)) return 's';
  if(/(^|\/)moderate(\/|$)/.test(lower)) return 'm';
  if(/(^|\/)complex(\/|$)/.test(lower)) return 'c';
  return null;
}
function handleBulkImportFiles(fileList){
  const files=[...fileList].filter(f=>f.webkitRelativePath);
  if(!files.length){ toast('No files found — make sure you selected a folder, not individual files.'); return; }
  const byGarment={}; // name -> {name, cx, full,frontBack,flat, panelFiles:[], solutionFile, marked:[{full,frontBack,flat},{full,frontBack,flat}]}
  let basicPanelFiles=[];
  let unmatched=0;

  files.forEach(f=>{
    const rel=f.webkitRelativePath;
    const cls=classifyBulkFile(rel);
    if(cls.bucket==='basicPanel'){ basicPanelFiles.push(f); return; }
    if(cls.bucket==='other'){ unmatched++; return; }
    const gname=garmentNameFromPath(rel);
    if(!gname){ unmatched++; return; }
    if(!byGarment[gname]) byGarment[gname]={name:gname, cx:difficultyFromPath(rel)||'s', full:null,frontBack:null,flat:null, panelFiles:[], solutionFile:null, arrangementScaffold:null, marked:[{full:null,frontBack:null,flat:null},{full:null,frontBack:null,flat:null}]};
    const g=byGarment[gname];
    if(cls.bucket==='ref'){ g[cls.slot==='frontBack'?'frontBack':cls.slot==='flatSketch'?'flat':'full']=f; }
    else if(cls.bucket==='panel'){ g.panelFiles.push(f); }
    else if(cls.bucket==='solution'){ if(!g.solutionFile || f.type==='application/pdf') g.solutionFile=f; }
    else if(cls.bucket==='arrangementScaffold'){ g.arrangementScaffold=f; }
    else if(cls.bucket==='marked'){ const slotKey=cls.slot==='frontBack'?'frontBack':cls.slot==='flatSketch'?'flat':'full'; g.marked[cls.setIdx][slotKey]=f; }
  });

  S.bulkImport = { garments: Object.values(byGarment), basicPanelFiles, unmatched, tagStages:{pretest:true,s1:true,s2:true,s3:true,posttest:true} };
  render();
}

async function confirmBulkImport(){
  const bi=S.bulkImport; if(!bi) return;
  const stages=Object.keys(bi.tagStages).filter(k=>bi.tagStages[k]);
  toast('Importing… this may take a moment for a lot of files');
  for(const g of bi.garments){
    try{
      const [fullImg,frontBackImg,flatSketchImg,solutionFile,arrangementScaffold,...panelImgs] = await Promise.all([
        g.full?readImg(g.full):null, g.frontBack?readImg(g.frontBack):null, g.flat?readImg(g.flat):null,
        g.solutionFile?readImg(g.solutionFile):null, g.arrangementScaffold?readImg(g.arrangementScaffold):null,
        ...g.panelFiles.map(readImg)
      ]);
      const markedSets = await Promise.all(g.marked.map(async ms=>({
        full: ms.full?await readImg(ms.full):null,
        frontBack: ms.frontBack?await readImg(ms.frontBack):null,
        flatSketch: ms.flat?await readImg(ms.flat):null,
      })));
      const gid='gx'+(GARMENT_SEQ++);
      const garmentObj={id:gid,name:g.name.trim()||'Garment',type:'Garment',cx:g.cx,desc:'',
        img:fullImg,fullImg,frontBackImg,flatSketchImg,
        panelImgs,solutionFile,solutionFileName:g.solutionFile?g.solutionFile.name:'',
        arrangementScaffold,
        markedSets,stages,
        panels:panelImgs.length?panelImgs.map(()=>'bodice'):['bodice','back']};
      S.garments.push(garmentObj);
      stages.filter(s=>WORKSHOP_STAGES.includes(s)).forEach(s=>{const t={id:'tk'+(TASK_SEQ++),stage:s,cx:g.cx,garmentId:gid};if(s==='s3')t.line='see garment image';TASKS.push(t);});
    }catch(err){ console.error(err); alert('Could not import "'+g.name+'": '+(err&&err.message||err)); }
  }
  if(bi.basicPanelFiles.length){
    try{ const arr=await Promise.all(bi.basicPanelFiles.map(readImg)); BASIC_PANELS=BASIC_PANELS.concat(arr); }
    catch(err){ console.error(err); alert('Some basic panel images could not be read: '+(err&&err.message||err)); }
  }
  S.bulkImport=null; render();
  toast('Import complete');
}

function conductPanel(p){
  const a=p.active, info=STAGEINFO[a.stage], cur=a.current||'task';

function buildParticipantPackage(p){
  const plan=ensurePlan(p);
  const stagesOut={};
  PKG_STAGE_ORDER.forEach(sk=>{
    const cfg=plan.stages[sk];
    let g=null,t=null,tray=[];
    if(sk==='pretest'||sk==='posttest'){
      g=cfg.garmentId?garment(cfg.garmentId):null;
      const dg=Object.keys(cfg.distractors||{}).filter(k=>cfg.distractors[k]).map(garment).filter(Boolean);
      tray=g?buildTrayFromDescs(descFromBasicPanels(),dg):[];
    } else {
      t=cfg.taskId?taskById(cfg.taskId):null;
      g=t?garment(t.garmentId):null;
      const dg=(sk==='s1'&&cfg.distractors)?Object.keys(cfg.distractors).filter(k=>cfg.distractors[k]&&(!t||k!==t.garmentId)).map(garment).filter(Boolean):[];
      tray=g?buildTray(g,dg):[];
    }
    stagesOut[sk]={
      assigned:!!g,
      cx:cfg.cx||(g?g.cx:'s'),
      garment:g?{id:g.id,name:g.name,type:g.type,cx:g.cx,fullImg:g.fullImg,frontBackImg:g.frontBackImg,flatSketchImg:g.flatSketchImg,arrangementScaffold:g.arrangementScaffold,solutionFile:g.solutionFile,solutionFileName:g.solutionFileName,markedSets:g.markedSets,desc:g.desc}:null,
      styleLine:(sk==='s3'&&t)?t.line:null,
      tray:tray,
      completed:false, completedAt:null,
      activityDraft:null,
      response:{survey:null,promptNotes:'',interviewNotes:'',uploads:[],submittedAt:null}
    };
  });
  return {
    flatform_participant_package:true, version:1, schemaVersion:2,
    createdAt:new Date().toISOString(),
    participant:{id:p.id,name:p.name,code:p.code||p.id,email:p.email||'',detail:p.detail||''},
    mode:plan.mode, share:{...plan.share},
    consent:{recording:p.consent?p.consent.recording||'no':'no', interactionLogging:false},
    progress:{currentStage:'pretest',completedStages:[],currentScreen:'brief'},
    sessions:[], eventLog:[], syncLog:[],
    stages:stagesOut
  };
}
function exportPackage(pid){
  const p=S.participants.find(x=>x.id===pid); if(!p) return;
  const pkg=buildParticipantPackage(p);
  downloadJSON(pkg, `participant-${(p.code||p.id).replace(/\s+/g,'-')}-package.json`);
  toast('Package exported for '+p.name+' — send this file to their machine');
}

function surveyQ(q,i){
  const tlabel={likert:'scale',single:'single choice',multi:'multiple choice',open:'open ended'}[q.t];
  let body='';
  if(q.t==='likert'){body=`<div class="likert"><span class="ends">${q.ends[0]}</span>${[1,2,3,4,5].map(n=>`<span class="opt"><input type="radio" name="q${i}" value="${n}" id="q${i}_${n}"><label for="q${i}_${n}">${n}</label></span>`).join('')}<span class="ends">${q.ends[1]}</span></div>`;}
  else if(q.t==='single'||q.t==='multi'){const type=q.t==='single'?'radio':'check';const input=q.t==='single'?'radio':'checkbox';body=`<div class="opts">${q.opts.map(o=>`<label class="opt-row ${type}"><input type="${input}" name="q${i}" value="${esc(o)}"><span class="mk"></span>${o}</label>`).join('')}</div>`;}
  else{body=`<div class="q-open"><textarea id="qopen${i}" placeholder="Type your answer…"></textarea></div>`;}
  return `<div class="survey-q"><div class="qn">Q${i+1}</div><div class="qt">${q.q}<span class="qtype">${tlabel}</span></div>${body}</div>`;
}
function readSurvey(def){return def.qs.map((q,i)=>{let ans;
  if(q.t==='likert'){const el=document.querySelector(`input[name="q${i}"]:checked`);ans=el?Number(el.value):null;}
  else if(q.t==='single'){const el=document.querySelector(`input[name="q${i}"]:checked`);ans=el?el.value:null;}
  else if(q.t==='multi'){ans=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(e=>e.value);}
  else{const el=document.getElementById('qopen'+i);ans=el?el.value.trim():'';}
  return {q:q.q,type:q.t,answer:ans};
});}

        <div class="sigwrap"><canvas id="sigpad"></canvas><span class="sighint" id="sigHint">sign here</span><button class="btn ghost sm" data-act="clearSig" style="position:absolute;top:8px;right:8px">Clear</button></div></div>

    </div>
  </main></div>`;
}

function initSig(){
  const c=$('#sigpad'); if(!c) return;
  const ctx=c.getContext('2d'); let drawing=false, has=false;
  function size(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1A1B24';}
  size();
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{drawing=true;has=true;const h=$('#sigHint');if(h)h.style.display='none';const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
  c._clear=()=>{ctx.clearRect(0,0,c.width,c.height);has=false;const h=$('#sigHint');if(h)h.style.display='block';};
  c._has=()=>has;
}

    const pk=k==='task'?stagePhaseKey(st):instrPhaseKey(k,st);if(pk&&p.progress[pk]!==undefined)p.progress[pk]='done';
    if(RESEARCHER_LED[k]){const map=INSTR_KIND[k];if(!p[map])p[map]={};const note=$('#note_'+k);p[map][st]={conductedAt:new Date().toISOString(),notes:note?note.value:''};}
    if(p.active.current===k)p.active.current='waiting';render();toast(`${INSTR_TITLE[k]||'Task'} marked complete`);}
  else if(act==='endSession'){const p=S.participants.find(x=>x.id===el.dataset.pid);if(p){p.active=null;p.notify=false;render();toast('Session ended · participant released');}}
});

root.addEventListener('change',e=>{
  if(e.target.id==='assignP'){S.assign.participant=e.target.value||null;S.assign.forceShowPicker=false;render();}
  if(e.target.id==='pkgP'){S.pkg.participant=e.target.value||null;render();}
  if(e.target.id==='bulkImportInput'){handleBulkImportFiles(e.target.files);}
  if(e.target.dataset&&e.target.dataset.act==='bulkRename'){const bi=S.bulkImport;if(bi)bi.garments[+e.target.dataset.i].name=e.target.value;}
  if(e.target.id==='anaSel'){S.selParticipant=e.target.value||null;render();}
  if(e.target.id==='atFullImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.fullImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atFBImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.frontBackImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atFlatImg'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.flatSketchImg=d;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='atMarkedImg'){/* legacy id no longer used */}
  if(e.target.id&&e.target.id.indexOf('atMarked_')===0){
    const m=e.target.id.match(/^atMarked_(\d)_(full|fb|flat)$/);
    if(m){const f=e.target.files[0];if(f){captureAddT();const idx=+m[1],slot=m[2]==='fb'?'frontBack':m[2]==='flat'?'flatSketch':'full';
      readImg(f).then(dUrl=>{S.addTData.markedSets[idx][slot]=dUrl;render();}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  }
  if(e.target.id==='atSolution'){const f=e.target.files[0];if(f){
    if(f.size>25*1024*1024)toast(`That PDF is ${(f.size/1024/1024).toFixed(1)}MB — this may take a moment.`);
    captureAddT();
    readImg(f).then(d=>{S.addTData.solutionFile=d;S.addTData.solutionFileName=f.name;render();toast('Solution file attached: '+f.name);})
      .catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err)+'\n\nTry re-exporting the PDF (a fresh export sometimes resolves this), or a smaller/simplified version if it\'s very large.');});
  }}
  if(e.target.id==='atArrangementScaffold'){const f=e.target.files[0];if(f){captureAddT();readImg(f).then(d=>{S.addTData.arrangementScaffold=d;render();toast('Arrangement scaffold attached: '+f.name);}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id&&e.target.id.indexOf('scf_')===0){const parts=e.target.id.split('_');const key=parts[1];const pid=parts.slice(2).join('_');const p=S.participants.find(x=>x.id===pid);const f=e.target.files[0];if(p&&p.active&&f){const st=p.active.stage;p.work=p.work||{};p.work[st]=p.work[st]||{};p.work[st].scaffolds=p.work[st].scaffolds||{};readImg(f).then(d=>{p.work[st].scaffolds[key]={label:e.target.dataset.role||key,name:f.name,type:f.type,dataUrl:d};render();toast('Scaffold added — participant can now see it');}).catch(err=>{console.error(err);alert('Could not read "'+f.name+'": '+(err&&err.message||err));});}}
  if(e.target.id==='solUpload'){const me=S.participants.find(p=>p.id===S.curUser);if(me&&me.active){const st=me.active.stage;const fs=[...e.target.files];if(fs.length){me.work=me.work||{};me.work[st]=me.work[st]||{uploads:[]};me.work[st].uploads=me.work[st].uploads||[];Promise.all(fs.map(f=>readImg(f).then(d=>({name:f.name,type:f.type,size:f.size,dataUrl:d,at:new Date().toISOString()})))).then(arr=>{me.work[st].uploads=me.work[st].uploads.concat(arr);render();toast(`${arr.length} file${arr.length>1?'s':''} uploaded`);}).catch(err=>{console.error(err);alert('One of those files could not be read: '+(err&&err.message||err)+'\n\nTry uploading them one at a time to find which one is the problem.');});}}}
  if(e.target.id==='atPImgs'){const fs=[...e.target.files];if(fs.length){captureAddT();Promise.all(fs.map(readImg)).then(arr=>{S.addTData.panelImgs=S.addTData.panelImgs.concat(arr);render();}).catch(err=>{console.error(err);alert('One of those panel images could not be read: '+(err&&err.message||err));});}}
  if(e.target.id==='atBasicPanels'){const fs=[...e.target.files];if(fs.length){Promise.all(fs.map(readImg)).then(arr=>{BASIC_PANELS=BASIC_PANELS.concat(arr);render();toast(`${arr.length} panel${arr.length>1?'s':''} added to the basic set`);}).catch(err=>{console.error(err);alert('One of those panel images could not be read: '+(err&&err.message||err));});}}
});

render();
</script>
</body>
</html>
